<style>

}

}

  <div class="head-row"><span class="pill">Segundo parcial: <b>miércoles 25/11/2026</b></span><span class="pill" id="countdown"></span><span class="pill">Recuperatorio: 02/12</span></div>
</div></header>

<script>
/* ======================= CONTENIDO ======================= */
const M = [];

/* ---------- 1. RESILIENCIA ---------- */
M.push({id:"resiliencia",n:"01",t:"Resiliencia y Optimización",fecha:"13/10 (T+P)",
fuente:"Teoría Resiliencia_y_optimización_2026.pdf + práctica node/110. Bibliografía: Oppenheimer cap. 5 (pp. 130-132); Limoncelli 2017 cap. 18 (pp. 321-333); Limoncelli 2014 cap. 4 (pp. 69-85).",
teo:[
{h:"Conceptos asociados: ¿qué puede salir mal?",b:`<div class="tbl"><table><tr><th>Concepto</th><th>Definición de la cátedra</th></tr>
<tr><td><b>Punto Único de Falla (SPoF)</b></td><td>Parte de un sistema que, si falla, impide que el sistema siga cumpliendo su objetivo</td></tr>
<tr><td><b>Resiliencia</b> (tolerancia a fallos)</td><td>Capacidad de un sistema para funcionar a pesar de fallos en algunos de sus elementos</td></tr>
<tr><td><b>Alta disponibilidad</b></td><td>Aumentar el tiempo de disponibilidad de un servicio para sus usuarios autorizados</td></tr>
<tr><td><b>Distribución de carga</b> (load sharing)</td><td>Distribuir entre dos o más elementos el trabajo necesario para brindar un servicio</td></tr>
<tr><td><b>Balanceo de carga</b> (load balance)</td><td>Distribuir <b>de forma eficiente</b> entre dos o más elementos ese trabajo</td></tr></table></div>
<div class="key">La diferencia entre load sharing y load balance es la palabra <b>eficiente</b>: repartir no es lo mismo que repartir bien.</div>`},
{h:"Redundancia",b:`<p><b>Redundancia:</b> utilizar dos o más componentes capaces de cumplir la misma función. El sistema debería seguir funcionando si se quita uno de ellos.</p>
<p>Persigue dos objetivos: <b>mejorar la eficiencia</b> y <b>mejorar la tolerancia a fallas</b>.</p>
<div class="key"><b>Moraleja de la cátedra:</b> la redundancia sin una buena administración no aporta valor al sistema.</div>
<p class="note"><b>Complemento (no está en las diapositivas, pero sirve para razonar):</b> A = MTBF / (MTBF + MTTR). En serie A = A₁·A₂ (baja); en paralelo A = 1 − (1−A₁)(1−A₂) (sube). 99,9 % ≈ 8,76 h de caída al año; 99,99 % ≈ 52,6 min; 99,999 % ≈ 5,26 min.</p>`},
{h:"Redundancia en capas",b:`<p>La cátedra combina las capas de TCP/IP con dos capas extra (<b>Usuario</b> arriba e <b>Infraestructura</b> abajo), y las relaciona con el <b>modelo jerárquico</b> de red: <b>Core</b>, <b>Distribution</b> y <b>Access</b>.</p>
<div class="tbl"><table><tr><th>Capa</th><th>Redundancia</th></tr>
<tr><td>Usuario</td><td>Múltiples operarios / administradores + documentación</td></tr>
<tr><td>Aplicación</td><td>DNS, CDN, Traefik, HAProxy, Nginx, DHCP, réplicas</td></tr>
<tr><td>Transporte</td><td>Balanceo a nivel transporte: HAProxy, Nginx, <b>Multipath TCP</b></td></tr>
<tr><td>Red</td><td>Routers y hosts: BGP, VRRP, CARP, HSRP, Varnish</td></tr>
<tr><td>Enlace</td><td>Enlaces lógicos: Link Aggregation/LACP, Bonding, MSTP, MPLS</td></tr>
<tr><td>Física</td><td>Enlace físico, hardware redundante (switch, servers, stacking)</td></tr>
<tr><td>Infraestructura</td><td>Energía eléctrica (UPS), control de temperatura (aires redundantes)</td></tr></table></div>`},
{h:"Patrones de diseño: maestro/esclavo",b:`<div class="tbl"><table><tr><th>Patrón</th><th>Funcionamiento</th><th>Pros</th><th>Contras</th></tr>
<tr><td><b>Maestro + cold spare</b></td><td>El servicio corre en el maestro; el spare está <b>apagado</b></td><td>Fácil de mantener</td><td>Recurso ocioso; requiere acción humana; debe configurarse al inicio</td></tr>
<tr><td><b>Maestro + hot spare</b></td><td>El spare está preparado y mantiene los datos <b>sincronizados</b></td><td>Poco tiempo de start-up</td><td>Recurso ocioso; requiere mantenimiento; requiere acción humana</td></tr>
<tr><td><b>Maestro/esclavos</b></td><td>Igual al anterior pero <b>automático</b>, con <b>heartbeat</b></td><td>Automático</td><td>Recurso ocioso; más configuración y monitoreo</td></tr>
<tr><td><b>Maestro / slave read only</b></td><td>Corre en ambos: escrituras en el master, lecturas en los dos</td><td>Distribuye la carga de lectura → mejor performance</td><td>Puede haber desfase entre master y slave</td></tr>
<tr><td><b>Maestro/Maestro</b></td><td>Ambos operan y hacen las mismas acciones</td><td>Distribuye la carga de lectura → mejor performance</td><td>Métodos de sincronización; posibilidad de <b>split brain</b></td></tr></table></div>
<p class="note"><b>Split brain:</b> los dos nodos creen ser el activo (por ejemplo, porque se cortó el enlace entre ellos) y actúan por separado, desincronizando los datos.</p>`},
{h:"Patrón balanceador de carga / réplicas",b:`<p><b>Balanceador:</b> recibe las peticiones al servicio y las reenvía según algún criterio a cada réplica. <b>Réplicas:</b> pueden recibir y resolver peticiones. Ejemplo clásico: servidor web.</p>
<div class="tbl"><table><tr><th>Pros</th><th>Contras</th></tr>
<tr><td>Mejor aprovechamiento de los recursos · mejor eficiencia · mayor escalabilidad · mayor disponibilidad · facilidad para actualizaciones y mantenimiento</td><td>Sincronización · más equipos para el mismo servicio · qué pasa con los “estados”</td></tr></table></div>
<p><b>Balanceador / réplicas + state:</b> los servicios que mantienen estado de conexiones y sesiones necesitan un elemento de sincronización entre réplicas, un <b>servidor de estado</b>. En servicios web, por ejemplo, hay que compartir la información de login en cookies entre las réplicas.</p>`},
{h:"Funciones y estrategias del balanceador",b:`<p><b>Funciones:</b></p><ol><li>Analizar las peticiones y decidir a qué servidor reenviarlas con un <b>algoritmo de planificación</b>.</li>
<li>Mantener un <b>listado de servidores disponibles</b> y su carga.</li>
<li>Proveer <b>redundancia</b> con unidades múltiples ante fallas.</li>
<li>Ofrecer <b>distribución según el contenido</b>, interpretando URLs o cookies.</li></ol>
<div class="tbl"><table><tr><th>Estrategia (load sharing)</th><th>Idea</th><th>En Nginx</th></tr>
<tr><td>Round Robin (RR)</td><td>En turno</td><td>por defecto</td></tr>
<tr><td>Weighted RR</td><td>En turno con pesos</td><td><code>weight=</code></td></tr>
<tr><td>Hashed</td><td>Según un hash (IP, URL…): mismo cliente, mismo servidor</td><td><code>ip_hash</code>, <code>hash</code></td></tr>
<tr><td>Least Loaded (LL)</td><td>Al menos cargado</td><td><code>least_conn</code></td></tr>
<tr><td>Least Loaded with Slow Start</td><td>Un servidor que recién entra recibe carga de a poco, para no saturarlo</td><td><code>slow_start</code> (Plus)</td></tr>
<tr><td>Utilization Limit</td><td>No supera un tope de uso por servidor</td><td><code>max_conns</code></td></tr>
<tr><td>Least Time / Least Latency</td><td>Al que responde más rápido</td><td><code>least_time</code> (Plus)</td></tr>
<tr><td>Power of Two Random Choices</td><td>Dos al azar, gana el menos cargado</td><td><code>random two</code></td></tr>
<tr><td>Cascade</td><td>Llena el primero y recién después pasa al siguiente</td><td>(<code>backup</code> se le parece)</td></tr></table></div>`},
{h:"DNS y CDN",b:`<p>Si un nombre tiene <b>varios registros A</b>, el DNS los devuelve rotando el orden (round-robin DNS): <code>dig +short netflix.com</code> devuelve varias IP en distinto orden. Con GeoDNS o una CDN, la respuesta cambia según el lugar de la consulta (fifa.com en DNS checker).</p>
<ul><li>Redundancia de <b>capa de aplicación</b>; sirve para cualquier servicio accedido por nombre (en correo, varios MX con prioridad).</li>
<li>Limitaciones: DNS no sabe si el servidor cayó y las respuestas quedan en caché según el <b>TTL</b>.</li>
<li><b>CDN (Content Delivery Network):</b> replica contenido en servidores de borde (<b>edge cache</b>) cerca del usuario; con <b>anycast</b> la misma IP se anuncia desde muchos lugares y la red lleva al cliente al más cercano. La cátedra recomienda el video de Lovato “Cómo funciona realmente una CDN: de Anycast a Edge Cache”.</li></ul>`},
{h:"Laboratorio: Nginx como proxy reverso",b:`<p>Experiencia II: el cliente (192.168.100.0/24) llega por el ISP a www.empresa.com (203.0.113.200), que es Nginx balanceando hacia tres servidores en 10.1.1.0/24.</p>
<pre><code>upstream backend {
    server 10.1.1.1;
    server 10.1.1.2;
    server 10.1.1.3;
}
server {
    listen 80;
    location / { proxy_pass http://backend; }
}</code></pre>
<p>Se valida con <code>nginx -t</code>. Si un servidor no responde se marca fallido (<code>max_fails</code>, <code>fail_timeout</code>); si caen <b>todos</b>, Nginx devuelve <b>502 Bad Gateway</b>. Se puede marcar un servidor como <code>backup</code> o <code>down</code>.</p>
<p>Rendimiento: <code>ab -n 1000 -c 10 http://IP/</code> (<code>-n</code> peticiones totales, <code>-c</code> concurrencia; mirar <i>Requests per second</i>).</p>`},
{h:"Laboratorio: IP virtual con UCARP / VRRP",b:`<p>Experiencia III: dos balanceadores (203.0.113.201 y .202) comparten la <b>IP virtual .200</b> de www.empresa.com, generada con <b>UCARP / VRRP</b>. Así se elimina el SPoF del balanceador.</p>
<p>El <b>master</b> responde por la IP virtual y envía anuncios periódicos; si el <b>backup</b> deja de recibirlos, toma la IP y envía un <b>ARP gratuito</b> con su MAC. En la captura se ve que la IP es la misma pero cambia la MAC.</p>
<div class="tbl"><table><tr><th>Protocolo</th><th>Origen</th><th>Detalles</th></tr>
<tr><td>VRRP</td><td>Estándar IETF (RFC 5798)</td><td>Protocolo IP 112, MAC virtual 00:00:5E:00:01:VRID</td></tr>
<tr><td>HSRP</td><td>Cisco, propietario</td><td>active/standby, UDP 1985</td></tr>
<tr><td>CARP</td><td>OpenBSD, libre (ucarp en Linux)</td><td>Nació por las patentes; también protocolo IP 112; anuncios autenticados</td></tr></table></div>
<div class="key">En el failover se <b>pierden las conexiones TCP</b> establecidas, porque el backup no tiene su estado (salvo sincronización, como conntrackd o pfsync). Si el nodo es un router sin NAT, el reenvío sigue sin problemas.</div>`},
{h:"Laboratorio: Multipath TCP (MPTCP)",b:`<p>Experiencia IV: el cliente tiene <b>dos caminos</b>, el ISP fijo y una <b>red móvil</b>. Con <b>MPTCP</b> una conexión TCP usa varios <i>subflujos</i> por distintas interfaces: si uno se cae, la conexión sigue por el otro de forma <b>transparente</b> para la aplicación. Es redundancia en la <b>capa de transporte</b>.</p>
<div class="tbl"><table><tr><th>Experiencia</th><th>Qué se agrega</th><th>SPoF que resuelve</th></tr>
<tr><td>I</td><td>Cliente → ISP → un único servidor www</td><td>Ninguno: el servidor es SPoF</td></tr>
<tr><td>II</td><td>Nginx como proxy reverso + 3 servidores</td><td>El servidor web</td></tr>
<tr><td>III</td><td>Dos balanceadores con IP virtual (UCARP/VRRP)</td><td>El balanceador</td></tr>
<tr><td>IV</td><td>MPTCP con red móvil de respaldo</td><td>El enlace del cliente</td></tr></table></div>`}
],

["¿Cuál es la moraleja de la cátedra sobre la redundancia?","Que sin una buena administración no aporta valor al sistema."],

teo:[
{h:"Qué es y por qué conviene",b:`<p>VoIP es el conjunto de protocolos y tecnologías que usan una red IP para establecer comunicaciones de voz o video. Preguntas que guían el tema: cómo se digitaliza la multimedia, cómo se transmite, cómo se establecen los canales y cómo conviven dispositivos de distintas capacidades.</p>
<p><b>Ventajas (según la cátedra):</b> menores costos; diseño de red más simple y reutilización de dispositivos; un solo cableado para datos y voz; terminales por hardware (teléfono IP) o software (softphone); administración y contabilidad más sencillas; no requiere personal especializado; agregar teléfonos es fácil.</p>`},
{h:"Arquitectura: tres grupos de protocolos",b:`<div class="tbl"><table><tr><th>Grupo</th><th>Protocolos</th><th>Para qué</th></tr>
<tr><td><b>Señalización</b></td><td>SIP, H.323, SCCP (Skinny, Cisco), IAX (Asterisk)</td><td>Localizar usuarios, establecer y terminar llamadas, características de la sesión</td></tr>
<tr><td><b>Transmisión de datos</b></td><td>RTP y RTCP</td><td>Encapsular audio y video, secuenciación, marcas de tiempo, identificación</td></tr>
<tr><td><b>Soporte</b></td><td>DHCP, NTP, TFTP/FTP, DNS</td><td>Autoconfiguración, QoS, AAA entre dominios</td></tr></table></div>
<div class="key">Con SIP + SDP participan <b>cuatro</b> protocolos propios de VoIP: SIP (señaliza), SDP (describe la sesión, viaja dentro de SIP), RTP (medios) y RTCP (control de los medios).</div>`},
{h:"SIP (RFC 3261)",b:`<p>Señalización en <b>texto plano UTF-8</b>, de petición/respuesta, parecido a HTTP. Puerto <b>5060</b> (TCP/UDP; 5061 con TLS).</p>
<p><b>Componentes:</b> <b>User Agent</b> (terminal; es UAC cuando pide y UAS cuando responde), <b>Registrar Server</b> (registra cuentas y su ubicación), <b>Proxy Server</b> (reenvía mensajes), <b>Redirect Server</b> (responde 3xx indicando a dónde ir).</p>
<p><b>URI:</b> <code>sip:usuario@dominio:puerto</code>, <code>sip:usuario@host:puerto</code>, <code>sip:número@dominio</code>.</p>
<div class="tbl"><table><tr><th>Método</th><th>Uso</th></tr>
<tr><td>REGISTER</td><td>Registra información de contacto</td></tr><tr><td>INVITE</td><td>Establece una sesión (lleva SDP)</td></tr>
<tr><td>ACK</td><td>Confirma la respuesta final al INVITE</td></tr><tr><td>CANCEL</td><td>Cancela un INVITE pendiente</td></tr>
<tr><td>BYE</td><td>Termina la sesión</td></tr><tr><td>OPTIONS</td><td>Consulta capacidades de otro equipo</td></tr></table></div>
<p><b>Respuestas:</b> 1xx provisional (100 Trying, 180 Ringing, 183 Session Progress) · 2xx éxito (200 OK) · 3xx redirección (301, 302) · 4xx error de cliente (401 Unauthorized, 403, 404 Not Found, 407 Proxy Auth Required, 486 Busy Here, 488 Not Acceptable Here) · 5xx error de servidor · 6xx fallo global (603 Decline).</p>
<p><b>Mensaje:</b> línea inicial + uno o más encabezados + línea en blanco + cuerpo opcional.</p>
<p><b>Encabezados mínimos de una petición:</b> To, From, CSeq, Call-ID, Max-Forwards, Via, y Contact en el INVITE.</p>
<div class="tbl"><table><tr><th>Encabezado</th><th>Función</th></tr>
<tr><td>Via</td><td>Camino recorrido; por ahí vuelve la respuesta</td></tr>
<tr><td>From / To</td><td>Origen y destino lógicos (con tag)</td></tr>
<tr><td>Call-ID</td><td>Identificador único de la llamada</td></tr>
<tr><td>CSeq</td><td>Número de secuencia + método</td></tr>
<tr><td>Max-Forwards</td><td>Saltos restantes (evita bucles, típico 70)</td></tr>
<tr><td>Contact</td><td>Dirección directa del UA</td></tr></table></div>`},
{h:"Flujo de una llamada",b:`<pre><code>UA A            Servidor            UA B
 |-- REGISTER ---->|<---- REGISTER ---|
 |-- INVITE(SDP) ->|-- INVITE(SDP) -->|
 |<- 100 Trying ---|                  |
 |<- 180 Ringing --|<- 180 Ringing ---|
 |<- 200 OK(SDP) --|<- 200 OK(SDP) ---|
 |-- ACK --------->|-- ACK ---------->|
 |<========= RTP / RTCP (audio) =====>|
 |-- BYE --------->|-- BYE ---------->|
 |<- 200 OK -------|<- 200 OK --------|</code></pre>
<p>Las respuestas provisionales conservan los encabezados de la petición. El RTP puede ir <b>directo entre teléfonos</b> o <b>pasar por la central</b>: en Asterisk/Issabel lo define <code>directmedia</code> (antes <code>canreinvite</code>). Con <code>no</code>, la central queda en medio del audio (para grabar, transcodificar o atravesar NAT).</p>
<p><b>Al encender un teléfono IP:</b> DHCP (IP, gateway, DNS y la opción 66 con el servidor TFTP) → TFTP (configuración y agenda global) → NTP (hora) → DNS → SIP REGISTER → 401 Unauthorized con desafío → REGISTER con credenciales → 200 OK.</p>`},
{h:"SDP (Session Description Protocol)",b:`<p>Viaja dentro del cuerpo de SIP (INVITE y 200 OK; o 200 OK y ACK si el INVITE no lo lleva). Describe: nombre y propósito de la sesión, tiempos de actividad, medios (tipo, transporte, formato) y datos de recepción (direcciones, puertos, unicast o multicast).</p>
<pre><code>v=0                                      versión
o=alicia 2890844526 2890844526 IN IP4 10.0.0.5   origen e id de sesión
s=Llamada                                nombre de sesión
c=IN IP4 10.0.0.5                        conexión (IP del RTP)
t=0 0                                    tiempo
m=audio 49170 RTP/AVP 0 8 101            medio, puerto, transporte, formatos
a=rtpmap:0 PCMU/8000                     PT 0 = G.711 µ-law
a=rtpmap:8 PCMA/8000                     PT 8 = G.711 A-law
a=rtpmap:101 telephone-event/8000        DTMF (RFC 2833/4733)</code></pre>
<div class="key">Como el SDP dice en texto la IP y el puerto del RTP, un equipo puede hacer <b>inspección profunda del SDP</b> para descubrir y clasificar ese flujo (darle prioridad o abrirlo en el firewall).</div>`},
{h:"Digitalizar la voz",b:`<ul><li><b>Frecuencia de muestreo:</b> mediciones por segundo (Hz). Por <b>Nyquist-Shannon</b>, fs ≥ 2·fmax. La voz telefónica ocupa ~300–3400 Hz → <b>8000 Hz</b>. El oído llega a ~20 kHz → CD a 44,1 kHz.</li>
<li><b>Resolución (cuantificación):</b> bits por muestra (8, 16, 32). Más bits, más fidelidad.</li>
<li><b>Packetization / framing:</b> la voz codificada se corta en bloques de N bits o N ms y cada bloque va en un paquete RTP.</li>
<li><b>Packet rate:</b> paquetes por segundo (con 20 ms → 50 pps).</li></ul>
<p>Si se remuestrea un chirp de 20 Hz–20 kHz a 8000 Hz, lo que supera 4000 Hz no se puede representar y aparece <b>aliasing</b>: el tono parece bajar en vez de subir.</p>
<div class="key"><b>Pocos paquetes con muchos bits:</b> menos overhead, pero más latencia de paquetización y más audio perdido por paquete perdido.<br><b>Muchos paquetes con pocos bits:</b> menos latencia, pero los encabezados (62 bytes) consumen más ancho de banda y más carga en routers.</div>`},
{h:"Ancho de banda real por llamada",b:`<p>Ejemplo de la cátedra con <b>G.711</b>: 8000 Hz × 8 bits = 64 kbps. Con 20 ms de carga → 50 paquetes/s y 160 bytes por paquete.</p>
<p>Encabezados: Ethernet 22 + IP 20 + UDP+RTP 20 (8 + 12) = <b>62 bytes</b>.</p>
<p><b>(160 + 22 + 20 + 20) × 8 × 50 = 88.800 bps</b> por sentido. Una llamada completa (ida y vuelta) usa el doble.</p>
<p>Practicá otros casos con la calculadora de la pestaña <i>Juegos</i>.</p>`},
{h:"Códecs",b:`<div class="tbl"><table><tr><th>Códec</th><th>Técnica</th><th>Tasa</th></tr>
<tr><td>G.711</td><td>PCM (ley µ en América, ley A en Europa/Argentina)</td><td>64 kbps</td></tr>
<tr><td>G.722</td><td>SB-ADPCM, banda ancha (16 kHz)</td><td>64 kbps</td></tr>
<tr><td>G.723.1</td><td>ACELP / MP-MLQ</td><td>5,3 / 6,3 kbps</td></tr>
<tr><td>G.726</td><td>ADPCM</td><td>16–40 kbps</td></tr>
<tr><td>G.729</td><td>CS-ACELP</td><td>8 kbps</td></tr>
<tr><td>GSM</td><td>LPC (RPE-LTP)</td><td>13 kbps</td></tr>
<tr><td>iLBC</td><td>libre, robusto ante pérdidas</td><td>13,3 / 15,2 kbps</td></tr>
<tr><td>Opus (RFC 6716)</td><td>Combina SILK (voz) y CELT (música)</td><td>6–510 kbps</td></tr></table></div>
<p><b>Transcodificación:</b> si los UA no comparten códec, el servidor convierte el audio. La cátedra muestra su costo en microsegundos de CPU por segundo de audio en Asterisk: convertir a códecs muy comprimidos (G.729, Opus) cuesta mucho más que entre G.711 A y µ.</p>
<p><b>Calidad vs bitrate:</b> a más compresión, menos ancho de banda, pero más CPU, más retardo de algoritmo y menos calidad. Opus mantiene buena calidad con bitrates bajos.</p>`},
{h:"RTP y RTCP",b:`<p><b>RTP</b> (RFC 3550) entrega datos de tiempo real de extremo a extremo sobre <b>UDP con puertos efímeros</b> (en general pares; RTCP usa el siguiente impar). Provee identificación del tipo de carga, secuencia, marcas de tiempo y monitoreo. <b>No garantiza</b> entrega ni QoS.</p>
<div class="tbl"><table><tr><th>Campo RTP</th><th>Bits</th><th>Significado</th></tr>
<tr><td>V</td><td>2</td><td>Versión (= 2)</td></tr><tr><td>P</td><td>1</td><td>Padding</td></tr>
<tr><td>X</td><td>1</td><td>Extensión de encabezado</td></tr><tr><td>CC</td><td>4</td><td>Cantidad de CSRC</td></tr>
<tr><td>M</td><td>1</td><td>Marcador (p. ej. inicio de una ráfaga de voz)</td></tr>
<tr><td>PT</td><td>7</td><td>Tipo de carga (RFC 3551 o dinámico 96–127)</td></tr>
<tr><td>Sequence number</td><td>16</td><td>Detecta pérdidas y desorden</td></tr>
<tr><td>Timestamp</td><td>32</td><td>Instante de muestreo (para jitter y sincronía)</td></tr>
<tr><td>SSRC</td><td>32</td><td>Identificador de la fuente</td></tr>
<tr><td>CSRC</td><td>32 c/u</td><td>Fuentes que contribuyeron (mezcladores)</td></tr></table></div>
<p><b>RTCP:</b> intercambio periódico de control; su tasa se ajusta a la cantidad de participantes (≈5 % del ancho de banda de la sesión). Sirve para feedback de calidad y para adaptar la codificación.</p>
<div class="tbl"><table><tr><th>Paquete RTCP</th><th>Contenido</th></tr>
<tr><td>SR (Sender Report)</td><td>Estadísticas de emisores activos</td></tr>
<tr><td>RR (Receiver Report)</td><td>Pérdidas, secuencia más alta, jitter, datos del último SR</td></tr>
<tr><td>SDES</td><td>Descripción de la fuente, incluido el CNAME</td></tr>
<tr><td>BYE</td><td>Fin de participación</td></tr><tr><td>APP</td><td>Funciones de aplicación</td></tr></table></div>`},
{h:"Calidad, hardware y protocolos auxiliares",b:`<ul><li><b>Lo que más perjudica:</b> latencia (ITU-T G.114 recomienda &lt; 150 ms en un sentido), <b>jitter</b> y pérdida de paquetes. Se mitiga con QoS (DSCP EF = 46, prioridad 802.1p = 5 en la etiqueta 802.1Q) y jitter buffer.</li>
<li><b>MOS:</b> promedio de calificaciones de personas de 1 (mala) a 5 (muy buena).</li>
<li><b>Software:</b> clientes Ekiga, Linphone, Zoiper; plataformas Elastix e Issabel; PBX como Asterisk.</li>
<li><b>Hardware:</b> teléfonos IP (con o sin cámara), placas con interfaces de telefonía tradicional (FXS/FXO), equipos de videoconferencia, centrales IP. <b>PoE</b> alimenta teléfonos y access points por el cable de datos.</li>
<li><b>Auxiliares:</b> DHCP (direcciones), TFTP (configuración y agenda global), NTP (hora unificada, importante para logs y CDR), DNS (nombres de servidores).</li>
<li><b>PBX:</b> central privada; ya existía en telefonía tradicional (PABX).</li>
<li><b>H.323:</b> familia ITU-T, binaria (ASN.1), con H.225 (señalización, TCP 1720) y H.245 (control). Más vieja y compleja que SIP.</li>
<li><b>WebRTC:</b> comunicación en tiempo real en el navegador; SRTP sobre UDP con claves por DTLS; ICE/STUN/TURN para NAT; Opus y G.711 obligatorios.</li>
<li><b>DTMF:</b> cada tecla son dos tonos (una frecuencia de fila y una de columna).</li></ul>`}
],

["¿Cuántos flujos de datos hay en una llamada entre A y B?","La señalización SIP y, por cada sentido, un flujo RTP y uno RTCP: cuatro flujos de medios."],
["¿Cuáles mensajes llevan SDP?","El INVITE (oferta) y el 200 OK (respuesta). Si el INVITE no lleva oferta, la lleva el 200 OK y la respuesta va en el ACK."],
["¿Cómo podría aprovecharse el SDP para clasificar tráfico?","Inspeccionando el SDP se conocen IP y puertos del futuro RTP: un firewall o router puede abrir esos puertos o marcarlos con prioridad."],
["¿Pocos paquetes de muchos bits o muchos de pocos bits?","Depende: grandes reducen overhead pero suben la latencia y el impacto de cada pérdida; chicos bajan la latencia pero aumentan el overhead. 20 ms es el equilibrio usual."],
["¿Frecuencia de muestreo apropiada para voz?","8000 Hz, porque la voz telefónica llega a ~3400 Hz y Nyquist pide el doble."],
["¿Qué pasa si los UA no tienen un códec en común?","La central transcodifica (CPU y retardo). Si no puede, la llamada falla con 488 Not Acceptable Here."],
["¿Qué diferencia a UAC de UAS?","El UAC inicia peticiones; el UAS las responde. Un mismo teléfono cumple los dos roles según el momento."],
["¿Para qué sirve el campo timestamp de RTP si ya está la secuencia?","La secuencia detecta pérdidas y desorden; el timestamp indica cuándo reproducir cada muestra y permite calcular el jitter."],
["¿Qué es el jitter?","La variación del retardo entre paquetes. Se compensa con un jitter buffer, a costa de más latencia."],
["¿Para qué sirve NTP en una red VoIP?","Hora unificada en los equipos: registros de llamadas (CDR), logs y validez de certificados."]

M.push({id:"seg1",n:"03",t:"Seguridad I: conceptos y firewalls",fecha:"21/10 (T)",
fuente:"Teoría AyG_Redes_2026_08_Seguridad_1.pdf. Bibliografía: Stallings caps. 1 y 22; Zwicky cap. 3; Hertzog cap. 14.2.",
teo:[
{h:"Qué hay que proteger",b:`<p>La información es un <b>activo crítico</b>. Hay que protegerla, junto con la tecnología que la procesa, de amenazas internas o externas, deliberadas o accidentales, para asegurar la continuidad.</p>
<p>Se protege la información escrita o impresa, la dicha en conversaciones, la enviada por correo tradicional, la que está en el conocimiento de las personas, la almacenada en dispositivos o nodos, la transmitida electrónicamente y los servicios que permiten acceder a ella.</p>
<p>Se distinguen <b>Seguridad de la Información</b>, <b>Seguridad Informática</b> y <b>Seguridad en Redes de Datos</b>, cada vez más superpuestas.</p>`},
{h:"Vocabulario básico",b:`<div class="tbl"><table><tr><th>Término</th><th>Significado</th></tr>
<tr><td>Activo</td><td>Información, software, redes o hardware</td></tr>
<tr><td>Amenaza</td><td>Lo que puede atentar contra la seguridad. <b>No tiene que ser maliciosa ni intencional</b></td></tr>
<tr><td>Vulnerabilidad</td><td>Debilidad de un activo (falta o debilidad de un control) que la amenaza aprovecha</td></tr>
<tr><td>Riesgo</td><td>Proximidad o posibilidad de daño sobre un activo</td></tr>
<tr><td>Daño</td><td>Resultado final de la amenaza</td></tr>
<tr><td>Impacto</td><td>Gravedad del daño</td></tr>
<tr><td>Control / salvaguarda</td><td>Lo que reduce o elimina una vulnerabilidad, detecta una amenaza en curso o permite recuperarse</td></tr></table></div>
<p><b>Tipos de amenaza:</b></p>
<ul><li><b>Intencionales</b> (ataques): un intruso, malware, un empleado descontento.</li>
<li><b>No intencionales</b>: <b>desastres naturales</b> (inundación, incendio, terremoto), <b>fallas</b> de hardware o software (un disco que se rompe, un corte de luz) y <b>errores humanos</b> (borrar un archivo, una mala configuración).</li></ul>
<div class="key"><b>Ejemplo completo.</b> Activo: la base de alumnos. Amenaza: una inundación en la sala de servidores (no intencional). Vulnerabilidad: el servidor está en el subsuelo y no hay copia fuera del edificio. Riesgo: posibilidad de perder la base. Daño: la base se pierde. Impacto: alto, porque no se pueden emitir certificados. Control: backup diario en otro edificio y servidor en un piso alto.</div>
<p><b>Impacto según FIPS PUB 199:</b> <b>bajo</b> (efecto adverso limitado), <b>moderado</b> (serio), <b>alto</b> (severo o catastrófico), ante pérdida de confidencialidad, integridad o disponibilidad.</p>`},
{h:"La tríada CID: cómo decidir qué se vulnera",b:`<div class="tbl"><table><tr><th>Propiedad</th><th>Qué garantiza</th><th>Se vulnera cuando…</th><th>Pregunta clave</th></tr>
<tr><td><b>Confidencialidad</b></td><td>Solo acceden los autorizados</td><td>Alguien no autorizado <b>lee, ve o copia</b> la información: fuga, robo, espionaje, acceso indebido</td><td>¿Alguien que no debía <b>se enteró</b>?</td></tr>
<tr><td><b>Integridad</b></td><td>La información es exacta y completa; solo la modifican los autorizados</td><td>La información queda <b>cambiada, corrupta, incompleta o falsificada</b>, a propósito o por error</td><td>¿Lo que hay ahora <b>sigue siendo correcto</b>?</td></tr>
<tr><td><b>Disponibilidad</b></td><td>Accesible para los autorizados cuando la necesitan</td><td>Los autorizados <b>no pueden acceder</b>: caída, borrado, bloqueo, lentitud extrema</td><td>¿Los que debían <b>pueden usarla</b>?</td></tr></table></div>
<p>La confidencialidad es de <b>difícil recuperación</b>: lo que se filtró no se puede “desfiltrar”. La integridad y la disponibilidad se recuperan con backups, redundancia y controles.</p>
<p><b>Casos de la cátedra:</b> un hacker que cambió notas de una facultad (<b>integridad</b>); Uber y los datos de 57 millones de usuarios (<b>confidencialidad</b>); el ataque que bloqueó las computadoras de Telefónica (<b>disponibilidad</b>).</p>
<div class="tbl"><table><tr><th>Situación</th><th>Se vulnera</th><th>Por qué</th></tr>
<tr><td>Capturan con Wireshark una contraseña que viaja sin cifrar</td><td>C</td><td>Alguien no autorizado la leyó; no cambió nada</td></tr>
<tr><td>Un empleado cambia el monto de una factura en la base</td><td>I</td><td>El dato ya no es correcto</td></tr>
<tr><td>Un ataque DDoS deja el sitio sin responder</td><td>D</td><td>Los usuarios no pueden usarlo</td></tr>
<tr><td>Ransomware cifra los discos y pide rescate</td><td>D</td><td>Los datos siguen ahí pero nadie puede usarlos. Si además los publica, también C</td></tr>
<tr><td>Roban una notebook con datos sin cifrar</td><td>C y D</td><td>El ladrón puede leerlos y el dueño ya no los tiene</td></tr>
<tr><td>Un atacante en el medio lee y altera mensajes</td><td>C e I</td><td>Leer vulnera C; alterar vulnera I</td></tr>
<tr><td>Se rompe el único disco y no hay backup</td><td>D</td><td>Amenaza no intencional: nadie leyó ni cambió nada, pero no se puede acceder</td></tr></table></div>
<div class="key"><b>Método:</b> hacé las tres preguntas clave por separado; puede haber más de una respuesta. Fijate en los verbos: <i>leer, ver, copiar, filtrar</i> → C; <i>cambiar, alterar, corromper, falsificar</i> → I; <i>caer, borrar, bloquear, impedir</i> → D. Si alguien <b>se hace pasar</b> por otro, lo afectado es la <b>autenticidad</b>.</div>
<p>Además de la tríada: <b>autenticación</b> (el emisor es quien dice ser), <b>no repudio</b> (no se puede negar haber enviado o recibido) y <b>control de acceso</b> (quién accede a qué y cómo).</p>
<p>Practicá en el juego <b>¿Qué se vulnera?</b> de la pestaña Práctica.</p>`},
{h:"Arquitectura de seguridad OSI (ITU-T X.800)",b:`<p>Tres elementos: <b>ataques</b>, <b>mecanismos</b> y <b>servicios</b>.</p>
<ul><li><b>Ataque:</b> acción que compromete la seguridad. <i>Pasivo:</i> lectura no autorizada, análisis de tráfico (difícil de detectar; se previene). <i>Activo:</i> alteración, suplantación, reenvío, denegación de servicio (se detecta y se recupera).</li>
<li><b>Mecanismo:</b> proceso o dispositivo que detecta, previene o recupera. Ejemplos de la cátedra: cifrado, firma digital, control de acceso, control de ruteo, checksums, padding de tráfico. X.800 agrega integridad de datos, intercambio de autenticación y notarización.</li>
<li><b>Servicio:</b> proceso o servicio de comunicación que mejora la seguridad. Usa uno o más mecanismos.</li></ul>
<div class="tbl"><table><tr><th>Servicio</th><th>Garantiza</th></tr>
<tr><td>Integridad</td><td>La información llega sin modificaciones</td></tr>
<tr><td>Confidencialidad</td><td>Solo las partes autorizadas la leen</td></tr>
<tr><td>Disponibilidad</td><td>Servicios accesibles para los autorizados</td></tr>
<tr><td>Autenticación</td><td>La identidad del emisor no es falsa</td></tr>
<tr><td>No repudio</td><td>Emisor o receptor no pueden negar haber enviado o recibido</td></tr>
<tr><td>Control de acceso</td><td>Quién accede a qué recursos y cómo (lectura, escritura)</td></tr></table></div>
<p><b>Identificación → Autenticación → Autorización:</b> indicar la cuenta, demostrar que uno es quien dice (clave) y comprobar el permiso sobre el recurso.</p>`},
{h:"Tipos de ataque e intrusos",b:`<div class="tbl"><table><tr><th>Ataque</th><th>Qué pasa</th><th>Servicio afectado</th><th>Tipo</th></tr>
<tr><td>Interceptación</td><td>El destino recibe, pero un tercero también la captó</td><td>Confidencialidad</td><td>Pasivo</td></tr>
<tr><td>Modificación</td><td>Se intercepta, altera y reenvía</td><td>Integridad</td><td>Activo</td></tr>
<tr><td>Interrupción</td><td>Nunca llega a destino</td><td>Disponibilidad</td><td>Activo</td></tr>
<tr><td>Generación (suplantación)</td><td>El intruso envía haciéndose pasar por el origen</td><td>Autenticidad</td><td>Activo</td></tr></table></div>
<p><b>Ataques pasivos:</b> solo observan (leer el contenido, <b>análisis de tráfico</b>: quién habla con quién, cuánto y cuándo). No alteran nada, por eso son <b>difíciles de detectar</b>: se combaten con <b>prevención</b> (cifrado). <b>Ataques activos:</b> alteran, suplantan, reenvían o interrumpen; se pueden <b>detectar</b> y hay que <b>recuperarse</b>.</p>
<p><b>Intruso pasivo:</b> accede sin modificar (lee archivos, monitorea tráfico). <b>Intruso activo:</b> modifica, reenvía datos capturados o genera mensajes nuevos.</p>`},
{h:"Estrategias de seguridad (Zwicky, cap. 3)",b:`<div class="tbl"><table><tr><th>Estrategia</th><th>Idea</th></tr>
<tr><td>Menor privilegio</td><td>Cada actor (usuario, admin, programa) solo con lo necesario</td></tr>
<tr><td>Defensa en profundidad</td><td>Mecanismos en distintos niveles: hardware, software, políticas, procedimientos</td></tr>
<tr><td>Seguridad desde el diseño</td><td>Se considera desde la concepción</td></tr>
<tr><td>Cuello de botella (choke point)</td><td>Forzar el flujo por un punto de control</td></tr>
<tr><td>Eslabón más débil</td><td>La defensa vale lo que su punto más débil</td></tr>
<tr><td>Fallar en forma segura</td><td>Default deny: si algo falla, se deniega todo</td></tr>
<tr><td>Diversidad de defensa</td><td>Mecanismos de distinto tipo y proveedor</td></tr>
<tr><td>Simplicidad</td><td>Más complejidad, más difícil asegurar</td></tr>
<tr><td>Transparencia</td><td>No depender de algoritmos secretos (contra “security by obscurity”)</td></tr></table></div>`},
{h:"Firewalls",b:`<p>Barrera por la que debe pasar el tráfico en ambos sentidos; según su política, sus reglas (ACL) y los encabezados o el contenido de cada paquete, decide qué pasa.</p>
<p><b>Objetivos de diseño:</b> 1) todo el tráfico interno-externo pasa por él (se bloquean accesos alternativos); 2) solo pasa lo autorizado por la política local; 3) es inmune a intrusiones (sistema reforzado, SO seguro).</p>
<p><b>Servicios:</b> control de acceso; registro de actividades (tráfico permitido y denegado, para supervisar intrusos, evaluar daños e identificarlos); extremo de NAT o VPN, por estar en el borde.</p>
<p><b>Las 4 P:</b> <b>Paranoica</b> (todo prohibido, incluso lo que debería permitirse: equivale a no interconectar) · <b>Prudente</b> (todo prohibido salvo lo permitido) · <b>Permisiva</b> (todo permitido salvo lo prohibido) · <b>Promiscua</b> (todo permitido, incluso lo que debería prohibirse).</p>`},
{h:"Tipos y ubicación de firewalls",b:`<div class="tbl"><table><tr><th>Tipo</th><th>Decide según</th></tr>
<tr><td>Filtro de paquetes simple, stateless (1ª gen.)</td><td>Interfaz, IP origen/destino, protocolo, puertos; cada paquete aislado</td></tr>
<tr><td>Inspección con estado, stateful (2ª gen.)</td><td>Además una base local con contexto: estado de conexión, dirección del flujo, conexiones relacionadas</td></tr>
<tr><td>Nivel de aplicación, ALG o proxy (3ª gen.)</td><td>Intermediario que entiende el protocolo: filtra por mensajes, usuario o acción. Ejemplo clásico: proxy HTTP</td></tr>
<tr><td>Gateway a nivel de circuito</td><td>Autentica al cliente y después retransmite conexiones TCP o flujos UDP. Ejemplo: SOCKS</td></tr></table></div>
<div class="tbl"><table><tr><th>Emplazamiento</th><th>Descripción</th></tr>
<tr><td>Borde de red</td><td>Lo más habitual: router o bridge reforzado, pocos servicios, autenticación fuerte, política prudente</td></tr>
<tr><td>Host-based</td><td>Protege solo ese servidor; admite solo los puertos de sus aplicaciones</td></tr>
<tr><td>Personal</td><td>En cada estación; impide acceso remoto a recursos locales. Ej.: el del sistema operativo</td></tr>
<tr><td>WAF</td><td>Antes o junto al servidor web; filtra HTTP. Caso particular de ALG</td></tr>
<tr><td>Process firewall</td><td>En el SO; vigila llamadas al sistema de los procesos (sandboxing)</td></tr></table></div>
<p><b>DMZ:</b> segmento con los servicios accedidos desde adentro y desde Internet (web, correo, proxy, DNS), separado de la LAN. Esquemas: (I) dos firewalls, externo e interno, con la DMZ en el medio; (II) un firewall único que consolida ambos.</p>`},
{h:"IDS, IPS, SIEM, UTM y MSSP",b:`<ul><li><b>IDS:</b> busca patrones de ataque o de violación de política, por <b>firmas</b> o por <b>anomalías</b> (volumen, picos, tamaño de paquetes, protocolos). Detecta ataques en curso o pasados, también internos; alerta y puede avisar al firewall, pero <b>no previene</b>.</li>
<li><b>IPS:</b> rol activo, en línea. Acciones: alarma, descartar paquetes, bloquear todo desde una IP, resetear la conexión TCP. Es <b>IDS + firewall</b>. Ej.: fail2ban, Suricata, DenyHosts.</li>
<li><b>SIEM:</b> recolecta y correlaciona logs. <b>SEM</b> = análisis en tiempo real; <b>SIM</b> = almacenamiento largo, reportes, cumplimiento y forense.</li>
<li><b>UTM:</b> todo en uno (firewall, IDS/IPS, antivirus, antispam, antiphishing, antispyware, filtro de contenidos, balanceo, DLP, DPI, VPN, SIEM). Desventaja: SPOF, cuello de rendimiento, un solo proveedor.</li>
<li><b>MSSP:</b> proveedor que administra y monitorea remotamente firewalls, IDS/IPS y gateways (por VPN, con contingencia celular o POTS), escanea vulnerabilidades y analiza eventos. Útil para cumplir normas sin personal propio.</li></ul>`}
],

["¿Qué tres cosas puede hacer un control?","Disminuir o eliminar una vulnerabilidad, detectar una amenaza en proceso o permitir recuperarse del daño."],
["¿Por qué la confidencialidad es de difícil recuperación?","Porque una vez que la información se filtró, no se puede “desfiltrar”."],
["¿Qué servicio afecta cada tipo de ataque?","Interceptación → confidencialidad; modificación → integridad; interrupción → disponibilidad; generación → autenticidad."],

["¿Qué hace un process firewall?","Monitorea las llamadas al sistema de los procesos y bloquea las que se salen del patrón o de la política (sandboxing)."]

M.push({id:"netfilter",n:"04",t:"Netfilter / nftables",fecha:"27/10 (P) · entrega 09/11",
fuente:"Teoría netfilter-2026.pdf + práctica node/108. Bibliografía: Stallings caps. 1 y 22; Hertzog cap. 14.2; Zwicky cap. 3; Julia Evans (iptables).",
teo:[
{h:"Netfilter: qué es y qué permite",b:`<p><b>Netfilter</b> es un framework extensible dentro del kernel de Linux que permite realizar diversas acciones sobre los paquetes que atraviesan el stack de red del sistema operativo. Permite:</p>
<ul><li>Filtrado de paquetes <b>sin estado</b>.</li><li>Filtrado de paquetes <b>con estado</b>.</li>
<li>Traducción de direcciones y puertos (<b>NAT / NAPT</b>) en sus múltiples variantes.</li>
<li>Asistir al framework <b>tc</b> para construir políticas complejas de <b>QoS</b>.</li>
<li>Modificar paquetes (<b>mangling</b>), por ejemplo alterar los bits <b>TOS/DSCP/ECN</b> del encabezado IP.</li></ul>
<p><b>iptables y nft:</b> configuran, mantienen e inspeccionan las tablas de reglas de filtrado IPv4 e IPv6 del kernel; <b>nft</b> es el reemplazo más reciente de iptables.</p>
<p><b>iptables</b> trae por defecto tres <b>tablas</b>: <b>filter</b> (filtrado), <b>nat</b> (traducción) y <b>mangle</b> (modificar campos particulares y marcar paquetes). Cada tabla contiene <b>cadenas</b> (chains) predefinidas y otras definidas por el usuario; cada cadena es una lista de <b>reglas</b> (rules) que pueden coincidir con paquetes, y cada regla dice qué acción o <b>veredicto</b> (verdict) tomar.</p>`},
{h:"Estructura de nftables",b:`<p><b>Tabla</b> (de una familia) → <b>cadenas</b> → <b>reglas</b>.</p>
<div class="tbl"><table><tr><th>Familia</th><th>Tráfico</th></tr>
<tr><td>ip / ip6</td><td>IPv4 / IPv6</td></tr><tr><td>inet</td><td>IPv4 e IPv6 juntos</td></tr>
<tr><td>arp</td><td>ARP</td></tr><tr><td>bridge</td><td>Tramas que atraviesan un bridge</td></tr><tr><td>netdev</td><td>Hook ingress, apenas llega a la placa</td></tr></table></div>
<p>Una <b>cadena base</b> se engancha a un <b>hook</b> y tiene tipo (<code>filter</code>, <code>nat</code>, <code>route</code>), prioridad (menor = antes) y <b>política</b> por defecto (<code>accept</code> o <code>drop</code>). Una cadena común (sin hook) solo se usa saltando a ella con <code>jump</code> o <code>goto</code>.</p>
<pre><code>nft add table inet filtro
nft add chain inet filtro input   '{ type filter hook input priority 0; policy drop; }'
nft add chain inet filtro forward '{ type filter hook forward priority 0; policy drop; }'
nft add chain inet filtro output  '{ type filter hook output priority 0; policy drop; }'</code></pre>`},
{h:"La vida de un paquete: los hooks",b:`<p>Tres casos: <b>paquete entrante destinado al equipo</b> (la IP destino coincide con la del host), <b>paquete saliente enviado desde el equipo</b> y <b>paquete entrante NO destinado al equipo</b> (ni la IP origen ni la destino son propias: el host actúa como router).</p>
<div class="tbl"><table><tr><th>Hook</th><th>Según la cátedra</th></tr>
<tr><td><b>PREROUTING</b></td><td>Se dispara para TODOS los paquetes que llegan desde la red, ANTES de la decisión de ruteo</td></tr>
<tr><td><b>INPUT</b></td><td>Para cada paquete DESTINADO a este equipo. Si no se descarta, queda en el búfer de recepción hasta que la aplicación lo lea</td></tr>
<tr><td><b>OUTPUT</b></td><td>Para los paquetes ORIGINADOS en este host (respuestas, ACK de TCP…)</td></tr>
<tr><td><b>POSTROUTING</b></td><td>Para TODOS los paquetes que salen hacia la red, DESPUÉS de la decisión de ruteo. Luego se encolan según la disciplina de encolado (qdisc)</td></tr>
<tr><td><b>FORWARD</b></td><td>Cuando el host es router: paquetes ni originados en él ni destinados a él. Acá va la mayoría de las reglas de un firewall de red</td></tr>
<tr><td><b>INGRESS</b></td><td>Filtrado temprano de tramas apenas llegan a la interfaz. Se aplica antes del reensamblado de fragmentos: ¡cuidado al filtrar por puertos TCP/UDP!</td></tr></table></div>
<div class="tbl"><table><tr><th>Caso</th><th>Recorrido</th></tr>
<tr><td>Dirigido al propio equipo</td><td>prerouting → <b>input</b></td></tr>
<tr><td>Reenviado por el router</td><td>prerouting → <b>forward</b> → postrouting</td></tr>
<tr><td>Generado por el equipo</td><td><b>output</b> → postrouting</td></tr></table></div>
<p>DNAT (publicar un servidor interno) va en <b>prerouting</b>; SNAT / <code>masquerade</code> (salir con la IP pública) va en <b>postrouting</b>.</p>
<pre><code>nft add table ip nat
nft add chain ip nat post '{ type nat hook postrouting priority 100; }'
nft add rule ip nat post oifname "eth0" masquerade
nft add chain ip nat pre '{ type nat hook prerouting priority -100; }'
nft add rule ip nat pre iifname "eth0" tcp dport 80 dnat to 10.0.0.10</code></pre>
<div class="key">En el laboratorio el firewall está en el <b>router</b>: client1 → webserver pasa por <b>forward</b>. Para entrar por SSH al router, la regla va en <b>input</b>.</div>`},
{h:"Acciones y condiciones",b:`<ul><li><code>accept</code>: deja pasar. <code>drop</code>: descarta en silencio (el cliente espera hasta el timeout).</li>
<li><code>reject</code>: descarta y avisa (ICMP port unreachable o, con <code>with tcp reset</code>, un RST). El cliente se entera enseguida, pero se revela el firewall.</li>
<li><code>log</code>: registra y <b>sigue evaluando</b>; por eso se combina: <code>log prefix "DROP: " drop</code>.</li>
<li><code>return</code>: interrumpe la cadena actual y vuelve a la cadena que la llamó (si existe).</li>
<li>En iptables, REJECT permite elegir el tipo de error ICMP con <code>--reject-with</code>; hay muchas más acciones en <code>man iptables-extensions</code>.</li>
<li>Otras: <code>masquerade</code>, <code>snat</code>, <code>dnat</code>, <code>mark</code>, <code>queue</code> (al espacio de usuario), <code>counter</code>, <code>jump</code>.</li></ul>
<p>Condiciones habituales: <code>iifname</code>/<code>oifname</code>, <code>ip saddr</code>/<code>daddr</code>, <code>tcp dport</code>/<code>sport</code>, <code>udp dport</code>, <code>icmp type echo-request</code>, <code>ct state</code>, conjuntos <code>{ 22, 80, 443 }</code>.</p>
<p>Si se usa <code>reject</code> con <code>output</code> en DROP, el router no puede emitir el ICMP de rechazo: hay que permitir ICMP en output.</p>`},
{h:"Sin estado vs con estado",b:`<p><b>Sin estado:</b> dos reglas, una de ida y una de vuelta.</p>
<pre><code>nft add rule inet filtro forward ip daddr 10.0.0.10 tcp dport 80 accept
nft add rule inet filtro forward ip saddr 10.0.0.10 tcp sport 80 accept</code></pre>
<p>Problema: cualquiera que use puerto de origen 80 atraviesa el firewall.</p>
<p><b>Con estado (connection tracking):</b></p>
<pre><code>nft add rule inet filtro forward ct state established,related accept
nft add rule inet filtro forward ip daddr 10.0.0.10 tcp dport 80 ct state new accept</code></pre>
<p>Estados: <b>new</b>, <b>established</b>, <b>related</b> (asociada a otra, p. ej. ICMP de error o datos de FTP), <b>invalid</b>. Se ven en <code>/proc/net/nf_conntrack</code> o con <code>conntrack -L</code>.</p>`},
{h:"Orden, handles y persistencia",b:`<ul><li>Se evalúan <b>en orden</b>; la primera con veredicto final (accept, drop, reject) termina. Una regla debajo de otra más general puede no tener efecto nunca.</li>
<li><code>nft -a list ruleset</code> muestra los <b>handles</b>; se borra con <code>nft delete rule inet filtro forward handle 7</code>. <code>nft insert</code> agrega al principio; <code>nft add</code> al final.</li>
<li><code>nft flush ruleset</code> borra todo.</li>
<li><b>Persistencia:</b> las reglas viven en memoria. Se guardan en <code>/etc/nftables.conf</code> y se habilita <code>systemctl enable nftables</code>; también se puede cargar un script con <code>nft -f archivo</code>.</li></ul>
<p>Linux trae todo en ACCEPT: política inicial <b>permisiva</b>. Poner DROP en input, output y forward sin excepciones cumple “prudente” pero hace perder <b>disponibilidad</b>.</p>`},
{h:"Reglas como ACL: el ejemplo de la cátedra",b:`<p>Cada cadena es una lista de reglas (como una ACL) con una <b>política por defecto</b>. Si el paquete no coincide con una regla, se examina la siguiente; si coincide, se ejecuta la acción. La ACL relaciona un <b>actor</b> (origen), un <b>recurso</b> (destino y puerto) y un <b>permiso</b> (acción).</p>
<div class="tbl"><table><tr><th>#</th><th>Origen</th><th>Destino</th><th>Proto</th><th>P. orig.</th><th>P. dest.</th><th>Acción</th></tr>
<tr><td colspan="7"><b>FORWARD</b> en un firewall de red</td></tr>
<tr><td>1</td><td>*</td><td>170.210.96.1</td><td>TCP</td><td>*</td><td>80</td><td>ACCEPT</td></tr>
<tr><td>2</td><td>170.210.96.1</td><td>*</td><td>TCP</td><td>80</td><td>*</td><td>ACCEPT</td></tr>
<tr><td>3</td><td>*</td><td>170.210.96.1</td><td>TCP</td><td>*</td><td>22</td><td>LOG</td></tr>
<tr><td>4</td><td>200.110.185.0/24</td><td>*</td><td>TCP</td><td>*</td><td>*</td><td>DROP</td></tr>
<tr><td colspan="7"><b>INPUT</b> en un servidor de correo</td></tr>
<tr><td>1</td><td>*</td><td>170.210.96.3</td><td>TCP</td><td>&gt; 1024</td><td>25</td><td>ACCEPT</td></tr>
<tr><td>2</td><td>170.210.96.73</td><td>170.210.96.3</td><td>UDP</td><td>*</td><td>161</td><td>ACCEPT</td></tr>
<tr><td>3</td><td>170.210.96.0/24</td><td>170.210.96.3</td><td>ICMP</td><td>-</td><td>-</td><td>ACCEPT</td></tr></table></div>
<div class="key">Preguntas de la diapositiva. <b>¿Qué tipo de firewall es?</b> Sin estado: la regla 1 deja pasar la petición al webserver y la 2 la respuesta (reglas de ida y vuelta). <b>¿Cómo mejorarlo?</b> Con estado: <code>ct state established,related accept</code> en lugar de la regla 2, que deja pasar cualquier cosa con puerto de origen 80. <b>¿Política por defecto?</b> Debería ser DROP (prudente). La regla 3 solo registra: hace falta otra regla que decida. UDP 161 es SNMP.</div>
<p><b>Sintaxis nft de la cátedra:</b> primero se crea tabla y cadena: <code>nft add table inet FW &amp;&amp; nft add chain inet FW INPUT</code>. Luego <code>nft add rule inet TABLA CADENA MATCHEO ACCION</code>, por ejemplo <code>nft add rule FW INPUT ip daddr IP-DEL-FW tcp dport 80 reject</code>. Comandos: <b>list</b>, <b>add</b>, <b>delete</b> (por número de regla), <b>flush</b>.</p>
<p><b>Condiciones habituales:</b> <code>ip protocol</code> (tcp, udp, icmp, icmpv6) · <code>ip saddr</code> / <code>ip daddr</code> (host o red con máscara) · <code>iif</code> (interfaz de entrada) · <code>tcp sport</code> / <code>tcp dport</code> · <code>ct state new</code> (apertura de conexión) · <code>ct state …</code> (stateful). Se niega una condición con <code>!</code>.</p>`},
{h:"Diseñar una ACL (TP)",b:`<p>Tabla con: cadena · origen · destino · protocolo · puerto origen · puerto destino · acción · comentario.</p>
<div class="tbl"><table><tr><th>Servicio</th><th>Protocolo / puerto</th></tr>
<tr><td>DNS</td><td>UDP 53 (TCP 53 para respuestas grandes)</td></tr><tr><td>DHCP</td><td>UDP 67 servidor / 68 cliente</td></tr>
<tr><td>TFTP</td><td>UDP 69</td></tr><tr><td>NTP</td><td>UDP 123</td></tr>
<tr><td>SIP</td><td>UDP/TCP 5060</td></tr><tr><td>RTP</td><td>UDP rango alto (p. ej. 10000–20000)</td></tr>
<tr><td>SSH</td><td>TCP 22</td></tr><tr><td>HTTP / HTTPS</td><td>TCP 80 / 443</td></tr>
<tr><td>SMTP / POP3 / IMAP</td><td>TCP 25 / 110 / 143</td></tr></table></div>
<p class="note">DHCP no atraviesa routers salvo con relay: si el servidor está en otra red, hace falta permitir el relay.</p>`},
{h:"QoS y control de tráfico con tc",b:`<p>Netfilter asiste a <b>tc</b> (traffic control) para aplicar QoS.</p>
<ul><li><b>Policing:</b> <b>descarta</b> los paquetes que exceden la tasa. <b>Shaping:</b> los <b>retrasa</b> (encola) para ajustarse a la tasa.</li></ul>
<div class="tbl"><table><tr><th>Concepto</th><th>Qué es</th></tr>
<tr><td><b>QDISC</b></td><td>Componente principal. Al menos dos por interfaz: una de salida (egress) y una de entrada (ingress). <b>Sin clases</b> (classless): PFIFO, TBF, RED, SFQ, NETEM. <b>Con clases</b> (classful): DRR, HTB, PRIO, QFQ</td></tr>
<tr><td><b>CLASSES</b></td><td>Cada política o tipo de tráfico: interactivo, web, bulk, audio/video, gestión</td></tr>
<tr><td><b>FILTERS</b></td><td>Condiciones que asocian paquetes a clases. Ej.: puerto 22 → interactivo; ICMP → gestión; 142.251.0.0/16 (YouTube) → bulk</td></tr></table></div>
<pre><code>tc -s qdisc show dev enp5s0                 # ver qdisc y estadísticas
tc qdisc add dev enp5s0 root tbf rate 2mbit burst 4mb latency 500ms   # shaping 2 Mbps
tc -s class show dev enp5s0                 # ver clases
tc filter show dev enp5s0 root              # ver filtros
tc qdisc del dev enp5s0 root                # volver a la normalidad</code></pre>
<p>Los switches y routers también lo implementan; la cátedra muestra las colas (Queues) de MikroTik RouterOS.</p>`}
],

["¿Qué permite hacer netfilter?","Filtrado sin estado y con estado, NAT/NAPT, asistir a tc para QoS y modificar paquetes (mangling), por ejemplo los bits TOS/DSCP/ECN."],
["¿Qué tres tablas trae iptables por defecto?","filter (filtrado), nat (traducción de direcciones) y mangle (modificar campos y marcar paquetes)."],
["¿Cómo sabe el kernel si un paquete está destinado al host?","Porque la IP destino coincide con una IP propia. Si ni el origen ni el destino son propios, el paquete está en tránsito (forward)."],
["¿Por qué hay que tener cuidado al filtrar por puertos en INGRESS?","Porque se aplica antes del reensamblado: un fragmento puede no traer el encabezado TCP/UDP."],
["¿Diferencia entre policing y shaping?","Policing descarta lo que excede la tasa; shaping lo retrasa encolándolo."],
["¿Qué tipo de firewall es el ejemplo FORWARD de la cátedra y cómo se mejora?","Sin estado (reglas de ida y vuelta con puerto 80). Se mejora con connection tracking: ct state established,related."],
["¿Qué política por defecto conviene en el ejemplo de la cátedra?","DROP (prudente): solo pasa lo permitido explícitamente."],
["¿Qué política de las 4 P trae Linux por defecto?","Permisiva: todo en ACCEPT."],
["¿Qué diferencia se ve en Wireshark entre drop y reject?","Con drop, retransmisiones de SYN sin respuesta hasta el timeout. Con reject, un ICMP port unreachable o TCP RST inmediato."],
["¿Por qué falla el acceso a POP3 si solo se habilitó HTTP?","Porque la política es DROP y no hay regla para TCP 110: los SYN se descartan sin respuesta."],
["¿En qué hook va un firewall de host?","input y output."],
["¿Cómo se accede al router por SSH si input está en DROP?","Regla en input: tcp dport 22 desde la PC autorizada, más established,related para las respuestas; el resto con reject."],
["Si el webserver es comprometido, ¿cómo se limita el daño?","Ubicándolo en DMZ y filtrando lo que sale de él: solo respuestas (established), nunca conexiones nuevas hacia la LAN."],
["¿Por qué filtrar también en los hosts?","Defensa en profundidad: ataques desde la misma LAN no pasan por el router."],
["¿Cómo se sabe si la configuración es stateful?","Si usa ct state (connection tracking). Con reglas de sport/dport para ida y vuelta, es stateless."],
["¿Qué hace la acción queue?","Pasa el paquete a un programa en espacio de usuario (por ejemplo un IPS como Suricata) que decide."]
],

teo:[
{h:"Criptosistema",b:`<p>Un criptosistema se define con cinco elementos:</p>
<div class="tbl"><table><tr><th>Símbolo</th><th>Significado</th></tr>
<tr><td>m</td><td>Texto en claro: mensaje a cifrar</td></tr>
<tr><td>c</td><td>Texto cifrado</td></tr>
<tr><td>K</td><td>Conjunto de claves</td></tr>
<tr><td>E</td><td>Algoritmo de cifrado: una transformación E<sub>k</sub> por cada clave</td></tr>
<tr><td>D</td><td>Algoritmo de descifrado: las transformaciones inversas</td></tr></table></div>
<div class="key">Propiedad básica: <b>D<sub>k</sub>(E<sub>k</sub>(m)) = m</b>. Lo secreto es la clave, no el algoritmo (principio de Kerckhoffs).</div>`},
{h:"Clasificaciones",b:`<div class="tbl"><table><tr><th>Criterio</th><th>Tipos</th></tr>
<tr><td>Tipo de operación</td><td><b>Sustitución</b> (cada elemento se reemplaza por otro) · <b>Transposición</b> (los elementos se reordenan sin cambiarlos)</td></tr>
<tr><td>Cantidad de claves</td><td><b>Simétricos</b> (una clave compartida: clave secreta o cifrado convencional) · <b>Asimétricos</b> (pública y privada)</td></tr>
<tr><td>Forma de procesar</td><td><b>Por bloques</b> (un bloque de salida por cada bloque de entrada) · <b>Continuo / stream</b> (elemento a elemento, a medida que llegan)</td></tr></table></div>`},
{h:"Cifrados clásicos de sustitución",b:`<p><b>César (monoalfabético):</b> cada letra se reemplaza por la que está 3 posiciones más adelante.</p>
<p><b>C = (m + 3) mod L</b>, con L = cantidad de letras. La cátedra usa el alfabeto español con Ñ: <b>L = 27</b> (A=0 … N=13, Ñ=14, O=15 … Z=26). El 3 es un desplazamiento fijo, no una contraseña.</p>
<p>Ejemplo: SECRETO → VHFUHWR. Es <b>monoalfabético</b> porque cada símbolo siempre se cifra igual, por eso cae con análisis de frecuencias.</p>
<p><b>Vigenère (polialfabético):</b> la sustitución cambia según la posición, con una clave de d símbolos:</p>
<p><b>E<sub>k</sub>(m<sub>i</sub>) = m<sub>i</sub> + k<sub>(i mod d)</sub> (mod n)</b></p>
<p>Ejemplo de la cátedra: ESTO ES SECRETO con clave CLAVE repetida (CLAV EC LAVECLA) → <b>GDTK IU DEXVGEO</b>.</p>
<p>Probá los dos en el cifrador de la pestaña <i>Juegos</i>.</p>`},
{h:"Transposición y máquinas de rotores",b:`<p><b>Rail Fence:</b> se escribe el texto en zigzag sobre “rieles” y se lee por filas. Con profundidad 2, las letras en posiciones pares van a la primera fila y las impares a la segunda.</p>
<p>Ejemplo: “te veo luego de la reunión” → <b>tvougdlruineeleoeaeno</b>.</p>
<pre><code>t . v . o . u . g . d . l . r . u . i . n
. e . e . l . e . o . e . a . e . n . o .</code></pre>
<p><b>Máquinas de rotores:</b> cilindros, cada uno con una sustitución monoalfabética, que giran a distinta velocidad como un odómetro. El resultado es una sustitución polialfabética muy compleja. Ejemplo: <b>Enigma</b>.</p>`},
{h:"Criptografía simétrica",b:`<p>Misma clave para cifrar y descifrar; la seguridad depende del secreto de esa clave.</p>
<ul><li><b>Ventajas:</b> sencilla, rápida y robusta.</li>
<li><b>Desventaja:</b> la administración de claves no escala: n usuarios necesitan n(n−1)/2 claves, y hay que repartirlas por un canal seguro.</li>
<li><b>Servicio que garantiza:</b> confidencialidad (si solo dos conocen la clave, también cierta autenticación del origen, pero sin no repudio).</li></ul>
<div class="tbl"><table><tr><th>De bloque</th><th>De flujo</th></tr>
<tr><td>3DES, IDEA, Blowfish, <b>AES (Rijndael)</b>, CAST5, Twofish, Serpent, Camellia</td><td>RC4, Salsa20, <b>ChaCha20</b>, A5/1, A5/2 (GSM)</td></tr></table></div>
<p class="note">Datos útiles: DES usa clave de 56 bits (roto); AES usa bloques de 128 bits y claves de 128, 192 o 256. Modos de bloque: ECB deja ver patrones; CBC encadena con un IV; GCM agrega autenticación (AEAD).</p>`},
{h:"Criptografía asimétrica",b:`<p>Par de claves relacionadas: la pública cifra y la privada descifra (o al revés, para firmar). La seguridad está en que es inviable deducir la privada desde la pública.</p>
<ul><li><b>Ventaja:</b> la distribución de claves escala mejor (2n claves; la pública se publica).</li>
<li><b>Desventajas:</b> mayor costo de procesamiento y la necesidad de <b>autenticar las claves públicas</b> (¿esta pública es realmente de B?). De ahí los certificados y la red de confianza.</li>
<li><b>Flujo típico:</b> A cifra con la pública de B; B descifra con su privada → confidencialidad.</li>
<li><b>Servicios:</b> confidencialidad (con la pública del receptor), autenticación y no repudio (con la privada del emisor).</li></ul>
<div class="tbl"><table><tr><th>Grupo</th><th>Algoritmos</th></tr>
<tr><td>Tradicionales</td><td>RSA (1977), DSA (estándar FIPS, 1991), ECDSA, ECDH (intercambio de claves), EdDSA, Ed25519</td></tr>
<tr><td>Poscuánticos</td><td>ML-KEM (Kyber), ML-DSA (Dilithium), SLH-DSA (SPHINCS+)</td></tr>
<tr><td>Híbridos</td><td>X25519Kyber768, X25519MLKEM768</td></tr></table></div>
<p class="note">Los poscuánticos resisten ataques de computadoras cuánticas; los híbridos combinan uno clásico (X25519) con uno poscuántico, y ya se usan en TLS.</p>
<div class="key"><b>Esquema híbrido</b> (PGP, TLS): se cifran los datos con una clave de sesión simétrica aleatoria y esa clave se cifra con la pública del destinatario (o se acuerda con Diffie-Hellman). Velocidad del simétrico + distribución del asimétrico.</div>`},
{h:"Funciones hash",b:`<p>Toman un mensaje de tamaño variable y devuelven un resumen o <b>digesto</b> H(m) de tamaño fijo y mucho menor (por ejemplo, de 1 MB a 128 bits). Son <b>unidireccionales</b>: es difícil encontrar otro m′ con el mismo H(m). Un cambio mínimo en m cambia todo el resumen (efecto avalancha).</p>
<div class="tbl"><table><tr><th>Algoritmo</th><th>Tamaño</th></tr>
<tr><td>MD5</td><td>128 bits (roto)</td></tr><tr><td>SHA-1</td><td>160 bits (roto)</td></tr>
<tr><td>SHA-2</td><td>SHA-224, SHA-256, SHA-384, SHA-512</td></tr>
<tr><td>RIPEMD-160</td><td>160 bits</td></tr>
<tr><td>WHIRLPOOL</td><td>512 bits, para mensajes menores a 2<sup>256</sup> bits</td></tr>
<tr><td>SHA-3</td><td>Keccak</td></tr></table></div>
<pre><code>openssl dgst -md5    archivo
openssl dgst -sha256 archivo
openssl dgst -sha512 archivo</code></pre>`},
{h:"Autenticación de mensajes y MAC",b:`<p><b>Autenticación de mensajes:</b> verifica que el mensaje viene de la fuente declarada y no fue modificado. Opcionalmente verifica secuencia y oportunidad: sin cambios de orden, retrasos ni retransmisiones.</p>
<p><b>MAC:</b> función de mensaje + <b>clave secreta compartida</b> que da un valor fijo: <b>MAC = C<sub>k</sub>(m)</b>. Provee <b>autenticación e integridad</b> (no no repudio, porque los dos conocen la clave).</p>
<div class="tbl"><table><tr><th>Implementación</th><th>Base</th></tr>
<tr><td>DAA (Data Authentication Algorithm)</td><td>Cifrado por bloques</td></tr>
<tr><td><b>HMAC</b> (RFC 2104)</td><td>Hash</td></tr>
<tr><td>CMAC</td><td>Cifrado</td></tr></table></div>
<p><b>HMAC = H( (k ⊕ opad) ‖ H( (k ⊕ ipad) ‖ m ) )</b>, donde H puede ser MD5, SHA-1, SHA-256, SHA-384…</p>`},
{h:"Firma digital",b:`<p>Permite anexar un código que garantiza <b>origen e integridad</b> (y por eso, no repudio).</p>
<ol><li>A calcula el hash del mensaje y lo cifra con <b>su clave privada</b>: esa es la firma.</li>
<li>A envía el mensaje en claro + la firma.</li>
<li>B descifra la firma con la <b>clave pública de A</b> y obtiene el hash original; además calcula el hash del mensaje recibido.</li>
<li>B compara: si no coinciden, el mensaje o la firma fueron alterados y la firma no es válida.</li></ol>
<p>Se firma el hash y no el mensaje entero porque el asimétrico es lento. La firma no da confidencialidad: el mensaje va en claro. En Argentina la firma digital tiene valor legal (Ley 25.506; la cátedra cita la página de Firma Digital de Innovación Pública).</p>
<p><b>Mecanismos de integridad, de menor a mayor garantía:</b> checksum/CRC (errores accidentales) → hash (un atacante puede recalcularlo) → MAC/HMAC (requiere la clave) → firma digital (además no repudio).</p>`},
{h:"Esteganografía",b:`<p>Oculta la <b>existencia</b> del mensaje, no solo su contenido. No reemplaza al cifrado: lo complementa (si se descubre el mensaje oculto, sigue protegido si estaba cifrado).</p>
<p>Ejemplos: tinta invisible; marcas sobre ciertos caracteres (pinchazos, trazos de lápiz); una secuencia predefinida dentro de un texto; un tatuaje en el cuero cabelludo de un mensajero, tapado por el pelo; reemplazar el <b>bit menos significativo</b> de cada byte de una imagen; ocultar datos en audio o video.</p>`},
{h:"OpenPGP / GnuPG (práctica)",b:`<pre><code>gpg -c archivo                         # cifrado simétrico (contraseña)
gpg --full-generate-key                # par de claves
gpg --armor --export mail@x &gt; pub.asc   # exportar pública
gpg --import clave.asc                 # importar al llavero
gpg -e -r destinatario archivo         # cifrar con su pública
gpg -d archivo.gpg                     # descifrar
gpg --clearsign archivo                # firmar
gpg --verify archivo.asc               # verificar
gpg -se -r destinatario archivo        # firmar y cifrar
gpg --fingerprint                      # ver huella</code></pre>
<ul><li>GPG necesita <b>fecha y hora correctas</b>: claves y firmas tienen fecha de creación y vencimiento.</li>
<li>El archivo cifrado puede pesar <b>menos</b> (GPG comprime antes de cifrar) o <b>más</b> (encabezados OpenPGP; con <code>--armor</code>, Radix-64 suma ~33 %).</li>
<li>“<i>No hay indicios de que la firma pertenezca al propietario</i>”: la firma es válida, pero ninguna clave en la que confiás certificó que esa clave sea de esa persona.</li>
<li>La pública se presenta <b>en persona</b> para comparar la huella y evitar que alguien haga pasar su clave como tuya.</li></ul>`},
{h:"Los 8 escenarios de Alicia y Beto (TP)",b:`<div class="tbl"><table><tr><th>#</th><th>Operación</th><th>Conf.</th><th>Integr.</th><th>Autent.</th><th>No rep.</th></tr>
<tr><td>1</td><td>Alicia cifra con su <b>privada</b> y publica</td><td>No</td><td>Sí</td><td>Sí</td><td>Sí</td></tr>
<tr><td>2</td><td>Alicia cifra con su <b>pública</b> y publica</td><td>Sí (solo ella lo lee)</td><td>No</td><td>No</td><td>No</td></tr>
<tr><td>3</td><td>Alicia cifra con la <b>pública de Beto</b></td><td>Sí</td><td>No</td><td>No</td><td>No</td></tr>
<tr><td>4</td><td>Alicia cifra con la <b>privada de Beto</b></td><td colspan="4">Imposible: no debería tenerla. Si la tiene, la clave está comprometida.</td></tr>
<tr><td>5</td><td>Beto publica mensaje + hash cifrado con su <b>pública</b></td><td>No</td><td colspan="3">Inútil: solo Beto podría verificarlo</td></tr>
<tr><td>6</td><td>Beto publica mensaje + hash cifrado con su <b>privada</b></td><td>No</td><td>Sí</td><td>Sí</td><td>Sí (firma digital)</td></tr>
<tr><td>7</td><td>1º privada de Alicia, 2º pública de Beto</td><td>Sí</td><td>Sí</td><td>Sí</td><td>Sí</td></tr>
<tr><td>8</td><td>1º pública de Beto, 2º privada de Alicia</td><td>Sí</td><td>Sí</td><td>Sí</td><td>Débil</td></tr></table></div>
<p class="note">7 y 8 <b>no son equivalentes</b>: en el 8 la firma va sobre el texto ya cifrado; cualquiera puede quitarla y poner la suya, y no prueba que Alicia conociera el contenido. Lo correcto es firmar y después cifrar (7).</p>`}
],

M.push({id:"tls",n:"06",t:"Protección de comunicaciones: PGP, TLS, SSH",fecha:"28/10 (T) · 03/11 (P)",
fuente:"Teoría AyG_Redes_2026_10_Seguridad_3-Proteccion_de_comunicaciones.pdf + práctica TLS/HTTPS (node/119). Bibliografía: Stallings caps. 16 y 18.1; Goralski cap. 27.",
teo:[
{h:"Dónde se protege la comunicación",b:`<p>Los servicios de seguridad se incorporan como protocolos y mecanismos en una o varias capas; cada capa ofrece soluciones distintas. Niveles: end-to-end, link-level, network-level, transport-level y application-level.</p>
<div class="tbl"><table><tr><th>Nivel</th><th>Protocolos</th></tr>
<tr><td>Aplicación</td><td>PGP, S/MIME, SSH</td></tr>
<tr><td>Transporte</td><td>TLS</td></tr>
<tr><td>Red</td><td>IPsec</td></tr>
<tr><td>Enlace / túneles</td><td>L2TP, VPN de espacio de usuario</td></tr></table></div>`},
{h:"OpenPGP",b:`<ul><li><b>PGP</b> (Pretty Good Privacy): Phil Zimmermann, <b>1991</b>. Estandarizado por el IETF como <b>OpenPGP</b> en el <b>RFC 4880</b> (2007). Implementación más usada: <b>GnuPG</b>.</li>
<li>Servicios para mensajes y archivos: <b>firmas digitales</b>, <b>cifrado simétrico y de clave pública</b>, <b>compresión</b> y conversión <b>Radix-64</b> (ASCII armor) para viajar por SMTP. Incluye gestión de claves y certificados.</li>
<li>Usa una <b>red de confianza</b>: los usuarios se firman las claves entre sí.</li>
<li>Alternativa para correo: <b>S/MIME</b> (RFC 5751), con mensajes <b>PKCS#7</b> y certificados X.509.</li></ul>
<div class="tbl"><table><tr><th>Categoría (GnuPG)</th><th>Algoritmos</th></tr>
<tr><td>Clave pública</td><td>RSA, ELG (ElGamal), DSA, ECDH, ECDSA, EdDSA</td></tr>
<tr><td>Simétricos</td><td>3DES, CAST5, Blowfish, AES-128/192/256, Twofish, Camellia-128/192/256, IDEA</td></tr>
<tr><td>Hash</td><td>SHA1, RIPEMD160, SHA224, SHA256, SHA384, SHA512</td></tr>
<tr><td>Compresión</td><td>Sin compresión, ZIP, ZLIB, BZIP2</td></tr></table></div>
<p><b>Casos de uso:</b> cifrar/descifrar con clave simétrica; crear un par; importar claves al llavero; firmar con la privada propia; verificar con la pública; cifrar para otro con su pública; descifrar con la privada propia; firmar y cifrar; verificar y descifrar.</p>`},
{h:"TLS: historia y ubicación",b:`<div class="tbl"><table><tr><th>Versión</th><th>Año</th><th>RFC</th></tr>
<tr><td>SSL 2.0</td><td>1995</td><td>— (Netscape)</td></tr>
<tr><td>SSL 3.0</td><td>1996</td><td>RFC 6101 (histórico); RFC 7568 (2015) prohíbe usarlo</td></tr>
<tr><td>TLS 1.0</td><td>1999</td><td>RFC 2246</td></tr>
<tr><td>TLS 1.1</td><td>2006</td><td>RFC 4346</td></tr>
<tr><td>TLS 1.2</td><td>2008</td><td>RFC 5246</td></tr>
<tr><td>TLS 1.3</td><td>2018</td><td>RFC 8446</td></tr></table></div>
<p>Funciona <b>sobre TCP</b> y protege protocolos de aplicación como HTTP, SNMP o SIP. Da cifrado y autenticación de uno o ambos extremos, en general con certificados X.509 (también admite certificados OpenPGP, RFC 6091).</p>`},
{h:"Arquitectura de TLS",b:`<pre><code>+-----------+---------------+-------+------------------+
| Handshake | Change Cipher | Alert | Application Data |
|           |  Spec         |       |  (HTTP, ...)     |
+-----------+---------------+-------+------------------+
|                TLS Record Protocol                   |
+------------------------------------------------------+
|                         TCP                          |</code></pre>
<ul><li><b>Record Protocol:</b> confidencialidad e integridad para todo lo de arriba.</li>
<li><b>Handshake:</b> autenticación y negociación de parámetros.</li>
<li><b>Change Cipher Spec:</b> indica el paso a los parámetros nuevos. <b>Eliminado en TLS 1.3</b> (queda un mensaje “dummy” por compatibilidad).</li>
<li><b>Alert:</b> transmite alertas.</li>
<li><b>Application Data:</b> los datos de la aplicación.</li></ul>`},
{h:"TLS Record Protocol",b:`<ol><li>Toma los mensajes de la aplicación o de los protocolos de TLS.</li>
<li><b>Fragmenta</b> en bloques de hasta <b>16384 bytes (2<sup>14</sup>)</b>.</li>
<li><b>Comprime</b> (opcional; solo antes de 1.3).</li>
<li>Calcula un <b>MAC con HMAC</b> (RFC 2104).</li>
<li><b>Cifra</b> fragmento + MAC con un simétrico (AES, IDEA, RC2, RC4, 3DES…). En 1.2: primero MAC, después cifrado (MAC-then-encrypt). En 1.3: <b>AEAD</b> (cifrado autenticado).</li>
<li>Agrega el <b>encabezado</b>.</li></ol>
<div class="tbl"><table><tr><th>Campo del encabezado</th><th>Valor</th></tr>
<tr><td>Content Type</td><td>change_cipher_spec <b>20</b> · alert <b>21</b> · handshake <b>22</b> · application_data <b>23</b></td></tr>
<tr><td>Major/Minor Version</td><td><b>3.3</b> en TLS 1.2; en 1.3 se ignora</td></tr>
<tr><td>Length</td><td>Longitud del fragmento; no más de 2<sup>14</sup> + 2048 bytes</td></tr></table></div>`},
{h:"Alert, Change Cipher Spec y Handshake",b:`<ul><li><b>Alert:</b> mensajes de <b>2 bytes</b>. Primero la criticidad: <b>1 = warning</b>, <b>2 = fatal</b>; después el código de la alerta. Una fatal cierra la conexión de inmediato. Se cifra según el estado actual.</li>
<li><b>Change Cipher Spec</b> (antes de 1.3): <b>1 byte con valor 1</b>, cifrado y comprimido según el estado actual. Lo envían cliente y servidor cuando ya acordaron los parámetros.</li>
<li><b>Handshake:</b> cada mensaje tiene <b>tipo (1 byte)</b>, <b>longitud (3 bytes)</b> y contenido (0 o más bytes).</li></ul>
<p><b>Parámetros de sesión negociados en TLS 1.2:</b></p>
<div class="tbl"><table><tr><th>Parámetro</th><th>Qué es</th></tr>
<tr><td>Session identifier</td><td>Identifica la sesión</td></tr>
<tr><td>Peer certificate</td><td>Certificado del otro extremo</td></tr>
<tr><td>Compression method</td><td>Algoritmo de compresión</td></tr>
<tr><td>Cipher spec</td><td>Función pseudoaleatoria, algoritmo de cifrado, algoritmo MAC y largo del MAC</td></tr>
<tr><td>Master secret</td><td>Secreto compartido de <b>48 bytes</b></td></tr>
<tr><td>Is resumable</td><td>Si la sesión se puede reanudar</td></tr></table></div>`},
{h:"Handshake TLS 1.2 y 1.3",b:`<p><b>TLS 1.2</b> (2 viajes de ida y vuelta):</p>
<ol><li><b>ClientHello:</b> versiones, aleatorio, suites de cifrado, extensiones (SNI con el nombre del sitio).</li>
<li><b>ServerHello:</b> versión y suite elegidas, aleatorio del servidor.</li>
<li><b>Certificate:</b> la cadena del servidor.</li>
<li><b>ServerKeyExchange:</b> parámetros (EC)DHE firmados.</li>
<li><b>ServerHelloDone.</b></li>
<li><b>ClientKeyExchange.</b> Ambos derivan el master secret.</li>
<li><b>ChangeCipherSpec + Finished</b> de cada lado.</li>
<li>Datos de aplicación cifrados.</li></ol>
<p><b>TLS 1.3:</b> tres fases: <b>intercambio de claves</b> (key exchange), <b>parámetros del servidor</b> (server parameters) y <b>autenticación</b>. Un viaje de ida y vuelta; con <b>claves precompartidas (PSK)</b> permite enviar datos en <b>0-RTT</b>. Solo (EC)DHE efímero y cifrados AEAD; el certificado viaja cifrado.</p>
<div class="key">Suite TLS 1.2 <code>TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256</code>: intercambio ECDHE · autenticación RSA · cifrado AES-128-GCM · SHA-256 para derivar claves. En 1.3 la suite solo nombra cifrado y hash: <code>TLS_AES_128_GCM_SHA256</code>.</div>`},
{h:"Certificados X.509 y PKI (práctica)",b:`<div class="tbl"><table><tr><th>Campo</th><th>Contenido</th></tr>
<tr><td>Versión, número de serie</td><td>v3, identificador dentro de la CA</td></tr>
<tr><td>Algoritmo de firma</td><td>sha256WithRSAEncryption, ecdsa-with-SHA256…</td></tr>
<tr><td>Emisor / Sujeto</td><td>CA que firmó / dueño del certificado</td></tr>
<tr><td>Validez</td><td>Not Before / Not After</td></tr>
<tr><td>Clave pública del sujeto</td><td>Algoritmo y clave</td></tr>
<tr><td>Extensiones</td><td><b>Subject Alternative Name</b> (todos los nombres o IP válidos), Key Usage, Basic Constraints, CRL, OCSP</td></tr>
<tr><td>Firma de la CA</td><td>Hash del certificado firmado con la privada de la CA</td></tr></table></div>
<p><b>Cadena:</b> CA raíz (autofirmada, preinstalada en navegador o SO) → CA intermedia → certificado del sitio. Revocación: CRL u OCSP.</p>
<p><b>Causas de invalidez:</b> vencido, nombre fuera del SAN, CA no confiable o autofirmado, revocado, cadena incompleta (falta el intermedio), algoritmo débil.</p>
<p><b>Archivos:</b> <code>.key</code> clave privada · <code>.csr</code> solicitud (pública + sujeto, firmada con la privada) · <code>.crt</code> certificado firmado.</p>
<pre><code>openssl genrsa -out srv.key 2048
openssl req -new -key srv.key -out srv.csr
openssl x509 -req -in srv.csr -signkey srv.key -days 365 -out srv.crt
openssl s_client -connect host:443 -showcerts</code></pre>
<p>Apache: <code>a2enmod ssl</code>, <code>a2ensite default-ssl</code>, <code>SSLCertificateFile</code> y <code>SSLCertificateKeyFile</code>. Agregar una CA falsa al navegador permite falsificar cualquier sitio; quitar CA hace fallar sitios legítimos.</p>`},
{h:"SSH",b:`<p>Login remoto y <b>tunneling</b> de conexiones TCP/IP. Autentica al servidor con su <b>host key</b> y negocia intercambio de claves, cifrado simétrico, clave pública, MAC y hash.</p>
<div class="tbl"><table><tr><th>Capa</th><th>RFC</th><th>Función</th></tr>
<tr><td>Transport Layer Protocol</td><td>4253</td><td>Autenticación del servidor, confidencialidad, integridad y compresión opcional</td></tr>
<tr><td>User Authentication Protocol</td><td>4252</td><td>Autentica al usuario ante el servidor</td></tr>
<tr><td>Connection Protocol</td><td>4254</td><td>Multiplexa varios canales lógicos en una conexión</td></tr></table></div>
<p><b>Métodos de autenticación:</b> publickey, password, hostbased y keyboard-interactive (mensajes genéricos, RFC 4256).</p>
<p><b>Tipos de canal:</b> session, x11, direct-tcpip, forwarded-tcpip.</p>
<ul><li><b>Local (-L, direct-tcpip):</b> un puerto del cliente se lleva a un host:puerto del lado remoto. <code>ssh -L 127.0.0.1:80:intra.example.com:80 gw.example.com</code></li>
<li><b>Remoto (-R, forwarded-tcpip):</b> un puerto del servidor se lleva a un host:puerto del lado local. <code>ssh -R 8080:localhost:80 public.example.com</code></li></ul>`}
],
