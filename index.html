M.push({id:"vpn",n:"07",t:"VPN: IPsec, OpenVPN, WireGuard",fecha:"04/11 (T) · 10/11 (P)",
fuente:"Teoría AyG_Redes_2026_11_Seguridad_4.pdf. Bibliografía: Stallings cap. 19; Goralski caps. 27 y 33; Yonan (2003); Hertzog cap. 10.2. Práctica: node/109 (versión 2025, la última publicada).",
teo:[
{h:"Qué es una VPN",b:`<p>Conjunto de herramientas que permite que redes de distintos lugares se conecten de forma segura usando una <b>red pública como transporte</b> (definición de James Yonan, creador de OpenVPN). Usan cifrado para dar <b>confidencialidad, autenticidad e integridad</b>.</p>
<p>Antes se usaban enlaces satelitales o inalámbricos, dial-up por PSTN y enlaces punto a punto contratados.</p>
<ul><li><b>Acceso remoto:</b> usuarios a la red corporativa.</li>
<li><b>Intranet:</b> sucursales con la red de la empresa.</li>
<li><b>Extranet:</b> socios, proveedores y clientes.</li></ul>`},
{h:"Servicios que debe dar una VPN",b:`<ol><li><b>Cifrado de datos:</b> ilegibles en la red pública para los no autorizados.</li>
<li><b>Encapsulamiento y enrutamiento:</b> cabecera adicional para atravesar la red pública por un túnel; la red remota lo entrega al host destino.</li>
<li><b>Soporte de múltiples protocolos.</b></li>
<li><b>Autenticación de usuarios y paquetes.</b></li>
<li><b>Administración de claves:</b> generar y renovar claves de clientes y servidor.</li>
<li><b>Administración de direcciones:</b> asignar a los clientes IP de la red corporativa y mantenerlas privadas.</li></ol>`},
{h:"Implementaciones",b:`<div class="tbl"><table><tr><th>Tecnología</th><th>Dónde corre</th><th>Transporte</th><th>Notas</th></tr>
<tr><td>IPsec (IKE)</td><td>Kernel, capa 3</td><td>ESP proto 50, AH proto 51; IKE UDP 500; NAT-T UDP 4500</td><td>El estándar más conocido, complejo</td></tr>
<tr><td>OpenVPN</td><td>Espacio de usuario</td><td>UDP 1194 (recomendado) o TCP</td><td>De las más usadas; usa TLS</td></tr>
<tr><td>WireGuard</td><td>Kernel</td><td>UDP 51820</td><td>Reciente, rápido y simple</td></tr>
<tr><td>PPTP / SSTP</td><td>Microsoft</td><td></td><td>PPTP inseguro; reemplazado por SSTP</td></tr>
<tr><td>L2TP/IPsec</td><td></td><td></td><td>L2TP solo no cifra</td></tr>
<tr><td>MPLS</td><td>Proveedor</td><td></td><td>Red a red intra-proveedor, <b>sin cifrado</b></td></tr></table></div>
<p><b>Funcionamiento general:</b> 1) sin VPN el tráfico va por la red pública; 2) cliente y servidor crean interfaces virtuales (tunN); 3) se establece el túnel: conexión y autenticación de extremos.</p>`},
{h:"IPsec: generalidades, AH y ESP",b:`<ul><li>Años 90. Era <b>obligatorio en IPv6</b> y después pasó a <b>recomendado</b>; en IPv4 es opcional. Última actualización importante: <b>RFC 4301</b> (2005).</li>
<li>Dos modos: <b>transporte</b> y <b>túnel</b>.</li>
<li><b>AH</b> (RFC 4302): autenticación, integridad y anti-replay; protege la carga y partes del encabezado IP. <b>No da confidencialidad.</b> No atraviesa NAT (NAT cambia la IP que AH protege).</li>
<li><b>ESP</b> (RFC 4303): autenticación, integridad, anti-replay y <b>confidencialidad</b>.</li></ul>
<div class="tbl"><table><tr><th>Modo</th><th>Qué se protege</th><th>Uso</th></tr>
<tr><td><b>Transporte</b></td><td>La carga (TCP + datos). El encabezado IP original queda casi sin cambios y sin cifrar</td><td>Host a host</td></tr>
<tr><td><b>Túnel</b></td><td>Todo el paquete IP original, dentro de un encabezado IP nuevo sin cifrar</td><td>Gateway a gateway</td></tr></table></div>
<pre><code>Transporte:  [IP orig][ESP hdr][ TCP + datos ]cifrado[ESP trailer][ESP auth]
Túnel:       [IP nuevo][ESP hdr][ IP orig + TCP + datos ]cifrado[trailer][auth]</code></pre>`},
{h:"SA, SADB, SPD e IKE",b:`<ul><li><b>SA:</b> cómo se protege <b>cada sentido</b> de cada conexión (unidireccional). Parámetros: algoritmo de cifrado, de hash, claves de cifrado y autenticación, vida útil de las claves, valores de inicialización. Se configura a mano o con ISAKMP/IKE. Se identifica por <b>SPI + IP destino + protocolo (AH/ESP)</b>.</li>
<li><b>SADB:</b> guarda los parámetros de cada SA: SPI, contador de secuencia, ventana anti-replay, info de AH y ESP, vida útil, modo, MTU de ruta, DSCP.</li>
<li><b>SPD:</b> cómo se aplica IPsec al tráfico entrante y saliente. Acciones: <b>DISCARD</b>, <b>BYPASS</b>, <b>PROTECT</b>. Selectores: IP local y remota, protocolo superior, puertos (o tipo/código ICMP).</li></ul>
<div class="tbl"><table><tr><th>Ejemplo SPD</th><th>Acción</th></tr>
<tr><td>UDP puerto 500 (IKE)</td><td>BYPASS</td></tr>
<tr><td>TCP hacia una red protegida</td><td>PROTECT (con su SPI)</td></tr>
<tr><td>Tráfico hacia una IP prohibida</td><td>DISCARD</td></tr></table></div>
<p>Ejemplos SADB: HMAC-SHA2 con AES-GCM; HMAC-SHA1 con 3DES-CBC, en modo transporte o túnel.</p>
<p><b>IKE:</b> antes las claves se distribuían fuera de línea. IKE usa <b>criptografía asimétrica, certificados X.509 y Diffie-Hellman</b> para distribuir SA y claves. Es complejo e integra otros protocolos. <b>UDP 500 (ISAKMP)</b>. Implementaciones libres: familia *swan.</p>`},
{h:"OpenVPN",b:`<p>A diferencia de IPsec (kernel), OpenVPN es una <b>aplicación</b> independiente del SO. Crea una interfaz virtual (<code>tun0</code>): lo que el stack TCP/IP envía por ella lo recibe el proceso OpenVPN, que agrega sus encabezados, cifra (opcional) y manda por la interfaz real. Del otro lado, el proceso descifra, autentica y entrega el paquete al stack como recién llegado.</p>
<ul><li><b>Confidencialidad:</b> sin cifrado o cifrado simétrico.</li>
<li><b>Autenticación:</b> ninguna; clave precompartida; usuario y contraseña; o claves asimétricas con X.509 y cero, una o más CA (como TLS).</li></ul>
<p><b>Encapsulamiento:</b> aplicación → TCP → IP → (enlace virtual) → OpenVPN → transporte, red y enlace reales.</p>
<div class="key"><b>TCP sobre TCP:</b> duplica control de errores, control de congestión, temporizadores y buffers, y degrada el rendimiento. Se recomienda <b>UDP 1194</b>: poco overhead y, como IP, sin garantía de entrega (TCP de adentro se encarga).</div>
<div class="tbl"><table><tr><th>Modo</th><th>Interfaz</th><th>Capa</th><th>Cómo funciona</th></tr>
<tr><td>Routing</td><td>tun0</td><td>3</td><td>Red IP nueva para el túnel (p. ej. 10.9.8.0/30); el servidor rutea entre la red del cliente y la de la organización</td></tr>
<tr><td>Bridging</td><td>tap0</td><td>2</td><td>Extiende la LAN como un switch; el cliente toma IP de la red remota y usa ARP, DHCP…</td></tr></table></div>
<p><b>Tablas de rutas:</b> antes del túnel, cada extremo sale por su ISP. Después, aparece la red del túnel por <code>tun0</code> y el cliente recibe una ruta a la red de la organización vía la IP de túnel del servidor. <b>Solo ese tráfico</b> va por la VPN (split tunnel). Para que salga <b>todo</b>, se cambia la ruta por defecto hacia el túnel (<code>redirect-gateway def1</code>) y se deja una ruta específica al servidor VPN por el gateway real.</p>`},
{h:"WireGuard",b:`<ul><li>Alternativa moderna, simple y rápida. En el kernel de Linux, macOS, BSD, iOS y Android; código reducido.</li>
<li>Reconexión automática y roaming. Interfaz <code>wgX</code>. <b>UDP 51820</b>.</li>
<li>Cada equipo genera su <b>par de claves</b>; las públicas se intercambian <b>fuera de banda</b> para la autenticación mutua.</li>
<li>Handshake eficiente; todo el tráfico va cifrado y encapsulado en UDP.</li>
<li>Se puede agregar una clave simétrica precompartida.</li>
<li>Solo <b>4 tipos de mensajes</b>: handshake initiation, handshake response, cookie reply y transport data.</li>
<li>Criptografía fija: Curve25519, ChaCha20-Poly1305, BLAKE2s (protocolo Noise). <b>AllowedIPs</b> define qué IP usa cada peer y qué se rutea por el túnel.</li></ul>
<pre><code>[Interface]
PrivateKey = ...
Address = 10.0.0.2/24
[Peer]
PublicKey = ...
Endpoint = vpn.ejemplo.com:51820
AllowedIPs = 192.168.10.0/24</code></pre>`},
{h:"Práctica: túneles con OpenVPN y WireGuard (node/109)",b:`<p>En parejas (cliente y servidor) o en Kathará. Objetivo: herramientas para VPN, casos de uso típicos y servicios de seguridad que brindan (categoría <b>S</b> de FCAPS).</p>
<div class="tbl"><table><tr><th>Experiencia</th><th>Qué se hace</th><th>Seguridad</th></tr>
<tr><td>1. Túnel simple punto a punto (OpenVPN)</td><td>Interfaz <code>tun0</code> en cada extremo con IP de 10.9.8.0/24; ping y captura en la interfaz virtual y en la física</td><td>Ninguna: solo encapsula</td></tr>
<tr><td>2. Túnel con clave simétrica (OpenVPN)</td><td>Se genera una clave secreta compartida, se copia al cliente y se escriben los archivos de configuración</td><td>Confidencialidad, integridad y autenticación del par (HMAC)</td></tr>
<tr><td>3. Túnel WireGuard (claves asimétricas)</td><td>Pares de claves en ambos extremos, interfaz <code>wg0</code>, peers y endpoints; captura en la física</td><td>Confidencialidad, integridad y autenticación mutua</td></tr></table></div>
<pre><code>openvpn --remote IP_SERVIDOR --dev tun0 --ifconfig 10.9.8.2 10.9.8.1   # cliente (túnel simple)
openvpn --genkey secret static.key                                     # clave simétrica
wg genkey | tee privada | wg pubkey &gt; publica                           # claves WireGuard
wg show                                                                # estado del túnel</code></pre>
<ul><li>En <code>--ifconfig</code>, la primera IP es la <b>local</b> del túnel y la segunda la del <b>otro extremo</b>.</li>
<li>En la captura de <b>tun0</b> se ve el tráfico ya desencapsulado (el ICMP entre IP del túnel): las PDU de OpenVPN se agregan después, en la interfaz física.</li>
<li>En la <b>física</b>: con el túnel simple se ve UDP 1194 con el ICMP adentro en claro; con clave simétrica solo se ven datagramas UDP entre las IP físicas, sin el ICMP, sin las IP internas ni los datos. El campo <b>HMAC</b> autentica cada paquete y protege su integridad.</li>
<li>Se usa un <b>archivo de clave</b> y no una frase corta porque es aleatorio y largo (máxima entropía): una frase corta cae por diccionario o fuerza bruta.</li>
<li>Para pasar de punto a punto a <b>host a red</b> o <b>red a red</b>: habilitar el reenvío IP (<code>ip_forward</code>) en el extremo que da a la LAN y agregar rutas hacia la red remota (directiva <code>route</code> en OpenVPN, <code>AllowedIPs</code> en WireGuard) y rutas de vuelta (o NAT) en las LAN.</li></ul>`}
],
qa:[
["¿Qué servicios de seguridad da el túnel OpenVPN simple?","Ninguno: solo encapsula; el contenido viaja en claro dentro de UDP."],
["¿Qué servicios da el túnel con clave simétrica?","Confidencialidad, integridad y autenticación de quien tiene la clave (HMAC). No da no repudio."],
["¿Para qué sirven las VPN?","Para comunicaciones seguras sobre redes públicas o inseguras: acceso remoto, intranet entre sucursales y extranet con terceros."],
["¿Cuáles son los seis servicios requeridos de una VPN?","Cifrado, encapsulamiento y ruteo, soporte de múltiples protocolos, autenticación de usuarios y paquetes, administración de claves y de direcciones."],
["¿Cómo se protege la info en tránsito?","Con protocolos en distintas capas: PGP/S-MIME/SSH en aplicación, TLS en transporte, IPsec en red, L2TP y VPN de espacio de usuario."],
["¿Por qué AH no sirve detrás de NAT?","Porque protege la IP de origen y NAT la cambia: la verificación falla."],
["¿Por qué cada SA es unidireccional?","Cada sentido puede tener claves y parámetros propios; una conexión bidireccional usa al menos dos SA."],
["¿Qué diferencia hay entre SADB y SPD?","La SPD dice qué hacer con cada tráfico (PROTECT, BYPASS, DISCARD); la SADB guarda los parámetros de las SA que se usan para proteger."],
["¿Qué tráfico va por la VPN y qué no?","El que la tabla de rutas mande a la interfaz del túnel; el resto sale por el gateway normal."],
["¿Podría salir todo el tráfico por la VPN?","Sí: cambiando la ruta por defecto hacia el túnel y dejando una ruta al servidor VPN por el gateway real."],
["¿Por qué OpenVPN recomienda UDP?","Para evitar TCP sobre TCP: dobles retransmisiones y control de congestión que se pelean entre sí."],
["¿Diferencia entre tun y tap?","tun rutea en capa 3 con una red nueva; tap une en capa 2 y el cliente queda dentro de la LAN remota."],
["¿Qué estado tiene IPsec en IPv6?","Era obligatorio y pasó a ser recomendado."]
],

{q:"En modo túnel, ESP cifra:",o:["Solo los datos","Solo el TCP","El paquete IP original completo","Nada"],a:2,e:"Y agrega un IP nuevo sin cifrar."},

{q:"ESP está definido en:",o:["RFC 4301","RFC 4302","RFC 4303","RFC 4253"],a:2,e:"AH es 4302."},

teo:[
{h:"Virtualización de servidores",b:`<ul><li><b>Hipervisor tipo 1 (bare-metal):</b> sobre el hardware. VMware ESXi, KVM, Xen, Hyper-V.</li>
<li><b>Hipervisor tipo 2 (hosted):</b> sobre un SO. VirtualBox, VMware Workstation.</li>
<li><b>Contenedores:</b> comparten el kernel del host y se aíslan con <i>namespaces</i> y <i>cgroups</i>. Docker; Kathará arma cada equipo como un contenedor.</li>
<li>Ventajas: consolidación, aislamiento, snapshots, <b>migración en vivo</b>, alta disponibilidad, elasticidad.</li></ul>`},
{h:"Redes virtuales",b:`<ul><li><b>Switch virtual:</b> Linux bridge u Open vSwitch.</li>
<li><b>VXLAN:</b> encapsula tramas de capa 2 en UDP 4789 con VNI de 24 bits: ~16 millones de segmentos (contra 4094 VLAN).</li>
<li><b>NFV:</b> firewall, balanceador o router como software en servidores comunes.</li></ul>`},
{h:"Datacenters",b:`<ul><li><b>Norte-sur:</b> datacenter ↔ exterior. <b>Este-oeste:</b> entre servidores internos (hoy mayoritario).</li>
<li><b>Tres capas</b> (acceso, agregación, núcleo): pensado para norte-sur; depende de STP.</li>
<li><b>Spine-leaf:</b> cada leaf conectado a todos los spine; dos saltos entre cualquier par, ECMP, sin STP.</li>
<li><b>Tiers del Uptime Institute:</b> I 99,671 % · II 99,741 % · III 99,982 % (mantenimiento sin cortes) · IV 99,995 % (tolerante a fallas).</li>
<li><b>PUE</b> = energía total / energía de IT (ideal 1).</li></ul>`},
{h:"SDN",b:`<p>Separa el <b>plano de control</b> (decide) del <b>plano de datos</b> (reenvía) y centraliza el control en un <b>controlador</b>.</p>
<ul><li><b>Southbound</b> (controlador → switches): OpenFlow, NETCONF.</li>
<li><b>Northbound</b> (aplicaciones → controlador): REST.</li>
<li>Tablas de flujo <i>match → acción</i>.</li>
<li>Controladores: OpenDaylight, ONOS, Ryu.</li>
<li>Riesgo: el controlador es un SPOF si no se replica.</li></ul>`},
{h:"Cloud computing",b:`<div class="tbl"><table><tr><th>Modelo</th><th>El proveedor gestiona</th><th>Ejemplo</th></tr>

<tr><td>SaaS</td><td>Todo</td><td>Gmail, Jira Cloud</td></tr></table></div>
<p>Despliegue: pública, privada, híbrida, comunitaria. Rasgos: autoservicio, elasticidad, pago por uso, multi-tenant.</p>`}

{q:"Describí los patrones de diseño maestro/esclavo con sus pros y contras.",pts:["Cold spare: apagado; fácil pero requiere acción humana y configurarse","Hot spare: preparado y sincronizado; arranque rápido pero requiere acción humana","Maestro/esclavos: automático con heartbeat; más configuración y monitoreo","Read only: escrituras en master, lecturas en ambos; desfase","Maestro/Maestro: ambos operan; split brain"],modelo:"En maestro + cold spare el spare está apagado: es fácil de mantener, pero el recurso está ocioso, requiere acción humana y configurarse al inicio. En hot spare el spare está preparado con datos sincronizados: arranca rápido, pero sigue ocioso y requiere mantenimiento y acción humana. Maestro/esclavos automatiza el cambio con heartbeat, a costa de más configuración y monitoreo. En maestro/slave read only las escrituras van al master y las lecturas a ambos, lo que mejora la performance pero puede haber desfase. En maestro/maestro ambos operan: distribuye carga, pero requiere sincronización y puede haber split brain."},
{q:"Explicá el patrón balanceador/réplicas, las funciones de un balanceador y tres estrategias.",pts:["Balanceador recibe y reenvía según un criterio a las réplicas","Pros: eficiencia, escalabilidad, disponibilidad, mantenimiento","Contras: sincronización, más equipos, estado (servidor de estado)","Funciones: planificación, lista de servidores, redundancia, distribución por contenido","Tres estrategias bien explicadas (RR, LL, Hashed, Power of Two…)"],modelo:"El balanceador recibe las peticiones y las reenvía a réplicas capaces de resolverlas (ejemplo: servidores web). Mejora el aprovechamiento, la eficiencia, la escalabilidad y la disponibilidad y facilita el mantenimiento; a cambio exige sincronización, más equipos y resolver el estado con un servidor de estado (por ejemplo, sesiones en cookies). Sus funciones son decidir con un algoritmo de planificación, mantener la lista de servidores y su carga, dar redundancia y distribuir según el contenido. Estrategias: Round Robin (en turno), Least Loaded (al menos cargado), Hashed (mismo cliente al mismo servidor), Power of Two Random Choices (dos al azar y el menos cargado)."},
{q:"Explicá qué es un SPOF y cómo se elimina en la arquitectura del laboratorio (Nginx + 3 servidores).",pts:["Define SPOF: su falla detiene todo el servicio","Los tres servidores eliminan el SPOF de los backends","El balanceador queda como SPOF","Se agrega un segundo balanceador en hot standby","Comparten una IP virtual con CARP/ucarp"],modelo:"Un SPOF es un componente cuya falla deja sin servicio a todo el sistema. Con Nginx balanceando hacia srv1, srv2 y srv3, la caída de un backend no afecta al servicio, pero el balanceador queda como SPOF. Se elimina agregando un segundo balanceador en hot standby que comparte con el primero una IP virtual mediante CARP (ucarp); si el master deja de anunciarse, el backup toma la IP."},
{q:"Compará la redundancia por DNS con la de un balanceador de carga.",pts:["DNS: varios registros A, round-robin, capa 7","DNS no detecta servidores caídos","DNS depende del TTL / caché","El balanceador sí detecta fallas (max_fails) y saca al servidor","El balanceador es un punto central (posible SPOF)"],modelo:"Con DNS, el nombre tiene varios registros A y el cliente elige una IP; es simple y distribuye geográficamente, pero DNS no sabe si un servidor cayó y las respuestas quedan en caché según el TTL. Un balanceador como Nginx recibe todas las peticiones, detecta servidores fallidos y los saca del pool, y permite métodos como least_conn o ip_hash; a cambio es un punto central que hay que duplicar."},
{q:"Describí cómo funciona CARP/VRRP y qué pasa con las conexiones TCP en un failover.",pts:["IP virtual compartida entre master y backup","El master envía anuncios periódicos multicast","El backup asume si deja de recibirlos","Envía ARP gratuito para actualizar la MAC","Las conexiones TCP se pierden salvo sincronización de estado"],modelo:"Dos equipos comparten una IP virtual. El master responde por ella y envía anuncios periódicos; si el backup deja de oírlos, se vuelve master y envía un ARP gratuito para que la red asocie la IP virtual a su MAC. Las conexiones TCP abiertas se pierden porque el nuevo nodo no tiene su estado, salvo que se sincronice (conntrackd, pfsync) o los clientes reintenten."}],

{q:"Describí la arquitectura de VoIP y nombrá los protocolos de cada grupo.",pts:["Señalización: SIP, H.323, SCCP, IAX","Transmisión de datos: RTP y RTCP","Soporte: DHCP, TFTP, NTP, DNS","Función de la señalización (establecer/terminar)","Función de RTP (secuencia, timestamp, identificación)"],modelo:"Hay tres grupos. Señalización (SIP, H.323, SCCP, IAX): localiza usuarios y establece, modifica y termina llamadas. Transmisión de datos (RTP y RTCP): RTP encapsula el audio con número de secuencia, marca de tiempo y SSRC; RTCP informa calidad (SR, RR). Soporte (DHCP, TFTP, NTP, DNS): autoconfiguración de teléfonos, provisión, hora y nombres."},
{q:"Explicá el establecimiento de una llamada SIP entre dos UA a través de un servidor, incluyendo SDP.",pts:["REGISTER previo de ambos UA","INVITE con SDP (oferta de códecs, IP y puerto)","100 Trying y 180 Ringing","200 OK con SDP (respuesta)","ACK y luego RTP/RTCP","Cierre con BYE y 200 OK"],modelo:"Ambos UA se registran con REGISTER. A envía INVITE con un SDP que ofrece códecs, IP y puerto para RTP. El servidor responde 100 Trying y reenvía; B responde 180 Ringing y, al atender, 200 OK con su SDP. A confirma con ACK y comienza el intercambio RTP/RTCP. Para colgar, un extremo envía BYE y el otro responde 200 OK."},
{q:"Calculá el ancho de banda de una llamada G.711 con paquetes de 20 ms y explicá el compromiso del tamaño de paquete.",pts:["64 kbps = 8000 Hz × 8 bits","50 paquetes por segundo, 160 bytes de carga","62 bytes de encabezados (Eth 22, IP 20, UDP+RTP 20)","(160+62)×8×50 = 88.800 bps","Paquetes grandes: menos overhead, más latencia y más impacto de pérdidas"],modelo:"G.711 muestrea a 8000 Hz con 8 bits: 64 kbps. Con 20 ms por paquete hay 50 pps y 160 bytes de voz. Sumando Ethernet (22), IP (20) y UDP+RTP (20) son 222 bytes: 222×8×50 = 88.800 bps por sentido. Paquetes más grandes reducen el overhead pero aumentan la latencia de paquetización y el audio perdido por paquete; más chicos, al revés."},
{q:"¿Qué es Nyquist y por qué la telefonía usa 8000 Hz?",pts:["Hay que muestrear al menos al doble de la frecuencia máxima","La voz telefónica llega a ~3400 Hz (300–3400)","8000 Hz cubre hasta 4000 Hz","Por debajo aparece aliasing"],modelo:"El teorema de Nyquist-Shannon dice que para reconstruir una señal hay que muestrearla al menos al doble de su frecuencia máxima. La voz telefónica ocupa 300–3400 Hz, así que 8000 Hz (que representa hasta 4000 Hz) alcanza. Si se muestrea por debajo, las frecuencias altas se pliegan y aparece aliasing."}],

{s:"Un empleado de sistemas cambia las notas de un alumno en el sistema de gestión académica.",c:[0,1,0],e:"El dato dejó de ser correcto: integridad."},

{s:"Alguien captura con Wireshark las contraseñas que viajan por telnet en el Wi-Fi de un bar.",c:[1,0,0],e:"Solo las leyó; no cambió nada ni impidió el servicio: confidencialidad (ataque pasivo)."},
{s:"Un atacante intercepta una orden de transferencia, la lee y cambia la cuenta de destino antes de reenviarla.",c:[1,1,0],e:"Leerla vulnera la confidencialidad y cambiarla, la integridad."},

{s:"Un error en un script de actualización altera los montos de la base de facturación.",c:[0,1,0],e:"Los datos quedan incorrectos aunque nadie lo haya hecho a propósito: integridad."},

dev:[
{q:"Definí activo, amenaza, vulnerabilidad, riesgo, impacto y control, con un ejemplo.",pts:["Activo: lo que tiene valor","Amenaza: lo que atenta (no siempre intencional)","Vulnerabilidad: debilidad que la amenaza aprovecha","Riesgo: posibilidad de daño","Impacto: gravedad del daño","Control: previene, detecta o recupera"],modelo:"Activo es lo que tiene valor (la base de alumnos). Amenaza, lo que puede dañarlo (un atacante o una falla de disco). Vulnerabilidad, la debilidad aprovechada (contraseña débil, sin backup). Riesgo, la posibilidad de daño. Daño es el resultado e impacto su gravedad. Control es lo que reduce la vulnerabilidad, detecta la amenaza o permite recuperarse (2FA, IDS, backups)."},
{q:"Explicá la arquitectura de seguridad X.800 y relacioná los tipos de ataque con los servicios.",pts:["Tres elementos: ataques, mecanismos, servicios","Pasivos vs activos","Interceptación → confidencialidad","Modificación → integridad","Interrupción → disponibilidad","Generación → autenticidad"],modelo:"X.800 define ataques (acciones que comprometen la seguridad, pasivos o activos), mecanismos (procesos que detectan, previenen o recuperan: cifrado, firma, control de acceso…) y servicios (lo que se ofrece: confidencialidad, integridad, disponibilidad, autenticación, no repudio, control de acceso). La interceptación afecta la confidencialidad, la modificación la integridad, la interrupción la disponibilidad y la generación la autenticidad."},
{q:"Compará los tipos de firewall y explicá dónde se ubican.",pts:["Stateless: encabezados de cada paquete","Stateful: tabla de conexiones","ALG/proxy: entiende el protocolo","Gateway de circuito: SOCKS","Ubicaciones: borde, host, personal, WAF, process","DMZ"],modelo:"El filtro stateless decide por interfaz, IP, protocolo y puertos de cada paquete. El stateful agrega una tabla con el estado de las conexiones. El de aplicación (ALG o proxy) entiende el protocolo y filtra por mensajes o usuario. El gateway de circuito (SOCKS) autentica y retransmite conexiones. Se ubican en el borde, en el host, en cada estación (personal), delante del servidor web (WAF) o en el SO (process firewall). Los servicios públicos van en una DMZ."},
{q:"Diferenciá IDS, IPS, SIEM y UTM.",pts:["IDS detecta y alerta, no previene","Firmas o anomalías","IPS está en línea y bloquea (IDS + firewall)","SIEM correlaciona logs (SEM + SIM)","UTM todo en uno; desventaja SPOF"],modelo:"El IDS busca patrones de ataque por firmas o anomalías y alerta, sin prevenir. El IPS está en línea y además bloquea (descarta, bloquea IPs, resetea conexiones). El SIEM junta y correlaciona logs: SEM en tiempo real y SIM para almacenamiento, reportes y forense. El UTM integra firewall, IDS/IPS, antivirus, VPN y más en un equipo, con el riesgo de ser SPOF."}],

{q:"Explicá la diferencia entre un firewall stateless y uno stateful con reglas de nftables para permitir HTTP al webserver.",pts:["Stateless: regla de ida (dport 80) y de vuelta (sport 80)","Problema: cualquiera con sport 80 pasa","Stateful: ct state established,related accept","Regla de ida con ct state new","Estados se ven en /proc/net/nf_conntrack"],modelo:"Sin estado hacen falta dos reglas en forward: ip daddr webserver tcp dport 80 accept, e ip saddr webserver tcp sport 80 accept; la segunda deja pasar cualquier paquete con puerto de origen 80. Con estado se usa connection tracking: ct state established,related accept y ip daddr webserver tcp dport 80 ct state new accept. Las conexiones se ven en /proc/net/nf_conntrack."},

{q:"¿Por qué importa el orden de las reglas y cómo se hacen persistentes?",pts:["Se evalúan en orden","La primera con veredicto final termina","Una regla general arriba anula las de abajo","Handles para borrar (nft -a list ruleset)","Persistencia: /etc/nftables.conf y systemctl enable nftables"],modelo:"nftables evalúa las reglas en orden y se detiene en la primera con veredicto final (accept, drop, reject), así que una regla general arriba puede dejar sin efecto a otras. Se identifican con handles (nft -a list ruleset) y se borran con nft delete rule … handle N. Las reglas están en memoria: se guardan en /etc/nftables.conf y se habilita el servicio nftables."}],

{q:"Compará la criptografía simétrica y la asimétrica: ventajas, desventajas, servicios y algoritmos.",pts:["Simétrica: misma clave; sencilla, rápida, robusta","Simétrica: claves no escalan; da confidencialidad","Algoritmos simétricos (AES, ChaCha20…)","Asimétrica: par de claves; escala mejor","Asimétrica: costo y autenticar claves públicas","Da confidencialidad y firma/no repudio; RSA, ECDSA, ML-KEM…"],modelo:"La simétrica usa la misma clave; es sencilla, rápida y robusta, pero la administración de claves no escala (n(n−1)/2). Da confidencialidad. Ejemplos: AES, 3DES, Twofish (bloque) y ChaCha20, RC4 (flujo). La asimétrica usa un par público/privado; escala mejor, pero es más costosa y exige autenticar las claves públicas. Da confidencialidad (pública del receptor) y autenticación y no repudio (privada del emisor). Ejemplos: RSA, DSA, ECDSA, Ed25519, y poscuánticos como ML-KEM y ML-DSA. En la práctica se combinan."},
{q:"Explicá MAC/HMAC y firma digital, y qué servicios brinda cada uno.",pts:["MAC = C_k(m) con clave compartida","Integridad y autenticación, sin no repudio","HMAC (RFC 2104) con su fórmula","Firma: hash cifrado con la privada del emisor","Verificación con la pública y comparación de hashes","Firma da no repudio"],modelo:"Un MAC es una función del mensaje y una clave secreta compartida, MAC = C_k(m); da integridad y autenticación, pero no no repudio porque ambos conocen la clave. HMAC (RFC 2104) es H((k⊕opad) ‖ H((k⊕ipad) ‖ m)). La firma digital cifra el hash del mensaje con la privada del emisor; el receptor la descifra con la pública, calcula el hash y compara. Da integridad, autenticación y no repudio."},
{q:"¿Qué es la esteganografía y en qué se diferencia del cifrado?",pts:["Oculta la existencia del mensaje","El cifrado oculta el contenido","Lo complementa, no lo reemplaza","Ejemplos: tinta invisible, LSB en imágenes, tatuaje"],modelo:"La esteganografía oculta la existencia del mensaje, mientras que el cifrado oculta su contenido. No lo reemplaza sino que lo complementa: si se descubre el mensaje oculto, sigue protegido si estaba cifrado. Ejemplos: tinta invisible, marcas en caracteres, tatuaje bajo el pelo, reemplazar el bit menos significativo de cada byte de una imagen."}],

{q:"Describí la arquitectura de TLS y el funcionamiento del Record Protocol.",pts:["Funciona sobre TCP","Record Protocol abajo; Handshake, CCS, Alert y Application Data arriba","Fragmenta en bloques de hasta 2^14 bytes","Compresión opcional (antes de 1.3)","MAC con HMAC y cifrado simétrico (1.2) / AEAD (1.3)","Encabezado: Content Type, versión, longitud"],modelo:"TLS funciona sobre TCP. El Record Protocol da confidencialidad e integridad a los protocolos de arriba: Handshake, Change Cipher Spec, Alert y Application Data. Toma los datos, fragmenta en bloques de hasta 16384 bytes, comprime opcionalmente (antes de 1.3), calcula un MAC con HMAC, cifra fragmento y MAC con un simétrico (en 1.3, AEAD) y agrega un encabezado con Content Type (20–23), versión (3.3 en 1.2) y longitud."},
{q:"Compará el handshake de TLS 1.2 con el de TLS 1.3.",pts:["1.2: ClientHello, ServerHello, Certificate, KeyExchange, Finished","1.2: parámetros de sesión, master secret de 48 bytes","1.2: Change Cipher Spec","1.3: fases key exchange, server parameters, authentication","1.3: 1-RTT y 0-RTT con PSK","1.3: sin CCS real, solo AEAD y (EC)DHE"],modelo:"En 1.2 se intercambian ClientHello y ServerHello, el servidor envía su certificado y parámetros de intercambio, el cliente su parte, ambos derivan un master secret de 48 bytes, envían Change Cipher Spec y Finished. Se negocian session id, certificado, compresión, cipher spec y si es reanudable. En 1.3 hay tres fases (intercambio de claves, parámetros del servidor y autenticación), un solo viaje de ida y vuelta, 0-RTT con PSK, se elimina Change Cipher Spec y solo se usan (EC)DHE y AEAD."},
{q:"Explicá OpenPGP: origen, servicios y algoritmos.",pts:["Zimmermann 1991; OpenPGP RFC 4880 (2007)","Firma, cifrado simétrico y de clave pública","Compresión y Radix-64","Gestión de claves; GnuPG","Algoritmos (RSA, ELG, AES, SHA256…)","S/MIME como alternativa"],modelo:"PGP lo creó Phil Zimmermann en 1991 y el IETF lo estandarizó como OpenPGP (RFC 4880, 2007). Brinda firma digital, cifrado simétrico y de clave pública, compresión y conversión Radix-64 para SMTP, además de gestión de claves. GnuPG es la implementación más usada: RSA, ELG, DSA, ECDH, ECDSA, EdDSA; AES, Camellia, Twofish…; SHA1 a SHA512; ZIP, ZLIB, BZIP2. La alternativa para correo es S/MIME (RFC 5751, PKCS#7)."},
{q:"Describí SSH: capas, autenticación y port forwarding.",pts:["Transport (RFC 4253), User Auth (4252), Connection (4254)","Host key autentica al servidor","Métodos: publickey, password, hostbased, keyboard-interactive","Canales: session, x11, direct-tcpip, forwarded-tcpip","-L local y -R remoto con ejemplo"],modelo:"SSH tiene tres capas: Transport (RFC 4253), que autentica al servidor con su host key y da confidencialidad e integridad; User Authentication (RFC 4252), con publickey, password, hostbased o keyboard-interactive (RFC 4256); y Connection (RFC 4254), que multiplexa canales: session, x11, direct-tcpip y forwarded-tcpip. Con -L un puerto local lleva a un destino del lado remoto; con -R un puerto del servidor lleva a un destino del lado local."}],

{q:"Explicá IPsec: AH, ESP, modos de operación y para qué se usa cada uno.",pts:["AH: autenticación, integridad, anti-replay, sin confidencialidad","ESP: además confidencialidad","Transporte: protege la carga, IP original visible","Túnel: todo el paquete dentro de un IP nuevo","Transporte host a host; túnel gateway a gateway","AH no atraviesa NAT"],modelo:"IPsec ofrece AH (RFC 4302), que da autenticación, integridad y anti-replay sin confidencialidad, y ESP (RFC 4303), que agrega confidencialidad. En modo transporte se protege la carga y el encabezado IP original queda visible; se usa host a host. En modo túnel todo el paquete original se encapsula y cifra dentro de un IP nuevo; se usa entre gateways. AH no atraviesa NAT porque protege la IP."},
{q:"Explicá SA, SADB, SPD e IKE.",pts:["SA: parámetros de un sentido (unidireccional)","Se identifica por SPI + IP destino + protocolo","SADB guarda los parámetros","SPD: DISCARD, BYPASS, PROTECT con selectores","IKE: negocia SA y claves (X.509, DH), UDP 500"],modelo:"Una SA describe cómo se protege un sentido de una conexión (algoritmos, claves, vida útil) y se identifica por SPI, IP destino y protocolo. La SADB guarda los parámetros de cada SA (SPI, contador, ventana anti-replay, modo…). La SPD decide qué hacer con el tráfico según selectores (IP, protocolo, puertos): DISCARD, BYPASS o PROTECT. IKE negocia las SA y distribuye claves con criptografía asimétrica, X.509 y Diffie-Hellman, sobre UDP 500."},
{q:"Explicá el funcionamiento de OpenVPN, el problema de TCP sobre TCP y los modos routing y bridging.",pts:["Aplicación en espacio de usuario con interfaz tun","El proceso encapsula, cifra y envía por la interfaz real","TCP sobre TCP duplica control de errores y congestión","Recomendado UDP 1194","Routing (tun, capa 3) vs bridging (tap, capa 2)","Rutas definen qué tráfico va por la VPN"],modelo:"OpenVPN es una aplicación que crea una interfaz virtual (tun0). Lo que el stack envía por ella lo recibe el proceso, que encapsula, cifra y envía por la interfaz real; el otro extremo descifra, autentica y entrega. Si el túnel va por TCP y adentro hay TCP, se duplican retransmisiones y control de congestión, por eso se recomienda UDP 1194. En routing (tun) el túnel es una red IP nueva y el servidor rutea; en bridging (tap) se extiende la LAN en capa 2. Las rutas definen qué tráfico va por la VPN; con redirect-gateway va todo."},
{q:"Compará OpenVPN, IPsec y WireGuard.",pts:["IPsec: kernel, estándar, complejo, IKE UDP 500","OpenVPN: espacio de usuario, TLS, UDP 1194","WireGuard: kernel, simple, UDP 51820","WireGuard: claves públicas fuera de banda, 4 mensajes","WireGuard: roaming y reconexión"],modelo:"IPsec está en el kernel, es el estándar más conocido pero complejo, con AH/ESP e IKE en UDP 500. OpenVPN es una aplicación portable que usa TLS y certificados, típicamente sobre UDP 1194. WireGuard es moderno y simple, en el kernel, con poco código, UDP 51820, claves públicas intercambiadas fuera de banda, solo 4 tipos de mensaje y soporte de roaming."}],

/* addSec: agrega un tema de teoría al final del módulo, con sus preguntas de control */
function addSec(id,sec){const m=M.find(x=>x.id===id);const keys=[];
  (sec.mcq||[]).forEach(q=>{m.mcq.push(q);keys.push("m"+(m.mcq.length-1))});
  (sec.vf||[]).forEach(q=>{m.vf.push(q);keys.push("v"+(m.vf.length-1))});
  (sec.fill||[]).forEach(q=>{m.fill.push(q);keys.push("f"+(m.fill.length-1))});
  m.teo.push({h:sec.h,b:sec.b});m.ctl.push(keys);
  (sec.dev||[]).forEach(d=>m.dev.push(d));(sec.order||[]).forEach(o=>m.order.push(o));(sec.match||[]).forEach(o=>m.match.push(o))}

const PD={
servicios:{ex:"2º parcial 2015 · 1",q:"a) Describí brevemente los servicios de seguridad básicos. b) Elegí uno y detallalo. c) Describí una forma de implementación concreta que permita proveer dicho servicio.",
 pts:["Confidencialidad: solo los autorizados leen","Integridad: llega sin modificaciones","Disponibilidad: accesible cuando se necesita","Autenticación: el emisor es quien dice ser","No repudio: no se puede negar haber enviado o recibido","Control de acceso: quién accede a qué y cómo","Detalle de uno (mecanismos que usa, ataques que lo vulneran)","Implementación concreta (p. ej. HTTPS con TLS y AES-GCM, o firma con GnuPG)"],
 modelo:"a) Según X.800: <b>confidencialidad</b> (solo las partes autorizadas leen la información), <b>integridad</b> (llega sin modificaciones), <b>disponibilidad</b> (el servicio está accesible para los autorizados), <b>autenticación</b> (la identidad del emisor no es falsa), <b>no repudio</b> (emisor o receptor no pueden negar haber enviado o recibido) y <b>control de acceso</b> (quién accede a qué recursos y cómo).<br>b) <b>Confidencialidad:</b> la vulnera la interceptación, un ataque pasivo difícil de detectar, por eso se previene. Se basa en el cifrado: simétrico (AES, ChaCha20) para los datos, porque es rápido, y asimétrico o Diffie-Hellman para acordar la clave de sesión.<br>c) <b>HTTPS con TLS:</b> el servidor tiene un certificado X.509 firmado por una CA; en el handshake se acuerda con ECDHE una clave de sesión y el Record Protocol cifra cada registro con AES-GCM. Quien capture el tráfico solo ve datos cifrados. (Otra opción: cifrar un archivo con la clave pública del destinatario usando GnuPG)."},
ipsectls:{ex:"2º parcial 2015 · 2",q:"Existen diversos protocolos estándar orientados a brindar servicios de seguridad a la transmisión de mensajes por una red no segura, como IPsec y TLS. Realizá una comparación.",
 pts:["Capa: IPsec en red, TLS en transporte","IPsec protege todo el tráfico IP sin cambiar las aplicaciones; TLS cada aplicación debe usarlo","IPsec en el kernel; TLS en bibliotecas de la aplicación","Ambos: confidencialidad, integridad, autenticación, anti-replay","Negociación: IKE + SA vs handshake + suites","Transporte: ESP/AH (proto 50/51), IKE UDP 500 vs sobre TCP (DTLS en UDP)","NAT: AH no atraviesa, ESP con NAT-T; TLS sin problema","Usos: VPN sitio a sitio vs HTTPS, correo, VPN SSL"],
 modelo:"<div class='tbl'><table><tr><th></th><th>IPsec</th><th>TLS</th></tr><tr><td>Capa</td><td>Red</td><td>Transporte (sobre TCP; DTLS sobre UDP)</td></tr><tr><td>Qué protege</td><td>Todo el tráfico IP entre hosts o redes, transparente a las aplicaciones</td><td>Una conexión de una aplicación que lo implementa</td></tr><tr><td>Dónde se implementa</td><td>Núcleo del SO o gateway</td><td>Biblioteca de la aplicación (OpenSSL)</td></tr><tr><td>Componentes</td><td>AH, ESP, SA/SADB/SPD, IKE</td><td>Record, Handshake, Alert, CCS</td></tr><tr><td>Negociación</td><td>IKE (UDP 500) con X.509 o PSK y Diffie-Hellman</td><td>Handshake con certificados X.509 y (EC)DHE</td></tr><tr><td>Modos</td><td>Transporte y túnel</td><td>—</td></tr><tr><td>NAT</td><td>AH no lo atraviesa; ESP con NAT-T (UDP 4500)</td><td>Sin problemas</td></tr><tr><td>Usos típicos</td><td>VPN sitio a sitio y acceso remoto</td><td>HTTPS, correo seguro, VPN SSL (OpenVPN)</td></tr></table></div>Los dos dan confidencialidad, integridad, autenticación del origen y protección contra repetición, y usan simétrico para los datos y asimétrico para autenticar y acordar claves. IPsec protege más tráfico sin tocar las aplicaciones, pero es más complejo de configurar; TLS es más simple y granular, pero cada aplicación debe incorporarlo."},
fwidsips:{ex:"2º parcial 2015 · 3",q:"a) ¿Cuál es la funcionalidad de un firewall, un IDS y un IPS? b) ¿Dónde se implementan? c) ¿En qué se diferencian?",
 pts:["Firewall: controla el tráfico entre redes según una política y reglas (ACL)","IDS: detecta ataques por firmas o anomalías y alerta","IPS: detecta y bloquea en línea (IDS + firewall)","Firewall: borde, host, personal, WAF, DMZ","IDS: escucha una copia del tráfico (puerto espejo / tap) o en el host (HIDS)","IPS: en línea, en el camino del tráfico","Diferencia: el firewall decide por reglas de acceso; el IDS no previene; el IPS sí actúa"],
 modelo:"a) El <b>firewall</b> es la barrera por la que pasa todo el tráfico entre redes; según su política y sus reglas (ACL) permite o deniega, registra la actividad y puede hacer NAT o terminar VPN. El <b>IDS</b> analiza el tráfico o los eventos buscando ataques por <b>firmas</b> conocidas o <b>anomalías</b> (picos, volumen, protocolos raros) y genera alertas, incluso de ataques internos. El <b>IPS</b> hace lo mismo pero además <b>bloquea</b>: descarta paquetes, bloquea la IP de origen o resetea la conexión.<br>b) El firewall, en el borde de la red (separando LAN, DMZ e Internet), en cada host, como firewall personal o como WAF delante del servidor web. El IDS, conectado a un puerto espejo o tap para ver una copia del tráfico (NIDS) o instalado en el servidor (HIDS). El IPS, en línea, en el camino del tráfico, a menudo integrado al firewall o a un UTM.<br>c) El firewall decide por reglas de acceso (origen, destino, puertos, estado); el IDS entiende patrones de ataque pero solo avisa, no previene; el IPS combina las dos cosas y actúa. El IDS no afecta el tráfico si falla; un IPS en línea que falla puede cortar el servicio."},
hipervisores:{ex:"2º parcial 2015 · 4",q:"a) ¿Cuál es la forma de operación de los hipervisores Tipo I y Tipo II puros? b) Compará ventajas y desventajas de cada enfoque.",
 pts:["Tipo I: corre directamente sobre el hardware (bare-metal)","Tipo I controla el hardware y planifica las VM","Tipo II: corre como aplicación sobre un SO anfitrión","Tipo II usa los drivers y servicios del SO anfitrión","Ventajas tipo I: rendimiento, aislamiento, seguridad, producción","Desventajas tipo I: compatibilidad de hardware, gestión remota, costo","Ventajas tipo II: fácil de instalar, escritorio, pruebas","Desventajas tipo II: overhead y dependencia del SO anfitrión"],
 modelo:"a) El <b>tipo I (nativo o bare-metal)</b> se ejecuta directamente sobre el hardware, en el modo más privilegiado: él mismo administra CPU, memoria y dispositivos y los reparte entre las máquinas virtuales (ESXi, Xen, Hyper-V, KVM). El <b>tipo II (hosted)</b> es una aplicación más sobre un sistema operativo anfitrión: las VM son procesos y el acceso al hardware pasa por los drivers del anfitrión (VirtualBox, VMware Workstation).<br>b) <b>Tipo I</b>: mayor rendimiento (sin capa intermedia), mejor aislamiento y seguridad (menos superficie de ataque), ideal para servidores y datacenters; a cambio soporta menos hardware, requiere una máquina dedicada y se gestiona desde otra consola, y suele ser más costoso. <b>Tipo II</b>: se instala como cualquier programa y aprovecha los drivers del anfitrión, ideal para escritorio, pruebas y desarrollo; a cambio tiene más overhead, depende del SO anfitrión (si este falla o se compromete, caen las VM) y rinde menos."},
popek:{ex:"2º parcial 2015 · 5",q:"a) Popek y Goldberg describen formalmente una característica necesaria para implementar un Monitor de Máquina Virtual. ¿Cuál es esa propiedad? b) ¿Cómo ha sido posible implementar virtualización en arquitecturas que no cumplían con esa propiedad?",
 pts:["Instrucciones sensibles ⊆ instrucciones privilegiadas","Así toda instrucción sensible genera una trampa en modo usuario (trap-and-emulate)","Propiedades del VMM: equivalencia, control de recursos, eficiencia","x86 no la cumplía: instrucciones sensibles no privilegiadas","Traducción binaria (VMware)","Paravirtualización: SO modificado con hypercalls (Xen)","Soporte de hardware: Intel VT-x / AMD-V"],
 modelo:"a) Popek y Goldberg (1974) demostraron que se puede construir un VMM si el conjunto de <b>instrucciones sensibles</b> (las que leen o cambian el estado privilegiado de la máquina o dependen de él) es un <b>subconjunto de las instrucciones privilegiadas</b> (las que generan una trampa si se ejecutan en modo usuario). Así el SO invitado corre en modo usuario y cada instrucción sensible produce una trampa que el VMM <b>atrapa y emula</b> (trap-and-emulate). El VMM debe cumplir <b>equivalencia</b> (el programa se comporta igual que en la máquina real), <b>control de recursos</b> (el VMM controla todo el hardware) y <b>eficiencia</b> (la mayoría de las instrucciones corren directo en la CPU).<br>b) La arquitectura x86 tenía instrucciones sensibles no privilegiadas (como POPF o SGDT) que no generaban trampa. Se resolvió con: <b>traducción binaria</b> (VMware: reescribe al vuelo el código del kernel invitado y reemplaza esas instrucciones), <b>paravirtualización</b> (Xen: se modifica el SO invitado para que llame al hipervisor con hypercalls) y <b>virtualización asistida por hardware</b> (Intel VT-x y AMD-V agregan un modo de ejecución para el hipervisor y hacen que esas instrucciones generen trampa)."},
tiers:{ex:"2º parcial 2015 · 6",q:"De acuerdo a los requerimientos funcionales, ¿cuáles son las diferencias entre un datacenter calificado Tier II y uno Tier III?",
 pts:["Tier II: componentes de capacidad redundantes (N+1)","Tier II: un solo camino de distribución de energía y refrigeración","Tier II: el mantenimiento obliga a apagar","Tier III: mantenible concurrentemente","Tier III: múltiples caminos de distribución (uno activo) y componentes N+1","Disponibilidad: ~99,741 % (≈22 h/año) vs ~99,982 % (≈1,6 h/año)"],
 modelo:"Según la clasificación del Uptime Institute: un <b>Tier II</b> (componentes redundantes) agrega redundancia en los componentes de capacidad (UPS, generadores, equipos de frío en N+1) pero tiene <b>un único camino de distribución</b> de energía y refrigeración: una falla en ese camino o cualquier mantenimiento sobre él obliga a apagar. Disponibilidad esperada ≈ 99,741 % (unas 22 h de caída al año). Un <b>Tier III</b> es <b>mantenible concurrentemente</b>: además de componentes N+1 tiene <b>múltiples caminos de distribución</b> (uno activo y otro alternativo), de modo que cualquier componente o camino puede mantenerse o reemplazarse sin detener la operación; los equipos IT tienen doble fuente. Disponibilidad ≈ 99,982 % (≈ 1,6 h al año). Un Tier IV agrega tolerancia a fallas, con caminos activos simultáneos."},
codec:{ex:"2º parcial 2015 · 7",q:"¿Cuáles son los parámetros fundamentales de un códec? Relacionalos con su utilización para transmitir voz sobre una red de datos no fiable como Internet.",
 pts:["Frecuencia de muestreo (Nyquist, 8 kHz en voz)","Resolución / bits por muestra","Tasa de bits (bitrate) y compresión","Tamaño de trama / paquetización (ms)","Retardo algorítmico y complejidad (CPU)","Calidad (MOS) y robustez ante pérdidas (PLC, FEC)","Relación con Internet: ancho de banda, latencia, jitter y pérdidas"],
 modelo:"Parámetros: <b>frecuencia de muestreo</b> (al menos el doble de la frecuencia máxima por Nyquist: 8 kHz para voz telefónica, 16 kHz en banda ancha); <b>resolución</b> (bits por muestra); <b>tasa de bits</b> resultante y nivel de compresión (G.711 64 kbps, G.729 8 kbps, Opus 6–510 kbps); <b>tamaño de trama o paquetización</b> (por ejemplo 20 ms); <b>retardo algorítmico</b> y <b>complejidad</b> (CPU necesaria); <b>calidad</b> percibida (MOS) y <b>robustez ante pérdidas</b> (ocultamiento de pérdidas, FEC). En Internet el ancho de banda varía y hay latencia, jitter y pérdida: conviene un bitrate bajo o adaptativo, pero más compresión implica más CPU, más retardo y menos calidad; tramas chicas bajan la latencia pero suben el overhead (62 bytes de encabezado por paquete); si se pierde un paquete con mucha voz se nota más. Por eso se usan códecs adaptativos y robustos como Opus o iLBC, jitter buffer en el receptor y QoS donde se pueda."},
sipproto:{ex:"2º parcial 2015 · 8 · Final 2016 · 5",q:"Enumerá los protocolos de un escenario VoIP basado en SIP, indicando componentes, la interrelación entre ellos, en qué momento se utilizan y su finalidad.",
 pts:["Componentes: UA (UAC/UAS), registrar, proxy, redirect, PBX","Al encender: DHCP (IP + opción 66), TFTP (configuración), NTP (hora), DNS","SIP REGISTER para registrarse (401 → credenciales → 200 OK)","SIP INVITE/180/200/ACK/BYE para establecer y terminar","SDP dentro de SIP para negociar códecs, IP y puertos","RTP para el audio; RTCP para estadísticas de calidad","Interrelación: SDP dice a dónde va el RTP; RTCP acompaña al RTP"],
 modelo:"<b>Componentes:</b> los User Agents (teléfonos o softphones, que actúan como UAC al pedir y UAS al responder), y en el servidor (PBX como Asterisk) los roles de registrar, proxy y redirect.<br><b>1. Arranque:</b> DHCP entrega IP, gateway, DNS y en la opción 66 el servidor TFTP; por TFTP el teléfono baja su configuración; NTP sincroniza la hora (logs, CDR); DNS resuelve el servidor.<br><b>2. Registro:</b> SIP REGISTER al registrar; responde 401 con un desafío; se reenvía con credenciales y se recibe 200 OK.<br><b>3. Llamada:</b> INVITE con un cuerpo <b>SDP</b> que ofrece códecs, IP y puerto; 100 Trying, 180 Ringing y 200 OK con el SDP de respuesta; ACK.<br><b>4. Conversación:</b> <b>RTP</b> sobre UDP lleva el audio (secuencia, timestamp, SSRC) a los puertos que indicó el SDP; <b>RTCP</b> (puerto siguiente) envía reportes SR y RR con pérdidas y jitter.<br><b>5. Fin:</b> BYE y 200 OK.<br>SIP solo señaliza; SDP describe la sesión; RTP y RTCP transportan y controlan el audio, directo entre teléfonos o pasando por la PBX."},
openflow:{ex:"2º parcial 2015 · 9",q:"Describí un dispositivo de red construido acorde al estándar “OpenFlow Switch Specification”, indicando componentes básicos, escenario de implementación y forma de trabajo.",
 pts:["Tablas de flujo (y tabla de grupos)","Canal seguro (OpenFlow channel) hacia el controlador, sobre TCP/TLS","Protocolo OpenFlow","Entrada de flujo: campos de match, prioridad, contadores, instrucciones/acciones, timeouts","Escenario: controlador centralizado (SDN) que programa muchos switches","Funcionamiento: match por prioridad → acciones y contadores","Table-miss: packet-in al controlador, que instala flujos (flow-mod) o responde (packet-out)"],
 modelo:"Un switch OpenFlow separa el <b>plano de datos</b> (queda en el switch) del <b>plano de control</b> (pasa a un <b>controlador</b> externo). <b>Componentes:</b> una o más <b>tablas de flujo</b> (y una tabla de grupos), un <b>canal seguro</b> (OpenFlow channel, sobre TCP, opcionalmente TLS, puerto 6653) hacia el controlador, y el <b>protocolo OpenFlow</b> con el que el controlador agrega, modifica y borra entradas. Cada <b>entrada de flujo</b> tiene campos de coincidencia (puerto de entrada, MAC, VLAN, IP, puertos TCP/UDP…), prioridad, <b>contadores</b>, <b>instrucciones o acciones</b> (reenviar a un puerto, inundar, enviar al controlador, descartar, modificar campos) y timeouts.<br><b>Escenario:</b> una red SDN (campus, datacenter, laboratorio) donde un controlador como OpenDaylight, ONOS o Ryu tiene la vista global y programa muchos switches físicos o virtuales (Open vSwitch), con aplicaciones arriba por la API northbound.<br><b>Funcionamiento:</b> al llegar un paquete se busca la entrada de mayor prioridad que coincida; se ejecutan sus acciones y se actualizan los contadores. Si no hay coincidencia (<b>table-miss</b>), se envía al controlador (<b>packet-in</b>), que decide e instala un flujo (<b>flow-mod</b>) o devuelve el paquete (<b>packet-out</b>). Los flujos pueden instalarse de forma reactiva o proactiva."},
stp:{ex:"2º parcial 2015 · 10",q:"¿Cuál es el propósito del Spanning Tree Protocol (STP) en redes de área local conmutadas? ¿Qué inconvenientes resuelve? ¿Por qué actualmente se desaconseja su uso?",
 pts:["Propósito: permitir enlaces redundantes en capa 2 sin bucles","Construye un árbol: elige root bridge y bloquea puertos","Intercambio de BPDU","Resuelve: tormentas de broadcast","Resuelve: tramas duplicadas e inestabilidad de tablas MAC","Desaconsejado: convergencia lenta (30–50 s)","Desaconsejado: enlaces bloqueados que no se usan; un solo árbol","Alternativas: RSTP/MSTP, LACP, diseño en capa 3 o spine-leaf con ECMP"],
 modelo:"<b>Propósito:</b> STP (IEEE 802.1D) permite tener enlaces redundantes entre switches sin que se formen bucles en capa 2. Los switches intercambian <b>BPDU</b>, eligen un <b>root bridge</b> (menor bridge ID), calculan el camino de menor costo y <b>bloquean</b> los puertos que cerrarían un ciclo; si un enlace activo falla, desbloquean uno alternativo.<br><b>Inconvenientes que resuelve:</b> como Ethernet no tiene TTL, un bucle genera <b>tormentas de broadcast</b> que saturan la red, <b>tramas duplicadas</b> e <b>inestabilidad de las tablas MAC</b>.<br><b>Por qué se desaconseja:</b> converge lento (30 a 50 s con los temporizadores clásicos, durante los que no hay servicio), deja <b>enlaces bloqueados sin usar</b> (se desperdicia ancho de banda redundante), usa un solo árbol que puede dar caminos subóptimos y un error de configuración o un switch mal puesto como raíz afecta a toda la red. Hoy se usan RSTP (802.1w) o MSTP, agregación de enlaces (LACP, MLAG) y diseños en capa 3 o spine-leaf con ECMP, que aprovechan todos los enlaces."},
fcaps:{ex:"Final 2016 · 1 (tema del 1er parcial)",q:"¿Qué áreas temáticas propone la ISO para organizar la gestión de redes? Describí brevemente cada una.",
 pts:["Fallas (Fault)","Configuración (Configuration)","Contabilidad (Accounting)","Rendimiento (Performance)","Seguridad (Security)"],
 modelo:"El modelo <b>FCAPS</b> de ISO: <b>Fallas</b> (detectar, aislar, registrar y corregir problemas), <b>Configuración</b> (inventario, parámetros y control de cambios de los equipos), <b>Contabilidad</b> (medir el uso de recursos por usuario o área para cobrar o asignar cuotas), <b>Rendimiento</b> (medir y analizar desempeño: utilización, latencia, pérdidas, umbrales) y <b>Seguridad</b> (controlar el acceso a recursos, políticas, registros y protección)."},
snmp:{ex:"Final 2016 · 2 (tema del 1er parcial)",q:"¿Cuál es la arquitectura de monitoreo planteada por el protocolo SNMP?",
 pts:["Gestor (NMS / manager)","Agentes en los dispositivos","MIB con objetos identificados por OID (SMI)","Protocolo SNMP sobre UDP: 161 consultas, 162 traps","Operaciones get / set / traps (polling + notificaciones)"],
 modelo:"Modelo gestor-agente: una <b>estación de gestión</b> (manager/NMS) consulta y configura a los <b>agentes</b> que corren en cada dispositivo gestionado. Cada agente expone una <b>MIB</b>, base de información con objetos identificados por <b>OID</b> en un árbol jerárquico, definida con SMI. Se comunican con el <b>protocolo SNMP</b> sobre UDP: el gestor hace <b>polling</b> con get/getnext/getbulk y modifica con set (puerto 161), y los agentes envían notificaciones asincrónicas o <b>traps</b> (puerto 162). Puede haber proxies para equipos que no hablan SNMP."},
diseno:{ex:"Final 2016 · 3 (tema del 1er parcial)",q:"Durante el diseño e implementación de una red, además del requerimiento del usuario y los fundamentos teóricos del implementador, ¿qué conocimientos adicionales deben tenerse en cuenta?",
 pts:["Objetivos y restricciones del negocio (presupuesto, plazos, personal, políticas)","Requerimientos técnicos (escalabilidad, disponibilidad, rendimiento, seguridad, gestionabilidad)","Caracterización de la red existente","Análisis de flujos de tráfico","Tecnologías, productos y estándares disponibles"],
 modelo:"Siguiendo un enfoque top-down (Oppenheimer, McCabe): los <b>objetivos y restricciones del negocio</b> (presupuesto, plazos, personal disponible, políticas de la organización), los <b>requerimientos técnicos</b> (escalabilidad, disponibilidad, rendimiento, seguridad, gestionabilidad, usabilidad), la <b>red existente</b> (topología, equipos, cableado, rendimiento actual), los <b>flujos de tráfico</b> (quién habla con quién, cuánto y con qué requisitos) y las <b>tecnologías, productos y normas</b> disponibles en el mercado. <span class='note'>Es tema del primer parcial: contrastalo con tus apuntes.</span>"},
qos:{ex:"Final 2016 · 4",q:"Mencioná al menos 3 formas de dar soporte a los requerimientos de calidad de servicio, describiendo a qué nivel y cómo se implementan. ¿Son excluyentes?",
 pts:["Capa 2: prioridad 802.1p (PCP) en la etiqueta 802.1Q, VLAN de voz","Capa 3: DiffServ, marcado DSCP (EF, AF) y colas por clase en routers","IntServ / RSVP: reserva por flujo","Control de tráfico: shaping y policing con colas (tc, HTB, PRIO)","Otras: sobredimensionamiento, MPLS-TE","No son excluyentes: se combinan"],
 modelo:"<b>1. Capa 2 – 802.1p:</b> el campo de prioridad (PCP, 3 bits) de la etiqueta 802.1Q marca las tramas (voz = 5) y los switches las atienden en colas prioritarias; suele combinarse con una VLAN de voz. <b>2. Capa 3 – DiffServ:</b> se marca el campo <b>DSCP</b> del encabezado IP en el borde (voz = EF 46) y cada router aplica un comportamiento por salto (colas de prioridad, ancho de banda garantizado por clase). <b>3. IntServ / RSVP:</b> la aplicación reserva recursos por flujo a lo largo del camino; garantiza, pero escala mal. <b>4. Control de tráfico en el equipo:</b> con disciplinas de cola (en Linux, <code>tc</code> con HTB o PRIO) se clasifica, prioriza, limita (<b>shaping</b>, que retrasa) o descarta (<b>policing</b>) tráfico. También sobredimensionar enlaces o MPLS-TE. <b>No son excluyentes:</b> se combinan; por ejemplo, el teléfono marca 802.1p, el switch lo traduce a DSCP y el router de borde aplica colas y shaping con tc."},
vlanvpn:{ex:"Final 2016 · 6",q:"¿Cuál es la diferencia entre VLANs y VPNs?",
 pts:["VLAN: segmenta lógicamente una LAN en capa 2 (802.1Q, hasta 4094)","VLAN: separa dominios de broadcast dentro de la infraestructura propia","VLAN: no cifra","VPN: extiende una red privada sobre una red pública con túneles","VPN: cifrado, autenticación e integridad (IPsec, OpenVPN, WireGuard)","Se pueden combinar"],
 modelo:"Una <b>VLAN</b> divide lógicamente una LAN física en varias redes de capa 2: cada trama lleva una etiqueta <b>802.1Q</b> (VLAN ID de 12 bits, hasta 4094) y los switches separan los <b>dominios de broadcast</b>. Funciona dentro de la infraestructura propia, sirve para segmentar (voz, datos, administración) y <b>no cifra</b>; para comunicar VLAN entre sí hace falta un router. Una <b>VPN</b> crea una red privada <b>sobre una red pública</b> (Internet) mediante <b>túneles</b>, con cifrado, autenticación e integridad (IPsec, OpenVPN, WireGuard), para unir sucursales o usuarios remotos, en capa 2 o 3. En resumen: la VLAN segmenta localmente, la VPN extiende de forma segura a distancia; pueden combinarse."},
firma:{ex:"Final 2016 · 7",q:"Describí y esquematizá el procedimiento para implementar firmas digitales.",
 pts:["Emisor calcula el hash del mensaje","Cifra el hash con su clave privada → firma","Envía mensaje + firma (+ certificado)","Receptor descifra la firma con la pública del emisor","Calcula el hash del mensaje recibido y compara","Servicios: integridad, autenticación, no repudio (no confidencialidad)","La pública debe estar autenticada (certificado X.509 / PKI o red de confianza)"],
 modelo:"<pre><code>EMISOR (A)                                 RECEPTOR (B)\nmensaje ──► H() ──► hash                    mensaje ──► H() ──► hash'\n                     │                                            │\n          cifrar con privada de A                                 ▼\n                     ▼                             ¿hash' == hash ?\n                   firma ──── mensaje + firma ──► descifrar firma con\n                                                    pública de A ──► hash</code></pre>A calcula el hash del mensaje (SHA-256) y lo cifra con <b>su clave privada</b>: eso es la firma. Envía el mensaje con la firma (y normalmente su certificado). B descifra la firma con la <b>clave pública de A</b>, calcula el hash del mensaje recibido y compara: si coinciden, el mensaje no fue modificado y lo firmó quien tiene la privada de A. Da <b>integridad, autenticación y no repudio</b>, no confidencialidad. Para confiar en la pública de A hace falta un <b>certificado X.509</b> firmado por una CA (PKI) o la red de confianza de PGP. Se firma el hash y no el mensaje porque el asimétrico es lento."},
virtobj:{ex:"Final 2016 · 8",q:"¿Cuáles son los objetivos posibles por los que se implementan técnicas de virtualización? ¿Cómo se logran?",
 pts:["Consolidación y mejor aprovechamiento del hardware","Aislamiento y seguridad entre servicios","Alta disponibilidad: migración en vivo, snapshots, recuperación","Independencia del hardware y portabilidad (incluye SO legacy)","Pruebas y desarrollo; aprovisionamiento rápido","Ahorro de energía y espacio","Cómo: hipervisores tipo I/II, virtualización completa, paravirtualización, asistida por hardware, contenedores","Virtualización de red y almacenamiento"],
 modelo:"<b>Objetivos:</b> consolidar servidores y aprovechar mejor el hardware (menos equipos, menos energía y espacio); aislar servicios entre sí (seguridad, fallas contenidas); alta disponibilidad y recuperación ante desastres (migración en vivo, snapshots, reinicio en otro host); independencia del hardware y portabilidad (mover una VM, mantener SO viejos); entornos de prueba y desarrollo; aprovisionamiento rápido y elasticidad (base de la nube).<br><b>Cómo:</b> con un hipervisor o VMM que reparte el hardware entre máquinas virtuales: tipo I sobre el hardware o tipo II sobre un SO; con <b>virtualización completa</b> (traducción binaria), <b>paravirtualización</b> (SO invitado modificado) o <b>asistida por hardware</b> (Intel VT-x, AMD-V); con <b>contenedores</b> que comparten el kernel (namespaces, cgroups); y extendiendo la idea a la red (VLAN, VXLAN, switches virtuales, SDN, NFV) y al almacenamiento."}
};

addSec("resiliencia",{h:"STP: propósito, problemas y por qué se desaconseja",b:`<p class="tag warn">Salió en el 2º parcial 2015</p>
<p><b>STP (Spanning Tree Protocol, IEEE 802.1D)</b> permite tener <b>enlaces redundantes en capa 2</b> sin que se formen bucles.</p>
<ol><li>Los switches intercambian <b>BPDU</b> (Bridge Protocol Data Units).</li>
<li>Eligen un <b>root bridge</b>: el de menor <b>bridge ID</b> (prioridad + MAC).</li>
<li>Cada switch elige su <b>root port</b> (camino de menor costo a la raíz) y en cada segmento se elige un <b>designated port</b>.</li>
<li>Los demás puertos quedan <b>bloqueados</b>. Si un enlace activo falla, se recalcula y se habilita uno bloqueado.</li></ol>
<div class="tbl"><table><tr><th>Problema sin STP (Ethernet no tiene TTL)</th><th>Qué pasa</th></tr>
<tr><td>Tormenta de broadcast</td><td>Los broadcast circulan para siempre y saturan la red</td></tr>
<tr><td>Tramas duplicadas</td><td>El destino recibe copias de la misma trama</td></tr>
<tr><td>Inestabilidad de la tabla MAC</td><td>El switch ve la misma MAC por distintos puertos y la tabla cambia sin parar</td></tr></table></div>
<div class="key"><b>Por qué se desaconseja hoy:</b> convergencia lenta (30 a 50 s con los temporizadores clásicos: max age 20 s + 2 × forward delay 15 s); enlaces bloqueados que no se usan (ancho de banda desperdiciado); un solo árbol con caminos subóptimos; un error (por ejemplo, un switch que se vuelve raíz) afecta a toda la red. <b>Alternativas:</b> RSTP (802.1w, converge en segundos), MSTP (un árbol por grupo de VLAN), agregación de enlaces (LACP, MLAG) y diseños en capa 3 o spine-leaf con ECMP.</div>`,
mcq:[{q:"¿Qué problema resuelve STP?",o:["La falta de direcciones IP","Los bucles en capa 2 con enlaces redundantes","El cifrado de tramas","La congestión en capa 4"],a:1,e:"Tormentas de broadcast, tramas duplicadas e inestabilidad de la tabla MAC."},
{q:"El root bridge de STP es el switch con:",o:["Más puertos","Mayor MAC","Menor bridge ID","Más tráfico"],a:2,e:"Bridge ID = prioridad + MAC."},
{q:"¿Por qué se desaconseja STP clásico?",o:["Porque cifra mal","Porque converge lento y deja enlaces bloqueados sin usar","Porque no funciona con VLAN","Porque usa UDP"],a:1,e:""}],
vf:[["Sin STP, un bucle en capa 2 puede generar una tormenta de broadcast porque Ethernet no tiene TTL.",true,""]],
fill:[{q:"Mensajes que intercambian los switches en STP (sigla)",a:["bpdu","bpdus"],e:"BPDU."}],
dev:[PD.stp]});

addSec("voip",{h:"Parámetros fundamentales de un códec",b:`<p class="tag warn">Salió en el 2º parcial 2015</p>
<div class="tbl"><table><tr><th>Parámetro</th><th>Qué es</th><th>Relación con Internet</th></tr>
<tr><td>Frecuencia de muestreo</td><td>Muestras por segundo; Nyquist: ≥ 2 × fmax. 8 kHz para voz, 16 kHz en banda ancha</td><td>Más frecuencia, más calidad y más bits</td></tr>
<tr><td>Resolución</td><td>Bits por muestra (8, 16…)</td><td>Más bits, más fidelidad y más ancho de banda</td></tr>
<tr><td>Tasa de bits (bitrate)</td><td>kbps resultantes tras comprimir (G.711 64, G.729 8, Opus 6–510)</td><td>Con ancho de banda limitado o variable conviene bajo o adaptativo</td></tr>
<tr><td>Tamaño de trama / paquetización</td><td>Cuánta voz va en cada paquete (10, 20, 30 ms)</td><td>Trama chica: menos latencia, más overhead (62 B por paquete). Grande: menos overhead, más latencia y más audio perdido por paquete</td></tr>
<tr><td>Retardo algorítmico</td><td>Tiempo que el códec necesita para procesar (incluye lookahead)</td><td>Suma a la latencia total; para voz interactiva conviene &lt; 150 ms en un sentido</td></tr>
<tr><td>Complejidad</td><td>CPU necesaria para codificar y decodificar</td><td>Afecta la transcodificación en la central y los dispositivos chicos</td></tr>
<tr><td>Calidad (MOS)</td><td>Calidad percibida, de 1 a 5</td><td>Baja con compresión fuerte, pérdidas y jitter</td></tr>
<tr><td>Robustez ante pérdidas</td><td>Ocultamiento de pérdidas (PLC), corrección de errores (FEC)</td><td>Internet pierde paquetes: iLBC y Opus están diseñados para eso</td></tr></table></div>
<div class="key">En una red no fiable hay ancho de banda variable, latencia, jitter y pérdidas. Se elige un códec que equilibre bitrate, retardo y robustez (Opus es adaptativo), se usa <b>jitter buffer</b> en el receptor y se aplica <b>QoS</b> donde la red lo permita. Más compresión = menos ancho de banda, pero más CPU, más retardo y menos calidad.</div>`,
mcq:[{q:"¿Cuál de estos NO es un parámetro de un códec?",o:["Frecuencia de muestreo","Tasa de bits","Tamaño de trama","Número de puerto SIP"],a:3,e:""},
{q:"En una red con muchas pérdidas conviene un códec:",o:["Sin compresión y tramas largas","Robusto ante pérdidas, con PLC o FEC","Con el mayor retardo algorítmico posible","Que no use RTP"],a:1,e:"iLBC y Opus son buenos ejemplos."},
{q:"Más compresión en un códec implica en general:",o:["Más ancho de banda","Menos CPU","Menos ancho de banda pero más CPU y retardo","Mejor calidad siempre"],a:2,e:""}],
vf:[["Tramas de voz más grandes reducen el overhead pero aumentan la latencia.",true,""]],
dev:[PD.codec,PD.sipproto]});

addSec("netfilter",{h:"Formas de dar soporte a la QoS (final 2016)",b:`<p class="tag warn">Salió en el final 2016</p>
<div class="tbl"><table><tr><th>Forma</th><th>Nivel</th><th>Cómo se implementa</th></tr>
<tr><td>802.1p</td><td>Enlace (capa 2)</td><td>Campo PCP (3 bits) de la etiqueta 802.1Q; los switches atienden por prioridad (voz = 5). Suele ir con una VLAN de voz</td></tr>
<tr><td>DiffServ</td><td>Red (capa 3)</td><td>Se marca DSCP en el borde (voz = EF 46) y cada router aplica colas por clase</td></tr>
<tr><td>IntServ / RSVP</td><td>Red, por flujo</td><td>Reserva de recursos a lo largo del camino; garantiza pero escala mal</td></tr>
<tr><td>Control de tráfico (tc)</td><td>En cada equipo</td><td>Qdisc: clasificar, priorizar (PRIO, HTB), shaping (retrasa) y policing (descarta)</td></tr>
<tr><td>Sobredimensionar / MPLS-TE</td><td>Diseño / proveedor</td><td>Más capacidad de la necesaria o ingeniería de tráfico</td></tr></table></div>
<div class="key"><b>¿Son excluyentes?</b> No: se combinan. Ejemplo: el teléfono marca 802.1p, el switch lo mapea a DSCP y el router de borde aplica colas y shaping con tc.</div>`,

<p>Practicá dibujarlo de memoria: <b>dos hashes</b>, <b>privada del emisor</b> para firmar, <b>pública del emisor</b> para verificar y la <b>comparación</b> al final. Agregá que la pública debe estar respaldada por un certificado X.509 (PKI) o por la red de confianza de PGP.</p>`,

addSec("sdn",{h:"Popek y Goldberg: cuándo se puede virtualizar",b:`<p class="tag warn">Salió en el 2º parcial 2015</p>
<p>Popek y Goldberg (1974) definieron formalmente cuándo una arquitectura permite construir un <b>Monitor de Máquina Virtual (VMM)</b>.</p>
<ul><li><b>Instrucciones privilegiadas:</b> generan una <b>trampa</b> si se ejecutan en modo usuario.</li>
<li><b>Instrucciones sensibles:</b> leen o modifican el estado privilegiado de la máquina (configuración de memoria, interrupciones, modo) o se comportan distinto según él.</li></ul>
<div class="key"><b>Propiedad:</b> se puede construir un VMM si el conjunto de instrucciones <b>sensibles es un subconjunto de las privilegiadas</b>. Entonces el SO invitado corre en modo usuario y cada instrucción sensible genera una trampa que el VMM <b>atrapa y emula</b> (trap-and-emulate).</div>
<p><b>Propiedades que debe cumplir el VMM:</b> <b>equivalencia o fidelidad</b> (el programa se comporta igual que en la máquina real), <b>control de recursos o seguridad</b> (el VMM controla todo el hardware) y <b>eficiencia</b> (la mayoría de las instrucciones corren directo en la CPU).</p>
<p><b>Arquitecturas que no la cumplían (x86):</b> tenían instrucciones sensibles no privilegiadas (por ejemplo POPF o SGDT) que no generaban trampa. Soluciones:</p>
<div class="tbl"><table><tr><th>Técnica</th><th>Cómo</th><th>Ejemplo</th></tr>
<tr><td>Traducción binaria</td><td>Reescribe al vuelo el código del kernel invitado y reemplaza las instrucciones problemáticas</td><td>VMware (virtualización completa)</td></tr>
<tr><td>Paravirtualización</td><td>Se modifica el SO invitado para que llame al hipervisor con <b>hypercalls</b></td><td>Xen</td></tr>
<tr><td>Asistida por hardware</td><td>La CPU agrega un modo para el hipervisor y hace que esas instrucciones generen trampa</td><td>Intel VT-x, AMD-V (KVM)</td></tr></table></div>`,
mcq:[{q:"Según Popek y Goldberg, se puede construir un VMM si:",o:["Las instrucciones privilegiadas son subconjunto de las sensibles","Las instrucciones sensibles son subconjunto de las privilegiadas","No hay instrucciones privilegiadas","La CPU tiene más de un núcleo"],a:1,e:"Así toda instrucción sensible genera trampa."},
{q:"La paravirtualización:",o:["No modifica el SO invitado","Modifica el SO invitado para usar hypercalls","Requiere Intel VT-x","Es lo mismo que un contenedor"],a:1,e:"Xen."},
{q:"¿Qué técnica usó VMware para virtualizar x86 sin soporte de hardware?",o:["Paravirtualización","Traducción binaria","Contenedores","RSTP"],a:1,e:""},
{q:"¿Cuál NO es una propiedad del VMM según Popek y Goldberg?",o:["Equivalencia","Control de recursos","Eficiencia","Compresión"],a:3,e:""}],
fill:[{q:"Técnica en que el VMM atrapa cada instrucción sensible y la emula (en inglés)",a:["trap and emulate","trap-and-emulate"],e:"Trap-and-emulate."}],
dev:[PD.popek,PD.virtobj]});

addSec("sdn",{h:"Tiers de datacenter: II vs III",b:`<p class="tag warn">Salió en el 2º parcial 2015</p>
<div class="tbl"><table><tr><th>Tier</th><th>Nombre</th><th>Requerimientos funcionales</th><th>Disponibilidad</th></tr>
<tr><td>I</td><td>Infraestructura básica</td><td>Sin redundancia; un solo camino; mantenimiento con apagado</td><td>99,671 % (≈ 28,8 h/año)</td></tr>
<tr><td>II</td><td>Componentes redundantes</td><td>Componentes de capacidad N+1 (UPS, generador, frío), pero <b>un solo camino</b> de distribución; mantener ese camino obliga a apagar</td><td>99,741 % (≈ 22 h/año)</td></tr>
<tr><td>III</td><td>Mantenible concurrentemente</td><td>N+1 y <b>múltiples caminos</b> de distribución (uno activo); cualquier componente o camino se mantiene <b>sin detener</b> la operación; equipos IT con doble fuente</td><td>99,982 % (≈ 1,6 h/año)</td></tr>
<tr><td>IV</td><td>Tolerante a fallas</td><td>Caminos activos simultáneos, componentes 2N o 2N+1, compartimentación; soporta una falla sin impacto</td><td>99,995 % (≈ 26 min/año)</td></tr></table></div>
<div class="key">La diferencia clave entre II y III: el II tiene redundancia de componentes pero un único camino; el III tiene también caminos redundantes y se puede <b>mantener sin cortar</b>.</div>`,
mcq:[{q:"La característica que distingue a un Tier III de un Tier II es:",o:["Tener UPS","Ser mantenible concurrentemente con múltiples caminos de distribución","Tener aire acondicionado","Usar SDN"],a:1,e:""},
{q:"Un Tier II tiene:",o:["Caminos activos simultáneos","Componentes redundantes pero un solo camino de distribución","Ninguna redundancia","Tolerancia a fallas"],a:1,e:""}],
dev:[PD.tiers]});

addSec("sdn",{h:"El switch OpenFlow",b:`<p class="tag warn">Salió en el 2º parcial 2015</p>
<pre><code>          Controlador (OpenDaylight, ONOS, Ryu)
                    ▲  protocolo OpenFlow
                    │  canal seguro (TCP / TLS, puerto 6653)
   ┌────────────────┴─────────────────┐
   │  Switch OpenFlow                 │
   │   Tabla de flujos 0 → 1 → … → n  │
   │   Tabla de grupos                │
   └──────────────────────────────────┘</code></pre>
<p><b>Componentes:</b> una o más <b>tablas de flujo</b> (y una de grupos), el <b>canal seguro</b> (OpenFlow channel) hacia el controlador y el <b>protocolo OpenFlow</b>.</p>
<div class="tbl"><table><tr><th>Campo de una entrada de flujo</th><th>Para qué</th></tr>
<tr><td>Match fields</td><td>Puerto de entrada, MAC, VLAN, IP origen/destino, protocolo, puertos TCP/UDP…</td></tr>
<tr><td>Priority</td><td>Qué entrada gana si varias coinciden</td></tr>
<tr><td>Counters</td><td>Paquetes y bytes que coincidieron</td></tr>
<tr><td>Instructions / actions</td><td>Reenviar a un puerto, inundar, enviar al controlador, descartar, modificar campos, ir a otra tabla</td></tr>
<tr><td>Timeouts</td><td>Idle y hard: cuándo se borra la entrada</td></tr></table></div>
<p><b>Forma de trabajo:</b> llega un paquete → se busca la entrada de mayor prioridad que coincida → se aplican sus acciones y se actualizan los contadores. Si no coincide ninguna (<b>table-miss</b>), se envía al controlador (<b>packet-in</b>); este decide e instala un flujo (<b>flow-mod</b>) o devuelve el paquete (<b>packet-out</b>). Instalación <b>reactiva</b> (al llegar el primer paquete) o <b>proactiva</b> (de antemano).</p>
<p><b>Escenario:</b> red SDN de campus, datacenter o laboratorio con un controlador centralizado y switches físicos o virtuales (Open vSwitch).</p>`,
mcq:[{q:"Cuando un paquete no coincide con ninguna entrada de flujo:",o:["Siempre se descarta","Se envía al controlador (packet-in) o según la regla de table-miss","Se inunda siempre","Se reinicia el switch"],a:1,e:""},
{q:"El mensaje con el que el controlador instala una entrada de flujo es:",o:["packet-in","flow-mod","BPDU","hello"],a:1,e:""},
{q:"¿Cuál NO es un componente de un switch OpenFlow?",o:["Tabla de flujos","Canal seguro","Protocolo OpenFlow","Root bridge"],a:3,e:"El root bridge es de STP."}],
order:[{t:"Ordená el procesamiento en un switch OpenFlow cuando el flujo es nuevo",items:["Llega el paquete al switch","No coincide con ninguna entrada (table-miss)","El switch envía packet-in al controlador","El controlador decide","El controlador envía flow-mod","Los siguientes paquetes coinciden y se reenvían en el switch"]}],
dev:[PD.openflow]});
