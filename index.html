["¿Cuál es la diferencia entre distribución de carga (load sharing) y balanceo de carga (load balance)? Dé un ejemplo de cada uno.","Ambos reparten el trabajo entre dos o más elementos; el balanceo lo hace de forma eficiente. Round-robin DNS es distribución: reparte sin saber la carga ni si el servidor está vivo. Nginx con least_conn y detección de fallas es balanceo: envía al menos cargado y saca a los caídos."],
["Diseñe una solución resiliente para un servicio web crítico. Indique qué SPoF elimina cada elemento.","Varios servidores web réplica (elimina el servidor como SPoF) detrás de un balanceador (Nginx/HAProxy); dos balanceadores con IP virtual por VRRP/CARP (elimina el balanceador); servidor de estado o sesiones compartidas para que las réplicas sean intercambiables; base de datos maestro/slave o maestro/maestro; dos enlaces a Internet o dos ISP con BGP, o MPTCP del lado del cliente; switches redundantes con LACP; UPS y generador; DNS con varios servidores; y documentación más de un administrador capacitado (capa Usuario)."],
["Compare los patrones maestro + hot spare y maestro/esclavos.","En los dos hay un nodo de reemplazo con los datos sincronizados. En hot spare el cambio requiere acción humana; en maestro/esclavos es automático, porque un heartbeat detecta la caída del maestro. Hot spare es más simple; maestro/esclavos recupera más rápido pero exige más configuración y monitoreo. En ambos el reemplazo es un recurso ocioso."],
["¿Qué problema introduce el estado en el patrón balanceador/réplicas y cómo se resuelve?","Si un usuario inició sesión en una réplica y la siguiente petición va a otra, esta no conoce la sesión. Se resuelve con persistencia (ip_hash: siempre a la misma réplica, pero si cae se pierde la sesión) o, mejor, con un servidor de estado compartido (sesiones o cookies en una base común), que deja a las réplicas intercambiables."],
["¿Por qué en el failover de CARP se pierden las conexiones TCP? ¿En qué caso no ocurre?","Porque el nodo que asume la IP virtual no tiene el estado de las conexiones (números de secuencia, sockets, sesiones). No ocurre si el nodo es un router que solo reenvía, sin NAT ni firewall con estado, o si se sincroniza el estado (conntrackd, pfsync)."],
["¿Cómo funciona una CDN y qué aporta a la resiliencia?","Replica el contenido en servidores de borde (edge cache) distribuidos; con anycast o DNS geográfico, el usuario llega al más cercano. Aporta disponibilidad (si cae un nodo responde otro), menor latencia, menos carga sobre el servidor de origen y absorción de picos y ataques DDoS."],
["Calcule la disponibilidad de un servicio con un balanceador de 99,9 % y dos servidores en paralelo de 99 % cada uno.","Servidores en paralelo: 1 − 0,01 × 0,01 = 0,9999. En serie con el balanceador: 0,999 × 0,9999 ≈ 0,9989, es decir 99,89 %. El balanceador limita la disponibilidad: hay que duplicarlo."]
],
voip:[
["¿Por qué se dice que SIP solo señaliza? ¿Por dónde viaja el audio?","SIP establece, modifica y termina la sesión, pero no lleva la voz. La voz viaja en RTP sobre UDP, a la IP y puerto acordados en el SDP, directo entre teléfonos o pasando por la central."],
["Compare SIP y H.323.","Los dos son protocolos de señalización. SIP es del IETF, texto plano parecido a HTTP, simple y extensible, puerto 5060. H.323 es una familia de la ITU-T, binaria (ASN.1), más vieja y compleja, con varios subprotocolos (H.225 en TCP 1720, H.245). Hoy predomina SIP."],
["¿Qué información transporta RTP que UDP no da, y para qué sirve RTCP?","RTP agrega tipo de carga (códec), número de secuencia (para detectar pérdidas y desorden), timestamp (para reproducir en el momento justo y medir jitter) y SSRC (identificar la fuente). RTCP envía reportes periódicos (SR del emisor, RR del receptor con pérdidas y jitter) para monitorear la calidad y adaptar la codificación."],
["¿Qué es la transcodificación y qué consecuencias tiene?","Convertir el audio de un códec a otro cuando los extremos no comparten ninguno. La hace la central: consume CPU (mucho más con códecs comprimidos como G.729 u Opus), agrega retardo y puede bajar la calidad. Obliga a que el audio pase por la central."],
["¿Qué factores de la red afectan la calidad de una llamada y cómo se mitigan?","Latencia (conviene menos de 150 ms en un sentido), jitter y pérdida de paquetes. Se mitigan con QoS (802.1p, DSCP EF), jitter buffer, códecs robustos ante pérdidas (Opus, iLBC), paquetización adecuada y suficiente ancho de banda."],
["Explique qué es una PBX y qué rol cumple en una red VoIP con SIP.","Es una central telefónica privada que conecta los internos entre sí y con la red pública. En VoIP (Asterisk, Issabel) actúa como registrar, proxy y back-to-back user agent; además da funciones de central: correo de voz, colas, transferencias, grabación y transcodificación."],
["¿Por qué es importante NTP en una red VoIP?","Para que todos los equipos tengan la misma hora: registros de llamadas (CDR) y logs coherentes para facturación y diagnóstico, y validez de certificados si se usa TLS/SRTP."]
],
seg1:[
["Explique la arquitectura de seguridad OSI (X.800): elementos y relación entre ellos.","Tres elementos: ataques (acciones que comprometen la seguridad, pasivos o activos), mecanismos (procesos o dispositivos que detectan, previenen o recuperan: cifrado, firma digital, control de acceso, integridad, intercambio de autenticación, relleno de tráfico, control de ruteo, notarización) y servicios (lo que se ofrece: confidencialidad, integridad, disponibilidad, autenticación, no repudio, control de acceso). Los servicios se implementan con uno o más mecanismos para contrarrestar los ataques."],
["Compare ataques pasivos y activos. ¿Cómo se combate cada uno?","Pasivos: solo observan (lectura, análisis de tráfico), no alteran nada y son difíciles de detectar; se combaten con prevención, sobre todo cifrado. Activos: modifican, suplantan, reenvían o interrumpen; son más fáciles de detectar, pero difíciles de evitar del todo; se combaten con detección (IDS) y recuperación (backups, redundancia)."],
["Describa las cuatro políticas de un firewall. ¿Cuál recomendaría y por qué?","Paranoica (todo prohibido, aun lo necesario), prudente (todo prohibido salvo lo permitido explícitamente), permisiva (todo permitido salvo lo prohibido) y promiscua (todo permitido). Se recomienda prudente: aplica fallar en forma segura y menor privilegio; lo que no se previó queda bloqueado."],
["Diseñe una red con DMZ para una empresa con servidor web, correo y una LAN interna. Indique qué tráfico permitiría.","Firewall con tres patas (o dos firewalls): Internet, DMZ y LAN. En la DMZ, web (80/443), correo (25 entrante, 587/993 para usuarios) y DNS público. Desde Internet: solo hacia los servicios publicados de la DMZ. Desde la LAN: salida a Internet y acceso a la DMZ. Desde la DMZ hacia la LAN: nada (o solo lo estrictamente necesario). Política por defecto DROP y filtrado con estado."],
["Compare la detección por firmas y por anomalías en un IDS.","Por firmas: compara con patrones de ataques conocidos; pocas falsas alarmas, pero no detecta ataques nuevos (día cero). Por anomalías: aprende el comportamiento normal (volumen, picos, protocolos) y alerta ante desvíos; puede detectar ataques nuevos, pero genera más falsos positivos y requiere entrenamiento."],
["Explique tres estrategias de seguridad de Zwicky con un ejemplo de cada una.","Menor privilegio: un usuario de ventas no tiene acceso de administrador. Defensa en profundidad: firewall de borde, firewall en cada host, antivirus, cifrado y políticas. Choke point: todo el tráfico con Internet pasa por un único firewall donde se controla y registra. (Otras: eslabón más débil, fallar en forma segura, diversidad, simplicidad, transparencia)."],
["¿Qué ventajas y desventajas tiene un UTM?","Ventajas: administración centralizada, una sola consola, menor costo y espacio, ideal para pymes. Desventajas: es un punto único de falla, puede ser cuello de botella de rendimiento, depende de un solo proveedor (contra la diversidad de defensa) y si se compromete cae toda la protección."]
],
netfilter:[
["Explique el recorrido de un paquete por netfilter en los tres casos posibles.","Destinado al equipo: PREROUTING → decisión de ruteo → INPUT → aplicación. Generado por el equipo: OUTPUT → decisión de ruteo → POSTROUTING → interfaz. En tránsito (el equipo es router): PREROUTING → decisión de ruteo → FORWARD → POSTROUTING. DNAT se hace en PREROUTING y SNAT/masquerade en POSTROUTING."],
["Escriba las reglas nft para un router que permita a la LAN 192.168.1.0/24 navegar por web y bloquee todo lo demás.","nft add table inet fw; nft add chain inet fw forward '{ type filter hook forward priority 0; policy drop; }'; nft add rule inet fw forward ct state established,related accept; nft add rule inet fw forward ip saddr 192.168.1.0/24 tcp dport { 80, 443 } ct state new accept; nft add rule inet fw forward ip saddr 192.168.1.0/24 udp dport 53 accept. Si la LAN usa IP privadas, además masquerade en postrouting hacia la interfaz de Internet."],
["Compare filtrado sin estado y con estado. Ventajas y desventajas.","Sin estado: decide paquete por paquete con encabezados; es simple y rápido, pero necesita reglas de ida y vuelta y abre huecos (cualquier paquete con puerto origen 80 pasa). Con estado: usa connection tracking y permite solo respuestas de conexiones iniciadas desde adentro; es más seguro y simple de escribir, pero consume memoria por conexión y es vulnerable a llenar la tabla de estados."],
["¿Qué diferencia hay entre drop y reject? ¿Cuándo usaría cada uno?","Drop descarta en silencio: el emisor espera hasta el timeout y no sabe si hay firewall; conviene hacia Internet (no da información y hace más lentos los escaneos). Reject descarta y avisa con ICMP o TCP RST: el cliente se entera enseguida; conviene en la red interna para que los usuarios no queden esperando."],
["¿Qué es NAT, qué tipos hay y en qué hook se aplica cada uno?","Traducción de direcciones. SNAT cambia el origen (salir con la IP pública; masquerade usa la IP de la interfaz) y va en POSTROUTING. DNAT cambia el destino (publicar un servidor interno o redirigir un puerto) y va en PREROUTING. NAPT traduce también puertos para que muchos hosts compartan una IP."],
["Explique la diferencia entre policing y shaping, y entre qdisc con y sin clases.","Policing descarta el tráfico que excede la tasa; shaping lo retrasa encolándolo. Las qdisc sin clases (PFIFO, TBF, RED, SFQ, NETEM) aplican una política única a toda la interfaz; las con clases (HTB, PRIO, DRR, QFQ) dividen el tráfico en clases con filtros y aplican a cada una su política."]
],
cripto:[
["Compare cifrados por bloque y por flujo. Dé ejemplos.","Por bloque: procesan bloques de tamaño fijo y dan un bloque de salida por cada uno (AES, 3DES, Blowfish, Twofish, Camellia); necesitan modos de operación. Por flujo: procesan elemento a elemento combinando con una secuencia pseudoaleatoria (RC4, Salsa20, ChaCha20, A5/1); son rápidos y útiles para datos que llegan de a poco."],
["Compare hash, MAC y firma digital: qué servicios da cada uno y qué clave usan.","Hash: sin clave; detecta cambios, pero un atacante puede recalcularlo. MAC/HMAC: clave secreta compartida; da integridad y autenticación, sin no repudio. Firma digital: privada del emisor para firmar y pública para verificar; da integridad, autenticación y no repudio."],
["¿Por qué en la práctica se combinan criptografía simétrica y asimétrica? Explique el esquema.","La simétrica es rápida pero necesita compartir la clave; la asimétrica resuelve la distribución pero es lenta. Esquema híbrido: se genera una clave de sesión simétrica aleatoria, se cifran los datos con ella (AES) y la clave de sesión se cifra con la pública del destinatario o se acuerda con Diffie-Hellman. Lo usan PGP, TLS y las VPN."],
["¿Qué es Diffie-Hellman? ¿Qué servicio da y qué ataque sufre?","Un método para que dos partes acuerden una clave secreta por un canal público sin enviarla. No cifra ni autentica por sí solo. Sin autenticación es vulnerable al hombre en el medio, por eso se firma con certificados (como en TLS con ECDHE_RSA). Con claves efímeras da secreto hacia adelante."],
["¿Qué es la criptografía poscuántica y por qué se usan esquemas híbridos?","Algoritmos que resisten ataques de computadoras cuánticas, que podrían romper RSA y curvas elípticas: ML-KEM (Kyber) para claves y ML-DSA (Dilithium) y SLH-DSA (SPHINCS+) para firmas. Los híbridos (X25519MLKEM768) combinan uno clásico y uno poscuántico: si uno resulta débil, el otro sigue protegiendo."],
["Explique los ataques contra un cifrado y el principio de Kerckhoffs.","Criptoanálisis (aprovechar la estructura del algoritmo con texto cifrado, texto plano conocido o elegido) y fuerza bruta (probar todas las claves). Kerckhoffs: el sistema debe ser seguro aunque el algoritmo sea público; solo la clave es secreta. Por eso no se confía en la seguridad por oscuridad."]
],
tls:[
["Explique qué es un certificado X.509, sus campos principales y cómo se valida.","Documento firmado por una CA que vincula una clave pública con una identidad. Campos: versión, número de serie, algoritmo de firma, emisor, validez (desde/hasta), sujeto, clave pública del sujeto, extensiones (SAN, usos de clave, restricciones básicas, CRL/OCSP) y la firma de la CA. Se valida: firma correcta con la pública de la CA, cadena hasta una raíz de confianza, vigencia, nombre en el SAN y que no esté revocado."],
["Describa una PKI: componentes y cadena de confianza.","CA raíz (autofirmada, preinstalada en navegadores y SO), CA intermedias (firmadas por la raíz), autoridades de registro (verifican identidades), certificados de entidad final, y mecanismos de revocación (CRL, OCSP). El cliente confía en el certificado del sitio porque encadena firmas hasta una raíz que ya conoce."],
["Compare OpenPGP y S/MIME.","Los dos firman y cifran correo con esquema híbrido. OpenPGP (RFC 4880) usa una red de confianza en la que los usuarios se firman las claves y no necesita CA. S/MIME (RFC 5751) usa certificados X.509 emitidos por una CA y mensajes PKCS#7, y está integrado en clientes corporativos."],
["¿Qué cambió entre TLS 1.2 y TLS 1.3?","1.3 reduce el handshake a un viaje de ida y vuelta (y 0-RTT con PSK), elimina Change Cipher Spec, la compresión y los algoritmos débiles (RSA para intercambio de claves, CBC, RC4, SHA-1), exige secreto hacia adelante con (EC)DHE, usa solo cifrados AEAD y cifra el certificado del servidor."],
["¿Por qué un navegador rechaza un certificado autofirmado y cómo se puede usar igual de forma segura?","Porque nadie de confianza lo firmó: no hay forma de verificar que la clave sea del sitio. Se puede usar si se instala ese certificado (o la CA interna que lo emitió) como de confianza en los clientes, o verificando su huella por un canal seguro. Es común en laboratorios, redes internas y equipos de red."],
["Explique el port forwarding de SSH con un ejemplo de uso.","Local (-L): un puerto de mi máquina lleva, a través del servidor SSH, a un destino del otro lado. Ej.: ssh -L 8080:intranet:80 gw para ver la intranet desde casa en localhost:8080. Remoto (-R): un puerto del servidor lleva a un destino de mi lado. Ej.: ssh -R 8080:localhost:80 servidor para publicar temporalmente mi web local."]
],
vpn:[
["Compare las VPN de acceso remoto, intranet y extranet.","Acceso remoto: usuarios individuales (teletrabajo) se conectan a la red corporativa. Intranet: sitio a sitio entre sucursales de la misma organización. Extranet: conecta la organización con socios, proveedores o clientes, con acceso restringido a ciertos recursos."],
["Compare OpenVPN y WireGuard.","OpenVPN: aplicación en espacio de usuario, usa TLS/OpenSSL, admite UDP o TCP, certificados, usuario y contraseña o clave estática; es muy configurable y portable, pero más pesado. WireGuard: en el kernel, poco código, criptografía fija moderna, claves públicas intercambiadas fuera de banda, solo UDP (51820), 4 tipos de mensaje, roaming; es más simple y rápido, pero menos flexible."],
["¿Por qué se usan dos modos en IPsec? Dé un caso de uso de cada uno.","Transporte protege solo la carga y conserva el encabezado IP original: sirve entre dos hosts que se comunican directamente (servidor a servidor). Túnel encapsula el paquete completo en uno nuevo: sirve entre gateways para unir redes (sucursal y casa central) y oculta las IP internas."],
["Explique cómo IPsec decide qué hacer con un paquete saliente.","Consulta la SPD con los selectores del paquete (IP origen y destino, protocolo, puertos). Si la política es DISCARD lo descarta; si es BYPASS lo envía sin protección; si es PROTECT busca en la SADB la SA correspondiente (o pide a IKE que la negocie) y aplica AH o ESP con sus algoritmos y claves, agregando el SPI y el número de secuencia."],
["¿Qué es split tunnel y full tunnel? Ventajas de cada uno.","Split tunnel: solo el tráfico hacia la red de la organización va por la VPN y el resto sale directo; ahorra ancho de banda y latencia. Full tunnel: todo sale por la VPN (ruta por defecto hacia el túnel); da más control y seguridad (filtrado central, redes Wi-Fi inseguras), pero carga más al concentrador."],
["¿Por qué MPLS VPN no es una VPN segura en el sentido criptográfico?","Porque solo separa el tráfico de cada cliente con etiquetas dentro de la red del proveedor: no cifra ni autentica. La confidencialidad depende de confiar en el proveedor; si hace falta, se agrega IPsec encima."]
],
sdn:[
["Compare máquinas virtuales y contenedores.","La VM virtualiza el hardware y corre su propio kernel sobre un hipervisor: más aislamiento, puede correr cualquier SO, pero pesa más (GB, arranque lento). El contenedor comparte el kernel del host y se aísla con namespaces y cgroups: liviano (MB), arranca en segundos y tiene alta densidad, pero aísla menos y solo corre el mismo tipo de SO del host."],
["Compare una red tradicional con una red SDN.","En la red tradicional cada equipo tiene su plano de control y de datos y se configura uno por uno, con protocolos distribuidos. En SDN el control se centraliza en un controlador con vista global que programa los switches por una API southbound (OpenFlow) y expone una API northbound a las aplicaciones: más automatización y flexibilidad, pero el controlador debe ser redundante para no ser un SPoF."],
["Compare las topologías de datacenter de tres capas y spine-leaf.","Tres capas (acceso, agregación, núcleo): pensada para tráfico norte-sur, depende de STP y bloquea enlaces, con latencia variable entre servidores. Spine-leaf: cada leaf se conecta a todos los spine, cualquier par de servidores está a dos saltos, usa todos los enlaces con ECMP y escala agregando spines; ideal para el tráfico este-oeste actual."],
["¿Qué es NFV y cómo se relaciona con SDN?","Network Functions Virtualization: implementar funciones de red (firewall, balanceador, router, NAT) como software en servidores comunes en lugar de equipos dedicados. SDN separa y centraliza el control de la red; NFV virtualiza las funciones. Son complementarios: SDN puede encaminar el tráfico por las funciones virtualizadas."],
["¿Qué es la migración en vivo y qué la hace posible?","Mover una VM encendida de un servidor físico a otro sin cortar el servicio. Se copia la memoria mientras la VM sigue funcionando, luego se pausa un instante para copiar lo último y se reanuda en el destino. Requiere almacenamiento compartido (o copiado), red común y CPU compatibles."],
["¿Qué mide el PUE y por qué importa?","Power Usage Effectiveness: energía total del datacenter dividida por la energía de los equipos IT. Un valor de 1 sería ideal (toda la energía va a IT); un PUE de 2 significa que por cada watt de IT se gasta otro en refrigeración, iluminación y pérdidas. Mide la eficiencia energética."]
]};

PD.hipervisores.modelo="a) Según la cátedra: el <b>tipo I (nativo o bare-metal)</b> se ejecuta directamente sobre el hardware, interactúa directamente con la <b>ISA</b> (Instruction Set Architecture) y por eso debe implementar sus propios manejadores de dispositivos y capacidades de administración del hardware. Ejemplos: Xen, VMware ESX/ESXi, WindRiver (y Hyper-V). El <b>tipo II (hosted)</b> se ejecuta sobre un SO convencional, aprovecha sus manejadores de dispositivos y su administración del hardware, interactúa con el SO a través de la <b>ABI</b> (Application Binary Interface) y emula la ISA del hardware virtual para las VM. Ejemplos de la cátedra: VMware Workstation, Parallels, VirtualBox, VirtualPC y KVM.<br>b) <b>Tipo I</b>: mejor rendimiento (sin SO intermedio), mejor aislamiento y seguridad (menor superficie), apto para producción y datacenter; a cambio debe traer sus propios drivers (soporta menos hardware), necesita una máquina dedicada y suele gestionarse desde otra consola. <b>Tipo II</b>: fácil de instalar, reutiliza los drivers y la gestión del SO anfitrión, ideal para escritorio, pruebas y desarrollo; a cambio tiene más overhead (las llamadas pasan por el SO), depende del anfitrión (si cae o se compromete, caen las VM) y rinde menos.";
PD.hipervisores.pts=["Tipo I sobre el hardware, interactúa con la ISA","Tipo I implementa sus propios drivers y administración del hardware","Ejemplos tipo I: Xen, VMware ESX, WindRiver","Tipo II sobre un SO convencional, usa la ABI y sus drivers","Tipo II emula la ISA del hardware virtual","Ejemplos tipo II: VMware Workstation, VirtualBox, Parallels, KVM (según la cátedra)","Ventajas y desventajas de cada uno (rendimiento, aislamiento, drivers, dependencia del anfitrión)"];

["¿Qué es virtualizar según la cátedra?","Abstraer los recursos de computación: abstracción → aislación → optimización de recursos. La virtualización de sistema abstrae una computadora completa (memoria, CPU y periféricos)."],
["¿Qué tipos de virtualización hay?","De máquina, de almacenamiento (SAN), de red (externa: VLAN; interna: NAT, TUN/TAP), de escritorio (VNC, RDP, X Server) y de servidor de aplicaciones."],
["¿Cuáles son los componentes de la virtualización?","Guest (el sistema virtualizado), capa de virtualización y host (el sistema físico)."],
["¿Qué características se pueden implementar?","Compartimiento, agregación, emulación, aislamiento y performance tuning (→ QoS → SLA)."],
["¿Qué dice el Teorema 1 de Popek y Goldberg?","Que se puede construir un VMM si el conjunto de instrucciones sensibles es un subconjunto del de instrucciones privilegiadas."],
["¿Cuáles son las 4 técnicas de virtualización de plataforma?","Emulación, full virtualization (traducción binaria), paravirtualización y HVM (asistida por hardware)."],
["¿Qué es un contenedor?","Virtualización a nivel de SO: los guests comparten el kernel del anfitrión y se aíslan con espacios de nombres; aíslan servicios, no plataformas completas."],
["¿Qué es un datacenter según TIA-942?","Un edificio o parte de un edificio cuya función principal es alojar una sala de cómputo y sus áreas de soporte."],
["¿Qué tres planos tiene un dispositivo de red?","Datos (reenvío), control (decide cómo tratar los paquetes, algoritmos distribuidos) y gestión (configura los otros planos: CLI, GUI, SNMP, NETCONF)."],
["¿Qué es SDN según la ONF?","La separación física del plano de control de red del plano de reenvío, donde un plano de control controla varios dispositivos."],

S({h:"Virtualización: concepto, tipos y componentes",b:`<p><b>Virtualización:</b> abstracción de los recursos de computación. <b>Abstracción → Aislación → Optimización de recursos.</b> Desde el SO se virtualizan memoria, dispositivos y archivos; la <b>virtualización de sistema</b> abstrae una computadora completa (memoria, CPU y periféricos). Hoy también se virtualizan aplicaciones, almacenamiento, memoria y red.</p>
<div class="tbl"><table><tr><th>Tipo</th><th>Ejemplo</th></tr>
<tr><td>Máquina (Computer System Virtualization)</td><td>Una VM que “cree” tener una PC completa</td></tr>
<tr><td>Almacenamiento (Storage Virtualization)</td><td>SAN: varios discos que aparentan ser uno</td></tr>
<tr><td>Red (Network Virtualization)</td><td>Externa: VLAN. Interna (consecuencia de virtualizar sistemas): NAT, TUN/TAP</td></tr>
<tr><td>Escritorio (Desktop Virtualization)</td><td>VNC, RDP, X Server</td></tr>
<tr><td>Servidor de aplicaciones</td><td>Un servidor usado desde varios entornos virtuales</td></tr></table></div>
<p><b>Componentes:</b> <b>Guest</b> (lo virtualizado) · <b>capa de virtualización</b> (virtualization layer) · <b>Host</b> (lo físico).</p>
<p><b>Características implementables:</b> <b>compartimiento</b> (un servidor para N VM), <b>agregación</b> (varios recursos presentados como uno), <b>emulación</b>, <b>aislamiento</b> y <b>performance tuning → QoS → SLA</b>.</p>
<p><b>Las técnicas dan soporte para ejecutar:</b> sistemas operativos, una ABI, programas compilados para una máquina abstracta (por ejemplo la JVM) o aplicaciones. <b>Se implementan:</b> directamente sobre el hardware, sobre el SO, mediante una aplicación o con librerías enlazadas estática o dinámicamente.</p>
<p><b>Historia:</b> IBM en sus mainframes en los años 60; VMware a fines de los 90 en x86; en 2005 Intel y AMD agregan extensiones (Intel VT, AMD-V). <b>En alza por:</b> más capacidad de cómputo, hardware y software infrautilizados, necesidad de espacio, iniciativas “verdes” y costos administrativos.</p>`,
mcq:[{q:"Según la cátedra, la virtualización sigue la secuencia:",o:["Aislación → Abstracción → Ahorro","Abstracción → Aislación → Optimización de recursos","Emulación → Traducción → Ejecución","Compartir → Agregar → Emular"],a:1,e:""},
{q:"Las VLAN son un ejemplo de virtualización:",o:["De máquina","De almacenamiento","De red externa","De escritorio"],a:2,e:"NAT y TUN/TAP son red interna."},
{q:"¿Cuál NO es un componente de la virtualización según la cátedra?",o:["Guest","Capa de virtualización","Host","Controlador SDN"],a:3,e:""},
{q:"¿En qué año Intel y AMD agregaron soporte de virtualización a x86?",o:["1974","1999","2005","2015"],a:2,e:"Intel VT y AMD-V."}],
vf:[["La agregación presenta varios recursos físicos como uno solo.",true,""]]});

S({h:"Popek y Goldberg (1974)",b:`<p class="tag warn">Salió en el 2º parcial 2015</p>
<p><b>Propiedades de una VM</b> (en palabras de la cátedra):</p>
<ul><li><b>Eficiencia:</b> todas las instrucciones inocuas son ejecutadas por el hardware directamente, sin intervención del programa de control.</li>
<li><b>Control de recursos:</b> debe ser imposible que un programa arbitrario afecte los recursos del sistema (por ejemplo la memoria); ante cualquier intento se invoca al asignador del programa de control.</li>
<li><b>Equivalencia:</b> un programa que corre con el programa de control residente se comporta de forma indistinguible de cuando no existe (salvo tiempos y disponibilidad de recursos).</li></ul>
<p><b>Instrucciones privilegiadas:</b> generan un <b>trap</b> si la CPU está en modo usuario, no en modo supervisor.<br>
<b>Instrucciones sensibles:</b> <b>de control</b> (control sensitive: cambian la configuración del sistema) o <b>de comportamiento</b> (behavior sensitive: dependen específicamente del hardware para el que fueron hechas).</p>
<div class="key"><b>Teorema 1:</b> para cualquier computadora convencional de tercera generación se puede construir un VMM si el conjunto de instrucciones <b>sensibles</b> es un <b>subconjunto</b> del de instrucciones <b>privilegiadas</b>.<br>
<b>Teorema 2:</b> es <b>recursivamente virtualizable</b> si (a) es virtualizable y (b) se puede construir un VMM sin dependencias de temporización.<br>
<b>Teorema 3:</b> se puede construir un <b>VMM híbrido</b> si las instrucciones sensibles <i>de usuario</i> son un subconjunto de las privilegiadas.</div>
<p>Pregunta de la diapositiva: <b>¿cuál CPU es virtualizable?</b> La que cumple el Teorema 1. x86 no lo cumplía (tenía instrucciones sensibles no privilegiadas, como POPF o SGDT), por eso se usó traducción binaria, paravirtualización y luego Intel VT y AMD-V.</p>`,
mcq:[{q:"Según el Teorema 1, se puede construir un VMM si:",o:["Privilegiadas ⊆ sensibles","Sensibles ⊆ privilegiadas","No hay instrucciones sensibles","Todas las instrucciones son inocuas"],a:1,e:""},
{q:"Una instrucción privilegiada:",o:["Genera trap en modo supervisor","Genera trap si la CPU está en modo usuario","Nunca genera trap","Solo existe en x86"],a:1,e:""},
{q:"Una instrucción behavior sensitive:",o:["Cambia la configuración del sistema","Depende del hardware para el que fue hecha","Es inocua","Genera siempre trap"],a:1,e:"Control sensitive = cambia la configuración."},
{q:"La propiedad que exige que las instrucciones inocuas corran directo en el hardware es:",o:["Equivalencia","Control de recursos","Eficiencia","Aislamiento"],a:2,e:""},
{q:"El Teorema 2 trata sobre:",o:["VMM híbridos","Virtualización recursiva","Contenedores","Traducción binaria"],a:1,e:""}],
fill:[{q:"Año del trabajo de Popek y Goldberg",a:["1974"],e:"1974."}]});

S({h:"Técnicas de virtualización de plataforma",b:`<div class="tbl"><table><tr><th>Técnica</th><th>Cómo funciona</th><th>Ejemplo</th></tr>
<tr><td><b>1. Emulación</b></td><td>Bucle <b>leer → interpretar/traducir → ejecutar</b> cada instrucción; puede emular otra arquitectura, pero es lenta</td><td>QEMU sin aceleración</td></tr>
<tr><td><b>2. Full Virtualization</b></td><td><b>Traducción binaria</b> realizada por el hipervisor: reescribe las instrucciones problemáticas; el guest no se modifica</td><td>VMware en x86 antes de 2005</td></tr>
<tr><td><b>3. Paravirtualización</b></td><td>El hipervisor permite compartir el hardware y <b>el guest “lo sabe”</b>: está modificado para llamar al hipervisor (hypercalls)</td><td>Xen</td></tr>
<tr><td><b>4. HVM</b> (Hardware Assisted Virtualization)</td><td>El hardware provee soporte en la CPU para ejecutar un hipervisor</td><td>Intel VT, AMD-V; KVM</td></tr></table></div>
<p><b>Soporte de hardware:</b> el procesador debe tener un conjunto de instrucciones dividido en clases (anillos o modos) que definan quién puede usarlas. Arquitecturas: IBM System/370, System/390 y zSeries; x86 con Intel VT y AMD-V (2005); POWER ISA v2.03 (2006); ARM Cortex-A15 (2010); UltraSPARC (2005).</p>`,
mcq:[{q:"En paravirtualización:",o:["El guest no sabe que está virtualizado","El guest “sabe” y está modificado para cooperar con el hipervisor","Se emula cada instrucción","No hay hipervisor"],a:1,e:"Xen."},
{q:"La técnica basada en traducción binaria realizada por el hipervisor es:",o:["Emulación","Full virtualization","Paravirtualización","HVM"],a:1,e:""},
{q:"El bucle leer, interpretar/traducir, ejecutar corresponde a:",o:["Emulación","HVM","Paravirtualización","Contenedores"],a:0,e:""}],
vf:[["HVM requiere soporte en la CPU, como Intel VT o AMD-V.",true,""]]});

S({h:"Hipervisores tipo I y tipo II (según la cátedra)",b:`<p class="tag warn">Salió en el 2º parcial 2015</p>
<div class="tbl"><table><tr><th></th><th>Tipo I (native, bare-metal)</th><th>Tipo II (hosted)</th></tr>
<tr><td>Dónde corre</td><td>Directamente sobre el hardware</td><td>Sobre un SO convencional</td></tr>
<tr><td>Interfaz</td><td>Interactúa directamente con la <b>ISA</b> del hardware</td><td>Interactúa con el SO por la <b>ABI</b> y emula la ISA del hardware virtual para las VM</td></tr>
<tr><td>Drivers</td><td>Debe implementar manejadores de dispositivos y administración del hardware</td><td>Aprovecha los manejadores y la administración del SO</td></tr>
<tr><td>Ejemplos de la cátedra</td><td>Xen, VMware ESX, WindRiver</td><td>VMware Workstation, Parallels, VirtualBox, VirtualPC, <b>KVM</b></td></tr></table></div>
<div class="key"><b>Ojo con KVM:</b> la cátedra lo pone como tipo II porque es un módulo del kernel de un Linux convencional (con qemu-kvm y libvirtd en espacio de usuario). Muchas fuentes lo consideran tipo I. En el parcial, usá la clasificación de la cátedra y, si querés, mencioná la discusión.</div>
<p><b>Arquitecturas vistas:</b> <b>Xen</b> (paravirtual, con un dominio privilegiado dom0 que maneja los drivers), <b>VMware Workstation</b> (sobre el SO), <b>VMware ESXi</b> (sobre el hardware), <b>Microsoft Hyper-V</b> (partición padre con Windows y particiones hijas) y <b>KVM</b> (módulo kvm del kernel + un proceso qemu-kvm por VM, cuya CPU corre en <i>guest-state</i>, administrado con libvirtd). Ejemplo actual: AWS EC2 pasó de Xen a Nitro (basado en KVM).</p>
<p><b>Aislación</b> (del resumen): la VM puede hacer lo que quiera, pero no directamente sobre el hardware: si intenta tocarlo, se genera un trap y el programa de control lo supervisa.</p>`,
mcq:[{q:"Según la cátedra, un hipervisor tipo II interactúa con el SO mediante:",o:["La ISA","La ABI","OpenFlow","SNMP"],a:1,e:"El tipo I interactúa con la ISA."},
{q:"¿Cuál es un ejemplo de tipo I según la cátedra?",o:["VirtualBox","Parallels","Xen","VirtualPC"],a:2,e:"También VMware ESX y WindRiver."},
{q:"Según las diapositivas de la cátedra, KVM figura como:",o:["Tipo I","Tipo II","Contenedor","Emulador puro"],a:1,e:"Muchas fuentes lo consideran tipo I: conviene aclararlo."},
{q:"¿Qué tipo de hipervisor debe implementar sus propios manejadores de dispositivos?",o:["Tipo I","Tipo II","Ninguno","Ambos"],a:0,e:""}]});

S({h:"Virtualización a nivel de SO: contenedores",b:`<p>También llamados containers, zones, jails o virtual private servers.</p>
<ul><li>Los guests <b>comparten el kernel</b> con el anfitrión.</li>
<li>Orientados a <b>aislar servicios</b>, no plataformas completas.</li>
<li>Basados en la aislación de <i>user-spaces</i> por <b>separación de espacios de nombres</b>.</li></ul>
<p><b>Namespaces de Linux:</b> <b>Mount</b> (sistema de archivos), <b>UTS</b> (nombre de host), <b>IPC</b>, <b>Process</b> (PID), <b>Network</b> (interfaces y rutas propias) y <b>User</b> (usuarios). Los límites de recursos se aplican con cgroups.</p>
<p><b>Ejemplos:</b> FreeBSD Jails, HP-UX Containers, Solaris Zones, Linux VServer, OpenVZ, Virtuozzo, LXC, Docker, VMware ThinApp. Kathará, que usamos en los TPs, arma cada equipo como un contenedor Docker.</p>`,
mcq:[{q:"Los contenedores:",o:["Tienen cada uno su kernel","Comparten el kernel del anfitrión","Requieren HVM","Son hipervisores tipo I"],a:1,e:""},
{q:"¿Qué namespace le da a un contenedor sus propias interfaces y rutas?",o:["UTS","Mount","Network","IPC"],a:2,e:""},
{q:"Según la cátedra, los contenedores están orientados a aislar:",o:["Plataformas completas","Servicios","Hardware","Redes WAN"],a:1,e:""}]});

S({h:"Infraestructura de Data Centers",b:`<p><b>Data Center (TIA-942):</b> <i>a building or portion of a building whose primary function is to house a computer room and its support areas</i>, es decir, un edificio o parte de un edificio cuya función principal es alojar una sala de cómputo y sus áreas de soporte. Está diseñado para albergar gran cantidad de equipos de cómputo y componentes asociados (almacenamiento y telecomunicaciones).</p>
<p><b>Debe contemplarse:</b> espacios y distribución; infraestructura de cableado; niveles de confiabilidad; consideraciones medioambientales.</p>
<div class="tbl"><table><tr><th>Estándar</th><th>Qué define</th></tr>
<tr><td>Uptime Institute Tier Standards</td><td>Niveles (Tiers) por desempeño; certifica diseño, construcción y sustentabilidad operacional</td></tr>
<tr><td>ANSI/TIA-942</td><td>Infraestructura de telecomunicaciones: espacios y distribución</td></tr>
<tr><td>BICSI-002</td><td>Buenas prácticas de diseño e implementación</td></tr>
<tr><td>ICREA-Std-131-2015</td><td>Norma internacional para construir centros de procesamiento de datos, con niveles de confiabilidad y seguridad</td></tr></table></div>`,
mcq:[{q:"¿Qué norma define un datacenter como edificio o parte de un edificio que aloja una sala de cómputo y sus áreas de soporte?",o:["ICREA-131","TIA-942","BICSI-002","RFC 7426"],a:1,e:""},
{q:"¿Cuál NO es algo que deba contemplarse en el diseño de un datacenter según la cátedra?",o:["Espacios y distribución","Infraestructura de cableado","Niveles de confiabilidad","El códec de voz"],a:3,e:"El cuarto es consideraciones medioambientales."}]});

S({h:"Uptime Institute: los Tiers",b:`<p class="tag warn">Salió en el 2º parcial 2015</p>
<p>El <b>Tier Performance Standard</b> no presenta una checklist: el nivel se determina según las prestaciones, con <b>pruebas de confirmación de desempeño</b>. Certifica en tres categorías: <b>diseño</b>, <b>construcción</b> y <b>sustentabilidad operacional</b>.</p>
<div class="tbl"><table><tr><th>Tier</th><th>Nombre oficial</th><th>Requerimientos funcionales</th><th>Disponibilidad</th></tr>
<tr><td>I</td><td>Basic Site Infrastructure</td><td>Sin redundancia; si falla un componente no hay servicio; el mantenimiento obliga a apagar todo</td><td>99,671 %</td></tr>
<tr><td>II</td><td>Redundant Capacity Components Site Infrastructure</td><td>Componentes de capacidad redundantes (N+1), pero un solo camino de distribución; el mantenimiento obliga a apagar</td><td>99,741 %</td></tr>
<tr><td>III</td><td>Concurrently Maintainable Site Infrastructure</td><td>Todo duplicado, con múltiples caminos (uno activo); el mantenimiento se hace en forma concurrente, sin apagar</td><td>99,982 %</td></tr>
<tr><td>IV</td><td>Fault Tolerant Site Infrastructure</td><td>Todo redundante y con caminos activos simultáneos; tolera una falla sin impacto</td><td>99,995 %</td></tr></table></div>
<div class="key">II contra III: los dos tienen componentes redundantes; el <b>III</b> agrega caminos redundantes y se puede <b>mantener sin cortar</b>. El II, para mantener, apaga.</div>`,
mcq:[{q:"El nombre oficial del Tier III es:",o:["Basic Site Infrastructure","Redundant Capacity Components","Concurrently Maintainable Site Infrastructure","Fault Tolerant Site Infrastructure"],a:2,e:""},
{q:"¿Qué disponibilidad corresponde al Tier II?",o:["99,671 %","99,741 %","99,982 %","99,995 %"],a:1,e:""},
{q:"El Uptime Institute certifica en tres categorías:",o:["Diseño, construcción y sustentabilidad operacional","Energía, frío y red","Hardware, software y personal","Tier I, II y III"],a:0,e:""},
{q:"¿Cómo determina el Uptime Institute el Tier?",o:["Con una checklist de componentes","Con pruebas de confirmación de desempeño","Por el tamaño del edificio","Por la cantidad de racks"],a:1,e:""}],
fill:[{q:"Disponibilidad del Tier IV (en %, con coma o punto)",a:["99,995","99.995","99,995%","99.995%"],e:"99,995 %."}]});

S({h:"TIA-942: espacios · ICREA: niveles",b:`<p><b>ANSI/TIA-942</b> define los espacios y la distribución del cableado:</p>
<div class="tbl"><table><tr><th>Espacio</th><th>Función</th></tr>
<tr><td>Entrance Room</td><td>Sala de entrada: interfaz con los proveedores de telecomunicaciones</td></tr>
<tr><td>MDA (Main Distribution Area)</td><td>Área de distribución principal: núcleo del cableado, routers y switches de core</td></tr>
<tr><td>HDA (Horizontal Distribution Area)</td><td>Área de distribución horizontal: switches de acceso hacia las filas de equipos</td></tr>
<tr><td>ZDA (Zone Distribution Area)</td><td>Punto de consolidación opcional entre la HDA y los equipos</td></tr>
<tr><td>EDA (Equipment Distribution Area)</td><td>Área de distribución de equipos: racks con servidores y almacenamiento</td></tr></table></div>
<p><b>ICREA-Std-131-2015</b>, niveles de confiabilidad y seguridad:</p>
<div class="tbl"><table><tr><th>Nivel</th><th>Certificación</th><th>Disponibilidad</th></tr>
<tr><td>I</td><td>QADC (Quality Assurance Data Center)</td><td>95 %</td></tr>
<tr><td>II</td><td>WCQA (World Class Quality Assurance)</td><td>99 %</td></tr>
<tr><td>III</td><td>S-WCQA (Safety World Class)</td><td>99,9 %</td></tr>
<tr><td>IV</td><td>HS-WCQA (High Security World Class)</td><td>99,99 %</td></tr>
<tr><td>V</td><td>HSHA-WCQA (High Security High Available)</td><td>99,999 %</td></tr></table></div>
<p>ICREA incluye: aspectos generales, instalaciones eléctricas, aire acondicionado, comunicaciones, entorno (piso elevado, obra civil) y seguridad (CCTV, control de acceso, detección y supresión de incendios).</p>`,
mcq:[{q:"En TIA-942, el área donde están los racks de servidores es:",o:["MDA","HDA","EDA","Entrance Room"],a:2,e:""},
{q:"La interfaz con los proveedores de telecomunicaciones está en:",o:["Entrance Room","ZDA","EDA","HDA"],a:0,e:""},
{q:"¿Cuántos niveles define ICREA-131-2015?",o:["3","4","5","6"],a:2,e:"Uptime define 4 Tiers."}]});

S({h:"Red tradicional y sus tres planos",b:`<p><b>Modelo tradicional (el éxito de Internet):</b> protocolos en capas independientes (aplicaciones sobre transporte fiable o no fiable, paquetes y tramas best-effort, transferencia física de bits), pensado para redes no fiables con patrones de tráfico “conocidos”, con <b>dispositivos autónomos</b>.</p>
<div class="tbl"><table><tr><th>Plano</th><th>Qué hace</th></tr>
<tr><td><b>Data Plane</b> (datos)</td><td>Maneja y reenvía paquetes: switcheo, ruteo, filtrado, modificación. Tablas de reenvío <b>FIB</b> y <b>LFIB</b> (MPLS); para rendimiento usa memorias <b>CAM/TCAM</b>. Filtros, medidores y marcadores</td></tr>
<tr><td><b>Control Plane</b> (control)</td><td>Configura el plano de datos indicándole cómo tratar los paquetes; algoritmos distribuidos (ruteo); descubrimiento de topología, selección de rutas, failover</td></tr>
<tr><td><b>Management Plane</b> (gestión)</td><td>Configura el plano de control (y a veces el de datos): CLI, GUI, SNMP, NETCONF</td></tr></table></div>
<p>Del resumen: el control distribuido recalcula rutas si cae un enlace (ventaja), pero tiene <b>tiempo de convergencia</b> y la ruta alternativa se elige por destino y no según el tráfico, así que el uso de la red no es óptimo (desventaja).</p>`,
mcq:[{q:"Las tablas FIB y LFIB pertenecen al plano:",o:["De datos","De control","De gestión","De aplicación"],a:0,e:""},
{q:"SNMP y NETCONF son herramientas del plano:",o:["De datos","De control","De gestión","De transporte"],a:2,e:""},
{q:"Los algoritmos de ruteo distribuidos son parte del plano:",o:["De datos","De control","De gestión","Físico"],a:1,e:""}],
fill:[{q:"Memoria que usan los switches para buscar rápido en las tablas (sigla, la ternaria)",a:["tcam"],e:"TCAM."}]});

S({h:"SDN: definición, arquitectura y uso",b:`<p><b>Idea:</b> separar el plano de control de los dispositivos y <b>centralizarlo en un controlador</b>; administrar los servicios de red abstrayéndose del bajo nivel; <b>programar</b> la red mediante una API.</p>
<div class="tbl"><table><tr><th>Fuente</th><th>Definición</th></tr>
<tr><td>UIT-T Y.3300</td><td>Conjunto de técnicas que permite programar, orquestar, controlar y gestionar directamente los recursos de red, facilitando diseñar, entregar y operar servicios de red de forma dinámica y escalable</td></tr>
<tr><td>IETF RFC 7426</td><td>Enfoque de redes programables que soporta la separación de los planos de control y reenvío mediante interfaces estandarizadas</td></tr>
<tr><td>ONF</td><td>Separación <b>física</b> del plano de control del plano de reenvío, donde un plano de control controla varios dispositivos</td></tr></table></div>
<p><b>Controladores:</b> libres (OpenDaylight, OpenContrail, Floodlight, ONOS, Ryu, Beacon, POX; ONAP, unión de ECOMP de AT&T y OPEN-O), propietarios (Cisco, Juniper, VMware, HP, Big Switch…) e internos (Google: B4, Andromeda y otros).</p>
<p><b>¿Se usa?</b> En carriers globales (AT&T, Telefónica, Orange…): en 2019 el 75 % del tráfico sobre los túneles MPLS del core de AT&T estaba bajo control SDN. También dentro de los datacenters.</p>`,
mcq:[{q:"¿Qué organismo define SDN como la separación física del plano de control del de reenvío, con un plano de control para varios dispositivos?",o:["IETF","UIT-T","ONF","IEEE"],a:2,e:""},
{q:"El RFC que define la terminología y capas de SDN es:",o:["RFC 7426","RFC 4301","RFC 3261","RFC 8446"],a:0,e:""},
{q:"¿Cuál es un controlador SDN libre?",o:["ONOS","Hyper-V","ESXi","Suricata"],a:0,e:""}]});

S({h:"OpenFlow: switch, tablas y procesamiento",b:`<p class="tag warn">Salió en el 2º parcial 2015</p>
<p><b>Origen:</b> 2008, UC Berkeley, Washington y Princeton, “OpenFlow: Enabling Innovation in Campus Networks”. Idea: aprovechar las tablas de flujo que los switches ya implementan. Especificación de la ONF, versión 1.5.1 (marzo 2015).</p>
<p><b>Un switch OpenFlow tiene:</b> <b>flow tables</b>, un <b>canal seguro</b> de comunicación con el controlador y el <b>protocolo OpenFlow</b> (interfaz estándar para definir las tablas). Puede ser dedicado o híbrido. El controlador agrega, modifica o borra entradas; las actualizaciones pueden ser <b>proactivas</b> o <b>reactivas</b>.</p>
<div class="tbl"><table><tr><th>Campo de la entrada</th><th>Qué es</th></tr>
<tr><td>match fields</td><td>Puerto de ingreso y encabezados del paquete (MAC, VLAN, DSCP, IP, puertos TCP/UDP/SCTP, ICMP, ARP, IPv6, MPLS…) y metadatos de tablas anteriores</td></tr>
<tr><td>priority</td><td>Precedencia de la entrada</td></tr>
<tr><td>counters</td><td>Se actualizan cuando un paquete coincide</td></tr>
<tr><td>instructions</td><td>Modifican el conjunto de acciones (action set) o el procesamiento en tubería</td></tr>
<tr><td>timeouts</td><td>Tiempo máximo de la entrada o máximo sin actividad</td></tr>
<tr><td>cookie</td><td>Valor del controlador para filtrar estadísticas, modificaciones o borrados; no se usa al procesar paquetes</td></tr>
<tr><td>flags</td><td>Cómo se administran las entradas</td></tr></table></div>
<p><b>Procesamiento (pipeline):</b> el paquete entra con el action set vacío y empieza por la <b>tabla 0</b>. Si coincide, se actualizan contadores y se ejecutan las instrucciones (agregar acciones, saltar a una tabla de número mayor). Si no coincide, se usa la entrada de <b>table-miss</b> (por ejemplo, enviar al controlador); si no hay, se descarta. Al final se ejecuta el action set (y grupos); si hay acción de salida, el paquete sale por ese puerto y pasa por las tablas de egreso.</p>
<p><b>Puertos:</b> físicos, lógicos (túneles, loopback, agregación) y reservados: ALL, CONTROLLER, TABLE, IN_PORT, ANY, UNSET, y opcionales LOCAL, NORMAL, FLOOD.</p>`,

S({h:"OpenFlow: instrucciones, acciones y mensajes",b:`<div class="tbl"><table><tr><th></th><th>Requeridas</th><th>Opcionales</th></tr>
<tr><td><b>Instrucciones</b></td><td>Write-Actions (agrega acciones al action set) · Goto-Table (próxima tabla) · Clear-Actions (vacía el action set)</td><td>Apply-Actions (aplica ya, sin tocar el action set) · Stat-Trigger (evento al controlador si una estadística cruza un umbral) · Write-Metadata</td></tr>
<tr><td><b>Acciones</b></td><td>Output (puerto) · Group · Drop</td><td>Set-Queue · Meter · Push/Pop-Tag (VLAN, MPLS, PBB) · Set-Field · Copy-Field · Change-TTL</td></tr></table></div>
<p><b>Mensajes</b> (TCP o TLS, puerto <b>6653</b>):</p>
<div class="tbl"><table><tr><th>Tipo</th><th>Quién lo inicia</th><th>Ejemplos</th></tr>
<tr><td><b>Controller-to-Switch</b></td><td>El controlador, para administrar o inspeccionar el switch (con o sin respuesta)</td><td>Features, Configuration, Modify-State, Read-State, Packet-out, Barrier, Role-Request, Asynchronous-Configuration</td></tr>
<tr><td><b>Asynchronous</b></td><td>El switch sin que se lo pidan: paquetes que llegan, cambios de estado, errores</td><td>Packet-in, Flow-Removed, Port-Status, Error</td></tr>
<tr><td><b>Symmetric</b></td><td>Cualquiera de los dos, sin solicitud</td><td>Hello, Echo, Experimenter</td></tr></table></div>
<p><b>Múltiples controladores:</b> rol <b>equal</b> (envía mensajes al switch y recibe todos los asíncronos), <b>slave</b> (solo lectura; por defecto solo recibe Port-Status) y <b>master</b> (como equal, pero uno solo). <b>Conexiones auxiliares:</b> el switch puede abrir conexiones extra (TLS, TCP, DTLS o UDP) para aprovechar el paralelismo.</p>`,
mcq:[{q:"Packet-in es un mensaje de tipo:",o:["Controller-to-switch","Asynchronous","Symmetric","Experimenter"],a:1,e:"Lo envía el switch sin que se lo pidan."},
{q:"Hello y Echo son mensajes:",o:["Controller-to-switch","Asynchronous","Symmetric","De gestión SNMP"],a:2,e:""},
{q:"¿Qué instrucción indica la próxima tabla a procesar?",o:["Write-Actions","Goto-Table","Clear-Actions","Apply-Actions"],a:1,e:""},
{q:"¿Cuál es una acción requerida en OpenFlow?",o:["Set-Queue","Meter","Drop","Push-Tag"],a:2,e:"Requeridas: Output, Group y Drop."},
{q:"Con varios controladores, el rol de solo lectura es:",o:["Equal","Master","Slave","Auxiliary"],a:2,e:""}],
fill:[{q:"Puerto TCP/TLS de OpenFlow",a:["6653"],e:"6653."}]});

S({h:"Complemento: redes de datacenter y cloud",b:`<p class="note">No está en las diapositivas de 2019, pero aparece en la bibliografía y ayuda a responder preguntas de diseño.</p>
<ul><li><b>Tráfico norte-sur</b> (datacenter ↔ exterior) y <b>este-oeste</b> (entre servidores internos, hoy mayoritario).</li>
<li><b>Tres capas</b> (acceso, agregación, núcleo, como el modelo jerárquico Access/Distribution/Core): depende de STP. <b>Spine-leaf:</b> cada leaf se conecta a todos los spine; dos saltos entre cualquier par; ECMP; sin STP.</li>
<li><b>VXLAN:</b> tramas de capa 2 sobre UDP 4789 con VNI de 24 bits (~16 millones de segmentos contra 4094 VLAN).</li>
<li><b>NFV:</b> funciones de red (firewall, balanceador, router) como software en servidores comunes.</li>
<li><b>Cloud:</b> IaaS, PaaS, SaaS; pública, privada, híbrida. <b>PUE</b> = energía total / energía de IT.</li></ul>`,
mcq:[{q:"El tráfico entre servidores del mismo datacenter se llama:",o:["Norte-sur","Este-oeste","Overlay","Underlay"],a:1,e:""},
{q:"¿Cuántos segmentos admite VXLAN aproximadamente?",o:["4094","65 536","16 millones","Ilimitados"],a:2,e:""}]});

{q:"Explicá los planos de datos, control y gestión de un dispositivo de red y qué cambia en una arquitectura SDN.",pts:["Plano de datos: reenvío (FIB, LFIB, CAM/TCAM)","Plano de control: configura el de datos, ruteo distribuido, topología, failover","Plano de gestión: configura los otros (CLI, GUI, SNMP, NETCONF)","Tradicional: dispositivos autónomos con control distribuido","SDN: control separado y centralizado en un controlador que maneja varios dispositivos","Red programable por API (northbound) y protocolo estándar hacia los switches (OpenFlow)","Una definición formal (ONF, IETF RFC 7426 o UIT-T Y.3300)"],modelo:"En un dispositivo tradicional conviven tres planos: el de <b>datos</b> maneja y reenvía paquetes usando tablas (FIB, LFIB) en memorias CAM/TCAM; el de <b>control</b> configura ese plano con algoritmos distribuidos (ruteo, descubrimiento de topología, failover); y el de <b>gestión</b> configura los anteriores mediante CLI, GUI, SNMP o NETCONF. Cada dispositivo es autónomo. En <b>SDN</b> el plano de control se separa físicamente de los dispositivos y se centraliza en un <b>controlador</b> que controla varios (definición de la ONF); los switches conservan el plano de datos y el controlador los programa con un protocolo estándar como <b>OpenFlow</b>, mientras las aplicaciones programan la red por una API. Se gana vista global, automatización y uso más eficiente de la red, a costa de depender del controlador (que debe ser redundante)."},
{q:"Describí qué se debe contemplar en el diseño de un datacenter y qué estándares existen. Detallá los espacios de TIA-942.",pts:["Definición de datacenter (TIA-942)","Contemplar: espacios y distribución, cableado, confiabilidad, medio ambiente","Estándares: Uptime, TIA-942, BICSI-002, ICREA-131","Espacios: Entrance Room, MDA, HDA, ZDA, EDA con su función","Tiers o niveles de confiabilidad"],modelo:"Un datacenter es, según TIA-942, un edificio o parte de un edificio cuya función principal es alojar una sala de cómputo y sus áreas de soporte. Su diseño debe contemplar espacios y distribución, infraestructura de cableado, niveles de confiabilidad y consideraciones medioambientales. Estándares: <b>Uptime Institute</b> (Tiers I a IV por desempeño, certificando diseño, construcción y operación), <b>ANSI/TIA-942</b> (infraestructura de telecomunicaciones), <b>BICSI-002</b> (buenas prácticas) e <b>ICREA-131-2015</b> (niveles I a V de confiabilidad y seguridad). TIA-942 define la <b>Entrance Room</b> (interfaz con los proveedores), la <b>MDA</b> (distribución principal, core), las <b>HDA</b> (distribución horizontal hacia las filas), las <b>ZDA</b> opcionales (consolidación) y las <b>EDA</b> (racks con los equipos)."},
{q:"Compará emulación, virtualización completa, paravirtualización, virtualización asistida por hardware y contenedores.",pts:["Emulación: leer-interpretar-ejecutar, lenta, otra arquitectura","Full: traducción binaria, guest sin modificar","Paravirtualización: guest modificado que coopera (Xen)","HVM: soporte en la CPU (Intel VT, AMD-V)","Contenedores: comparten kernel, aíslan servicios con namespaces"],modelo:"La <b>emulación</b> interpreta cada instrucción en un bucle leer-interpretar-ejecutar: permite correr otra arquitectura pero es lenta. La <b>virtualización completa</b> usa traducción binaria hecha por el hipervisor: el guest no se modifica. En la <b>paravirtualización</b> el guest sabe que está virtualizado y está modificado para pedirle al hipervisor las operaciones privilegiadas (Xen): rinde bien pero exige modificar el SO. La <b>asistida por hardware (HVM)</b> usa extensiones de la CPU (Intel VT, AMD-V) para que el hipervisor atrape las instrucciones sensibles sin traducir ni modificar el guest. Los <b>contenedores</b> no virtualizan hardware: comparten el kernel del anfitrión y aíslan servicios con namespaces; son muy livianos, pero solo corren el mismo tipo de kernel."}];

addSec("resiliencia",{h:"STP: algoritmo y estados de los puertos",b:`<p>Del resumen del 2º parcial: el <b>algoritmo spanning-tree (STA)</b> se basa en teoría de grafos: un árbol de expansión mantiene la conectividad sin bucles.</p>
<ol><li>Cada puente tiene un <b>identificador único</b> (prioridad + MAC); cada puerto tiene un identificador y un <b>costo de trayectoria</b>.</li>
<li>Se elige el <b>puente raíz</b>: el de menor identificador.</li>
<li>Cada puente elige su <b>puerto raíz</b>: el de menor costo hasta la raíz.</li>
<li>En cada LAN se elige el <b>puente designado</b> (menor costo a la raíz) y su <b>puerto designado</b>: es el único que reenvía hacia y desde esa LAN.</li></ol>
<div class="tbl"><table><tr><th>Estado</th><th>BPDU</th><th>Tramas de datos</th><th>Aprende MAC</th></tr>
<tr><td>Bloqueo</td><td>Recibe, no envía</td><td>Descarta</td><td>No</td></tr>
<tr><td>Escucha</td><td>Procesa</td><td>Descarta</td><td>No</td></tr>
<tr><td>Aprendizaje</td><td>Procesa</td><td>Descarta</td><td><b>Sí</b></td></tr>
<tr><td>Envío</td><td>Procesa</td><td><b>Reenvía</b></td><td>Sí</td></tr>
<tr><td>Desactivado</td><td>No procesa</td><td>—</td><td>—</td></tr></table></div>
<p><b>Puente transparente:</b> aprende la ubicación de los hosts mirando la MAC de origen; si conoce el destino reenvía (o filtra si está del mismo lado) y si no lo conoce, inunda.</p>`,
mcq:[{q:"¿En qué estado de STP un puerto aprende direcciones MAC pero todavía descarta tramas?",o:["Bloqueo","Escucha","Aprendizaje","Envío"],a:2,e:""},
{q:"El puente raíz es el de:",o:["Mayor costo","Menor identificador","Más puertos","Mayor MAC"],a:1,e:""},
{q:"En cada LAN, el único puente que reenvía tramas hacia y desde ella es:",o:["El raíz","El designado","El de bloqueo","El transparente"],a:1,e:""}],
order:[{t:"Ordená los estados de un puerto STP hasta reenviar",items:["Bloqueo","Escucha","Aprendizaje","Envío"]}]});

addSec("voip",{h:"H.323, servidor de llamadas y gateway (resumen)",b:`<p><b>H.323</b> es un conjunto de estándares de la ITU-T centrado en videoconferencia, heredero de la señalización telefónica tradicional y más complejo que SIP (subcapas, la sección <i>fastStart</i> con 36 elementos).</p>
<div class="tbl"><table><tr><th>Componente H.323</th><th>Función</th></tr>
<tr><td>Terminales</td><td>Teléfonos o software</td></tr>
<tr><td>Gatekeeper</td><td>Autoridad de registro y control de admisión</td></tr>
<tr><td>MCU (Multipoint Control Unit)</td><td>Replica el streaming para multiconferencias</td></tr></table></div>
<p><b>Llamada H.323:</b> A y B se registran en el gatekeeper → A pide permiso y recibe la IP de B → A envía SETUP → B responde que está procesando → B verifica con el gatekeeper → B envía ALERT (suena) → al atender, CONNECT.</p>
<p><b>Servidor de llamadas:</b> registra los teléfonos, controla seguridad y admisión; la voz puede o no pasar por él. <b>Gateway:</b> conecta la red interna con otro sistema (por ejemplo, la telefonía pública), traduciendo entre tecnologías o uniendo proveedores. Las redes que llevan voz y datos juntas se llaman <b>redes convergentes</b>.</p>`,
mcq:[{q:"En H.323, la autoridad de registro y admisión es:",o:["El MCU","El gatekeeper","El proxy","El registrar SIP"],a:1,e:""},
{q:"El componente H.323 que replica el streaming para multiconferencias es:",o:["Gatekeeper","Terminal","MCU","Gateway"],a:2,e:""}],
order:[{t:"Ordená una llamada H.323",items:["A y B se registran en el gatekeeper","A pide permiso y obtiene la IP de B","A envía SETUP","B responde que está procesando","B verifica con el gatekeeper","B envía ALERT (suena)","Al atender, B envía CONNECT"]}]});

addSec("vpn",{h:"Tipos de VPN según la cátedra",b:`<div class="tbl"><table><tr><th>Tipo</th><th>Cómo funciona</th></tr>
<tr><td><b>Acceso remoto</b> (remote access)</td><td>Conecta usuarios a redes a través de un <b>Servidor de Acceso a la Red (NAS)</b>, que interactúa con un servidor de Autenticación, Autorización y Contabilidad (AAA)</td></tr>
<tr><td><b>Sitio a sitio</b> (site-to-site)</td><td>Conecta redes con redes mediante gestores de tráfico; las conexiones pueden iniciarse en un sentido o en ambos</td></tr></table></div>
<p>Además de los casos de uso (acceso remoto, intranet y extranet), la diapositiva separa estos dos tipos técnicos. Un usuario que se conecta desde su casa es <i>road warrior</i> (acceso remoto); dos sucursales unidas son sitio a sitio (<i>net-to-net</i>).</p>`,
mcq:[{q:"En una VPN de acceso remoto, el usuario se conecta a través de:",o:["Un switch OpenFlow","Un NAS que consulta a un servidor AAA","Un gatekeeper","Un balanceador"],a:1,e:""}]});

addSec("tls",{h:"Alertas de TLS (diapositiva 2019)",b:`<p>Las alertas tienen 2 bytes: nivel (1 warning, 2 fatal) y descripción. Algunas descripciones del RFC 8446 que conviene reconocer:</p>
<div class="tbl"><table><tr><th>Código</th><th>Alerta</th><th>Cuándo</th></tr>
<tr><td>0</td><td>close_notify</td><td>Cierre ordenado de la conexión</td></tr>
<tr><td>20</td><td>bad_record_mac</td><td>Un registro no pasó la verificación del MAC</td></tr>
<tr><td>40</td><td>handshake_failure</td><td>No se pudo acordar parámetros</td></tr>
<tr><td>42</td><td>bad_certificate</td><td>Certificado corrupto o con firma inválida</td></tr>
<tr><td>44</td><td>certificate_revoked</td><td>Certificado revocado</td></tr>
<tr><td>45</td><td>certificate_expired</td><td>Certificado vencido</td></tr>
<tr><td>48</td><td>unknown_ca</td><td>La CA del certificado no es de confianza</td></tr>
<tr><td>70</td><td>protocol_version</td><td>Versión no soportada</td></tr>
<tr><td>112</td><td>unrecognized_name</td><td>El nombre pedido (SNI) no existe en el servidor</td></tr></table></div>
<p>TLS también admite certificados OpenPGP (RFC 6091) o directamente claves públicas sin certificado (<i>Raw Public Keys</i>, RFC 7250).</p>`,
mcq:[{q:"Un navegador recibe un certificado de una CA que no conoce. ¿Qué alerta corresponde?",o:["close_notify","unknown_ca","bad_record_mac","protocol_version"],a:1,e:"Código 48."},
{q:"La alerta close_notify indica:",o:["Un error fatal de MAC","Un cierre ordenado de la conexión","Un certificado vencido","Una versión no soportada"],a:1,e:""}]});

const PRAC2020={t:"Segundo parcial 2020 (v4) · tu examen",nota:"Temas: VoIP, seguridad, criptografía, filtrado de paquetes y VPN. Formato práctico: análisis de paquetes y diseño de ACL. Abajo está tu respuesta de 2020 y una corrección sugerida.",
ej1:{consigna:`<p><b>Ejercicio 1.</b> Pequeña red con la PC del administrador, 3 teléfonos IP, una PBX VoIP y un servidor DNS. Un sniffer en el enlace entre SWT2 y el router A ve todos los paquetes que pasan. Completar la tabla indicando qué es cada paquete; si es <b>imposible</b> o <b>sospechoso</b>, explicar por qué.</p>
<p class="note">No tengo la figura de la topología. Por tus respuestas, se deduce: PBX = 10.3.0.100; teléfonos en 10.1.0.0/24; PC del administrador = 10.2.0.1; servidor DNS ≈ 10.3.0.101; router ≈ 10.3.0.1. Verificalo con la figura original.</p>`,
p:[
{r:"10.3.0.100:5060 → 10.1.0.2:5060 · UDP · SIP 200 OK",mine:"Correcto, aceptación de conexión.",ok:"OK",e:"La PBX responde 200 OK a un teléfono por SIP (5060/UDP). Normal."},
{r:"10.2.0.1:12839 → 10.3.0.101:5060 · UDP · SNMP get",mine:"Imposible: SNMP usa 161; 5060 es SIP.",ok:"Imposible",e:"Una consulta SNMP va al puerto 161 del agente, no al 5060. El contenido no corresponde al puerto."},
{r:"10.1.0.2:60999 → 10.3.0.1:40999 · UDP · RTP",mine:"Imposible, debe dirigirse a la PBX.",ok:"Sospechoso",e:"Un teléfono enviando RTP al router no tiene sentido si el router no es un extremo de la llamada: el RTP va a la PBX o a otro teléfono. “Sospechoso” es más prudente que “imposible” salvo que la figura muestre que 10.3.0.1 es el router."},
{r:"10.3.0.100:29888 → 190.1.3.4:123 · UDP · NTP",mine:"OK, para sincronizar relojes.",ok:"OK",e:"La PBX sincroniza la hora con un servidor NTP externo (UDP 123). Normal."},
{r:"10.3.0.100:22 → 10.2.0.1:29023 · TCP · SYN-ACK",mine:"Sospechoso, parece SSH.",ok:"OK",e:"Es la respuesta de la PBX (servidor SSH, puerto 22) a una conexión que inició la PC del administrador. Que el administrador entre por SSH a la PBX es normal: no es sospechoso."},
{r:"10.1.0.1:12839 → 10.3.0.101:160 · UDP · SNMP set",mine:"Imposible: un teléfono no haría SET y el puerto es 161.",ok:"Imposible",e:"El puerto del agente SNMP es 161 (160 no se usa) y un teléfono no es una estación de gestión. Bien identificado."},
{r:"10.3.0.100:18798 → 10.1.0.2:19827 · UDP · RTP",mine:"OK, envío de audio.",ok:"OK",e:"La PBX envía audio RTP a un teléfono por puertos efímeros (el RTP pasa por la PBX). Normal."},
{r:"10.3.0.100:5060 → 10.1.0.1:5060 · UDP · SIP 180 Ringing",mine:"Sospechoso: tiene sentido si antes hubo un INVITE no capturado.",ok:"OK",e:"La PBX avisa al teléfono que llama que el destino está sonando. El INVITE puede no haber pasado por este enlace o ser anterior a la captura. Es comportamiento normal."},
{r:"10.1.0.1:5060 → 10.3.0.100:5060 · UDP · SIP BYE",mine:"Imposible: para BYE debió establecerse la llamada.",ok:"OK",e:"Un teléfono cuelga una llamada con BYE a la PBX. El sniffer no ve todo el historial: la llamada pudo establecerse antes de la captura. No es imposible."},
{r:"280.30.2.1:18890 → 10.3.0.101:14323 · TCP · SSH",mine:"Sospechoso: el DNS no está en SWT2; SSH usa 22.",ok:"Imposible",e:"<b>280.30.2.1 no es una dirección IPv4 válida</b> (cada octeto va de 0 a 255). Además, SSH iría al puerto 22. Es el error más importante a detectar en este paquete."}]},
ej2:{consigna:`<p><b>Ejercicio 2.</b> Empresa de torneos de E-Sports (juegos FPS en red local) que transmite por streaming. a) Agregar los elementos necesarios y escribir la ACL (cadena, IP origen, IP destino, protocolo, puerto origen, puerto destino, acción, comentario) para cumplir:</p>
<ol><li>NOC1 debe poder verificar si cualquier dispositivo es alcanzable.</li>
<li>NOC1 debe poder consultar y modificar la configuración de servidores, routers y switches.</li>
<li>Las GAMER envían video al servidor de Streaming por un protocolo propietario sobre UDP 1550 y TCP 1551.</li>
<li>El servidor de Resultados solo debe accederse desde el exterior, y solo por HTTPS.</li>
<li>El servidor de Streaming envía video H.265 a cualquier host de la red IPv4 de costream.twitch.tv.</li>
<li>Equipos de jugadores y servidor de Juegos usan ESportsP sobre SCTP, puerto 5688 en el servidor.</li>
<li>El servidor de Juego nunca debe accederse desde Internet.</li>
<li>Todos los dispositivos pueden consultar DNS a 8.8.4.4.</li>
<li>Nada más está permitido.</li></ol>
<p>b) Se quiere permitir competir desde redes externas, pero SCTP/ESportsP no tiene autenticación. ¿Qué incorporar, dónde y qué cambiar en la ACL?</p>
<p class="note">Direcciones que surgen de tu respuesta: NOC1 = 10.3.1.11; GAMER = 10.1.1.0/24; Streaming = 22.10.1.21; Juego = 22.10.1.22; Resultados = 22.10.1.23. Supuesto: R1 es el borde con Internet y R2 separa la LAN de jugadores de los servidores.</p>`,
mine:`<p><b>a)</b> Firewall en R1 y en R2 con política por defecto DROP, con reglas de ida y vuelta (sin estado) para: ICMP desde y hacia NOC1, todo TCP desde y hacia NOC1, HTTPS hacia Resultados desde cualquier origen, DNS por TCP y UDP a 8.8.4.4, GAMER → Streaming por TCP 1551 y UDP 1550, Streaming → cualquier destino por UDP, y GAMER → Juego por SCTP 5688.</p>
<p><b>b)</b> Usar SSH sobre SCTP en el servidor de juego (regla SCTP puerto 22), u otra opción: una VPN road warrior o net-to-net.</p>`,
obs:[
"<b>Requisito 2 demasiado amplio:</b> permitir todo TCP desde NOC1 abre cualquier servicio. Consultar y modificar configuración es SSH (TCP 22), SNMP (UDP 161, get y set) y quizás HTTPS (TCP 443) para interfaces web. Faltaba SNMP, que es UDP.",
"<b>Requisito 4:</b> la regla HTTPS hacia Resultados aceptaba cualquier origen, incluidos los jugadores. Hay que limitarla a lo que entra por la interfaz de Internet de R1 (iif) o denegar explícitamente 10.1.1.0/24 antes.",
"<b>Requisito 5:</b> “Streaming → * UDP” permite enviar a todo Internet. Debe limitarse a la red IPv4 de costream.twitch.tv (se obtiene resolviendo el nombre y consultando su bloque con whois). El protocolo y puerto del envío también deberían acotarse.",
"<b>Requisito 6:</b> la regla GAMER → Juego por SCTP quedó sin IP destino (22.10.1.22).",
"<b>Requisito 7:</b> con política DROP ya se cumple, pero conviene una regla explícita en R1 que descarte todo lo que entre de Internet hacia 22.10.1.22.",
"<b>Requisito 8:</b> también los routers consultan DNS: hacen falta reglas en OUTPUT (y la respuesta en INPUT).",
"<b>Estado:</b> con reglas de ida y vuelta, cualquiera que use puerto de origen 443 o 53 atraviesa el firewall. Lo correcto es filtrado con estado: ct state established,related accept y reglas solo para conexiones nuevas.",
"<b>Punto b:</b> SSH sobre SCTP no resuelve el problema: autentica una sesión SSH, no el protocolo del juego, y además hay que modificar el cliente. La solución de la materia es una <b>VPN</b> (OpenVPN, WireGuard o IPsec) con autenticación por certificados o claves: concentrador VPN en el borde (en R1 o en una DMZ), se permite desde Internet solo el puerto de la VPN (p. ej. UDP 1194 o 51820) hacia el concentrador, y desde la red de clientes VPN se permite SCTP 5688 hacia el servidor de juego. El requisito 7 se mantiene: desde Internet directo no se llega al servidor."],
sol:`<div class="tbl"><table><tr><th>Router</th><th>Cadena</th><th>Origen</th><th>Destino</th><th>Proto</th><th>P. orig.</th><th>P. dest.</th><th>Acción</th><th>Comentario</th></tr>
<tr><td>R1, R2</td><td>*</td><td>*</td><td>*</td><td>*</td><td>*</td><td>*</td><td>DROP</td><td>Política por defecto (req. 9)</td></tr>
<tr><td>R1, R2</td><td>FORWARD, INPUT, OUTPUT</td><td colspan="5">ct state established,related</td><td>ACCEPT</td><td>Respuestas de conexiones permitidas</td></tr>
<tr><td>R1, R2</td><td>FORWARD</td><td>10.3.1.11</td><td>*</td><td>ICMP echo-request</td><td>-</td><td>-</td><td>ACCEPT</td><td>NOC verifica alcance (req. 1)</td></tr>
<tr><td>R1, R2</td><td>INPUT</td><td>10.3.1.11</td><td>router</td><td>ICMP echo-request</td><td>-</td><td>-</td><td>ACCEPT</td><td>NOC hace ping al router (req. 1)</td></tr>
<tr><td>R1, R2</td><td>FORWARD</td><td>10.3.1.11</td><td>redes internas</td><td>TCP</td><td>*</td><td>22, 443</td><td>ACCEPT</td><td>NOC configura equipos (req. 2)</td></tr>
<tr><td>R1, R2</td><td>FORWARD</td><td>10.3.1.11</td><td>redes internas</td><td>UDP</td><td>*</td><td>161</td><td>ACCEPT</td><td>NOC consulta y modifica por SNMP (req. 2)</td></tr>
<tr><td>R1, R2</td><td>INPUT</td><td>10.3.1.11</td><td>router</td><td>TCP / UDP</td><td>*</td><td>22 / 161</td><td>ACCEPT</td><td>NOC configura el router (req. 2)</td></tr>
<tr><td>R2</td><td>FORWARD</td><td>10.1.1.0/24</td><td>22.10.1.21</td><td>UDP</td><td>*</td><td>1550</td><td>ACCEPT</td><td>GAMER → Streaming (req. 3)</td></tr>
<tr><td>R2</td><td>FORWARD</td><td>10.1.1.0/24</td><td>22.10.1.21</td><td>TCP</td><td>*</td><td>1551</td><td>ACCEPT</td><td>GAMER → Streaming (req. 3)</td></tr>
<tr><td>R1</td><td>FORWARD (iif Internet)</td><td>*</td><td>22.10.1.23</td><td>TCP</td><td>*</td><td>443</td><td>ACCEPT</td><td>Resultados solo desde el exterior por HTTPS (req. 4)</td></tr>
<tr><td>R1</td><td>FORWARD</td><td>22.10.1.21</td><td>red de costream.twitch.tv</td><td>según protocolo</td><td>*</td><td>según protocolo</td><td>ACCEPT</td><td>Streaming → Twitch (req. 5)</td></tr>
<tr><td>R2</td><td>FORWARD</td><td>10.1.1.0/24</td><td>22.10.1.22</td><td>SCTP</td><td>*</td><td>5688</td><td>ACCEPT</td><td>Jugadores → servidor de Juego (req. 6)</td></tr>
<tr><td>R1</td><td>FORWARD (iif Internet)</td><td>*</td><td>22.10.1.22</td><td>*</td><td>*</td><td>*</td><td>DROP</td><td>Juego nunca desde Internet (req. 7)</td></tr>
<tr><td>R1, R2</td><td>FORWARD</td><td>redes internas</td><td>8.8.4.4</td><td>UDP / TCP</td><td>*</td><td>53</td><td>ACCEPT</td><td>DNS (req. 8)</td></tr>
<tr><td>R1, R2</td><td>OUTPUT</td><td>router</td><td>8.8.4.4</td><td>UDP / TCP</td><td>*</td><td>53</td><td>ACCEPT</td><td>DNS de los routers (req. 8)</td></tr></table></div>
<p><b>b)</b> Agregar un <b>concentrador VPN</b> (OpenVPN, WireGuard o IPsec) en el borde, en R1 o en una DMZ detrás de él. Cada competidor externo se autentica con certificado o clave. Cambios: en R1, permitir desde Internet solo el puerto de la VPN hacia el concentrador (por ejemplo UDP 1194 o UDP 51820) y, desde la red de túnel (por ejemplo 10.9.0.0/24), SCTP 5688 hacia 22.10.1.22. El requisito 7 se mantiene, porque desde Internet sin VPN no se llega al servidor.</p>`,
dev:{q:"Diseñá la ACL completa del escenario E-Sports y explicá cómo permitir competidores externos autenticados.",pts:["Política por defecto DROP","Filtrado con estado (established,related)","NOC: ICMP y gestión (SSH, SNMP) a todos, incluidos los routers (INPUT)","GAMER → Streaming UDP 1550 y TCP 1551","Resultados: HTTPS solo desde Internet (iif o deny a la LAN)","Streaming → solo la red de costream.twitch.tv","GAMER → Juego SCTP 5688","Juego sin acceso desde Internet","DNS a 8.8.4.4 desde todos, incluidos los routers (OUTPUT)","Punto b: VPN con autenticación en el borde y reglas para el puerto VPN y la red de túnel"],modelo:"Compará tu tabla con la <b>resolución sugerida</b> y las <b>observaciones</b> que están justo debajo."}}};

<script>
/* ======================= MOTOR ======================= */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const el=h=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild};
const norm=s=>s.toLowerCase().replace(/ñ/g,"\u0001").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\u0001/g,"ñ").replace(/\s+/g," ").trim();
const view=document.getElementById("view"),tabs=document.getElementById("tabs");
const fmt=n=>n.toFixed(1).replace(".",",");

/* Progreso: P[clave] = 1 correcto · 0,5 correcto con pista · 0 incorrecto · fracción en desarrollo */
let P=store.get("aygr2-prog",{});
const save=()=>store.set("aygr2-prog",P);
const KT={m:"mcq",v:"vf",f:"fill",c:"cid",w:"who",e:"err",o:"order",u:"match",d:"dev"};
function keysOf(m){const k=[];m.teo.forEach((_,i)=>k.push(m.id+":t"+i));Object.entries(KT).forEach(([c,f])=>m[f].forEach((_,i)=>k.push(m.id+":"+c+i)));k.push(m.id+":x0");return k}
function stat(keys){let d=0,sum=0,ans=0;keys.forEach(k=>{if(k in P){d++;const c=k.split(":")[1][0];if(c!=="t"&&c!=="x"){ans++;sum+=P[k]}}});return{d,t:keys.length,pct:Math.round(d/keys.length*100),acc:ans?Math.round(sum/ans*100):null}}
const ALL=M.flatMap(keysOf);
function rec(key,val){if(!key)return;const c=key.split(":")[1][0];P[key]=(c==="d"||!(key in P))?val:Math.max(P[key],val);save();refresh()}
function unrec(key){delete P[key];save();refresh()}
function refresh(){const s=stat(ALL);document.getElementById("gbar").style.width=s.pct+"%";document.getElementById("gpct").textContent=s.pct+" %";
  M.forEach(m=>{const b=tabs.querySelector(`[data-id="${m.id}"] .pc`);if(b)b.textContent=stat(keysOf(m)).pct+"%"});
  const mp=document.getElementById("modprog");if(mp){const m=M.find(x=>x.id===mp.dataset.id);const s2=stat(keysOf(m));mp.querySelector("i").style.width=s2.pct+"%";mp.querySelector("b").textContent=`${s2.pct} % · ${s2.d}/${s2.t}`+(s2.acc!==null?` · aciertos ${s2.acc} %`:"")}}
function itemByKey(key){const [id,code]=key.split(":");const m=M.find(x=>x.id===id);if(!m)return null;const f=KT[code[0]];return f?{m,type:code[0],x:m[f][+code.slice(1)]}:null}

(function(){const d=Math.ceil((new Date("2026-11-25T18:00:00-03:00")-new Date())/864e5);document.getElementById("countdown").textContent=d>1?`Faltan ${d} días`:d===1?"Es mañana":d===0?"Es hoy":"Ya pasó"})();

const TABS=[{id:"inicio",t:"Inicio"},...M.map(m=>({id:m.id,n:m.n,t:m.t.split(":")[0],mod:1})),{id:"guia",t:"Guía de estudio"},{id:"parciales",t:"Exámenes anteriores"},{id:"siglas",t:"Siglas"},{id:"contrarreloj",t:"Contrarreloj"},{id:"simulacro",t:"Simulacro"},{id:"repaso",t:"Repasar errores"},{id:"faltantes",t:"Qué falta"}];
TABS.forEach(t=>{const b=el(`<button role="tab" data-id="${t.id}">${t.n?`<span class="n">${t.n}</span>`:""}${t.t}${t.mod?'<span class="pc"></span>':""}</button>`);b.onclick=()=>{location.hash=t.id};tabs.appendChild(b)});
let timers=[];
function route(){timers.forEach(clearInterval);timers=[];const id=(location.hash||"#inicio").slice(1);const t=TABS.find(x=>x.id===id)?id:"inicio";
  tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===t));
  const a=tabs.querySelector(`[data-id="${t}"]`);if(a)a.scrollIntoView({block:"nearest",inline:"center"});
  view.innerHTML="";
  ({inicio:renderHome,parciales:renderParc,guia:renderGuia,siglas:renderSiglas,contrarreloj:renderCR,simulacro:renderSim,repaso:renderRepaso,faltantes:renderFalta}[t]||(()=>renderMod(M.find(m=>m.id===t))))();
  annotate(view);refresh();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);

/* ---------- Inicio ---------- */
function renderHome(){const s=stat(ALL);const wrong=Object.keys(P).filter(k=>P[k]===0&&!k.includes(":d")&&!k.includes(":x")).length;
  view.appendChild(el(`<div class="mod-head"><h2>Tu avance</h2></div>`));
  view.appendChild(el(`<div class="stats"><div class="stat"><div class="v">${s.pct} %</div><div class="l">del curso completado</div></div><div class="stat"><div class="v">${s.d}/${s.t}</div><div class="l">temas y ejercicios hechos</div></div><div class="stat"><div class="v">${s.acc!==null?s.acc+" %":"—"}</div><div class="l">de aciertos</div></div><div class="stat"><div class="v">${M.filter(m=>P[m.id+":x0"]===1).length}/${M.length}</div><div class="l">exámenes de módulo aprobados</div></div><div class="stat"><div class="v">${wrong}</div><div class="l">errores para repasar</div></div></div>`));
  view.appendChild(el(`<div class="card miss" style="border-left-color:var(--amber)"><h3 style="color:var(--amber)">Ojo: los parciales son de desarrollo</h3><p>Los parciales anteriores (2015 y final 2016) piden <b>explicar, comparar y esquematizar</b>, no marcar opciones. Usá los juegos para fijar datos, pero practicá sobre todo el paso <b>5 · Desarrollo</b>, la pestaña <b>Parciales anteriores</b> y el <b>parcial escrito</b> del Simulacro.</p></div>`));
  view.appendChild(el(`<div class="card"><h3>Cómo estudiar cada módulo</h3><ol><li><b>Teoría:</b> leé cada tema, respondé su <b>control rápido</b> y marcalo como leído.</li><li><b>Preguntas</b> y <b>Tarjetas:</b> repasá con las respuestas a la vista.</li><li><b>Práctica:</b> multiple choice, verdadero o falso, completar, ¿quién soy?, encontrá el error, ordenar y unir. Si te trabás, usá la <b>pista</b> (el acierto vale la mitad).</li><li><b>Desarrollo:</b> escribí la respuesta como en el parcial y autoevaluate con los puntos clave.</li><li><b>Examen del módulo:</b> 12 preguntas sin pistas. Se aprueba con 6.</li></ol><p>Al final: <b>Contrarreloj</b> para datos duros, <b>Simulacros</b> de 30 preguntas y <b>Repasar errores</b>. El progreso se guarda en este navegador.</p></div>`));
  const g=el(`<div class="grid2"></div>`);
  M.forEach(m=>{const s2=stat(keysOf(m));const ex=store.get("aygr2-exam-"+m.id,null);
    const c=el(`<button class="card modcard"><span class="kicker">${m.n} · ${m.fecha}${m.aviso?' · revisar con diapositivas':''}</span><h3>${m.t}</h3><div class="bar sm"><i style="width:${s2.pct}%"></i></div><div class="row"><span>${s2.pct} % · ${s2.d}/${s2.t}</span><span>${ex!==null?`<span class="badge${ex>=6?"":" no"}">examen ${fmt(ex)}</span>`:"sin examen"}</span></div></button>`);c.onclick=()=>location.hash=m.id;g.appendChild(c)});
  view.appendChild(g);
  const r=el(`<button class="btn ghost" style="margin-top:12px">Borrar mi progreso</button>`);let armed=false;r.onclick=()=>{if(!armed){armed=true;r.textContent="Tocá de nuevo para confirmar";return}P={};save();M.forEach(m=>store.set("aygr2-exam-"+m.id,null));route()};view.appendChild(r)}

/* ---------- Módulo ---------- */
function renderMod(m){
  view.appendChild(el(`<div class="mod-head"><span class="kicker">Módulo ${m.n} · ${m.fecha}</span><h2>${m.t}</h2><div><span class="tag${m.aviso?' warn':''}">${m.fuente}</span></div><div class="modprog" id="modprog" data-id="${m.id}"><div class="bar"><i></i></div><b></b></div></div>`));
  const nPr=m.mcq.length+m.vf.length+m.fill.length+m.cid.length+m.who.length+m.err.length+m.order.length+m.match.length;
  const parts=[["teo","1 · Teoría",m.teo.length],["qa","2 · Preguntas",m.qa.length+m.qap.length],["flash","3 · Tarjetas",0],["juegos","4 · Práctica",nPr],["dev","5 · Desarrollo",m.dev.length],["exam","6 · Examen",12]];
  const st=el(`<div class="subtabs"></div>`),body=el(`<div></div>`);let cur=store.get("aygr2-sub-"+m.id,"teo");if(!parts.some(p=>p[0]===cur))cur="teo";
  parts.forEach(([k,l,c])=>{const b=el(`<button aria-pressed="${k===cur}">${l}${c?`<span class="c">${c}</span>`:""}</button>`);b.onclick=()=>{timers.forEach(clearInterval);timers=[];cur=k;store.set("aygr2-sub-"+m.id,k);st.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");draw();st.scrollIntoView({block:"start"})};st.appendChild(b)});
  view.appendChild(st);view.appendChild(body);
  function draw(){body.innerHTML="";
    if(cur==="teo"){body.appendChild(el(`<p class="steps-hint">Después de cada tema hay un control rápido. Respondelo antes de seguir. Tocá cualquier sigla subrayada para ver qué significa.</p>`));const ms=SIGLAS.filter(x=>x[3]===m.id);if(ms.length)body.appendChild(el(`<details class="qa"><summary>Siglas de este módulo (${ms.length})</summary><div class="ans"><div class="tbl"><table><tr><th>Sigla</th><th>En inglés</th><th>Qué significa</th></tr>${ms.map(x=>`<tr><td><b>${x[0]}</b></td><td><i>${x[1]}</i></td><td>${x[2]}</td></tr>`).join("")}</table></div></div></details>`));
      m.teo.forEach((s,i)=>{const k=m.id+":t"+i;const c=el(`<section class="card${k in P?" read":""}"><h3>${s.h}</h3>${s.b}<button class="readbtn">${k in P?"✓ Leído":"Marcar como leído"}</button></section>`);
