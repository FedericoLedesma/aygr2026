function stat(keys){let d=0,sum=0,ans=0;keys.forEach(k=>{if(k in P){d++;const c=k.split(":")[1][0];if(c!=="t"&&c!=="x"){ans++;sum+=P[k]}}});return{d,t:keys.length,pct:Math.round(d/keys.length*100),acc:ans?Math.round(sum/ans*100):null}}
const ALL=M.flatMap(keysOf);
function rec(key,val){if(!key)return;const c=key.split(":")[1][0];P[key]=(c==="d"||!(key in P))?val:Math.max(P[key],val);save();refresh()}
function unrec(key){delete P[key];save();refresh()}
function refresh(){const s=stat(ALL);document.getElementById("gbar").style.width=s.pct+"%";document.getElementById("gpct").textContent=s.pct+" %";
  M.forEach(m=>{const b=tabs.querySelector(`[data-id="${m.id}"] .pc`);if(b)b.textContent=stat(keysOf(m)).pct+"%"});
  const mp=document.getElementById("modprog");if(mp){const m=M.find(x=>x.id===mp.dataset.id);const s2=stat(keysOf(m));mp.querySelector("i").style.width=s2.pct+"%";mp.querySelector("b").textContent=`${s2.pct} % · ${s2.d}/${s2.t}`+(s2.acc!==null?` · aciertos ${s2.acc} %`:"")}}
function itemByKey(key){const [id,code]=key.split(":");const m=M.find(x=>x.id===id);if(!m)return null;const f=KT[code[0]];return f?{m,type:code[0],x:m[f][+code.slice(1)]}:null}

(function(){const d=Math.ceil((new Date("2026-11-25T18:00:00-03:00")-new Date())/864e5);document.getElementById("countdown").textContent=d>1?`Faltan ${d} días`:d===1?"Es mañana":d===0?"Es hoy":"Ya pasó"})();

const TABS=[{id:"inicio",t:"Inicio"},...M.map(m=>({id:m.id,n:m.n,t:m.t.split(":")[0],mod:1})),{id:"guia",t:"Guía de estudio"},{id:"contrarreloj",t:"Contrarreloj"},{id:"simulacro",t:"Simulacro"},{id:"repaso",t:"Repasar errores"},{id:"faltantes",t:"Qué falta"}];
TABS.forEach(t=>{const b=el(`<button role="tab" data-id="${t.id}">${t.n?`<span class="n">${t.n}</span>`:""}${t.t}${t.mod?'<span class="pc"></span>':""}</button>`);b.onclick=()=>{location.hash=t.id};tabs.appendChild(b)});
let timers=[];
function route(){timers.forEach(clearInterval);timers=[];const id=(location.hash||"#inicio").slice(1);const t=TABS.find(x=>x.id===id)?id:"inicio";
  tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===t));
  const a=tabs.querySelector(`[data-id="${t}"]`);if(a)a.scrollIntoView({block:"nearest",inline:"center"});
  view.innerHTML="";
  ({inicio:renderHome,guia:renderGuia,contrarreloj:renderCR,simulacro:renderSim,repaso:renderRepaso,faltantes:renderFalta}[t]||(()=>renderMod(M.find(m=>m.id===t))))();
  refresh();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);

/* ---------- Inicio ---------- */
function renderHome(){const s=stat(ALL);const wrong=Object.keys(P).filter(k=>P[k]===0&&!k.includes(":d")&&!k.includes(":x")).length;
  view.appendChild(el(`<div class="mod-head"><h2>Tu avance</h2></div>`));
  view.appendChild(el(`<div class="stats"><div class="stat"><div class="v">${s.pct} %</div><div class="l">del curso completado</div></div><div class="stat"><div class="v">${s.d}/${s.t}</div><div class="l">temas y ejercicios hechos</div></div><div class="stat"><div class="v">${s.acc!==null?s.acc+" %":"—"}</div><div class="l">de aciertos</div></div><div class="stat"><div class="v">${M.filter(m=>P[m.id+":x0"]===1).length}/${M.length}</div><div class="l">exámenes de módulo aprobados</div></div><div class="stat"><div class="v">${wrong}</div><div class="l">errores para repasar</div></div></div>`));
  view.appendChild(el(`<div class="card"><h3>Cómo estudiar cada módulo</h3><ol><li><b>Teoría:</b> leé cada tema, respondé su <b>control rápido</b> y marcalo como leído.</li><li><b>Preguntas</b> y <b>Tarjetas:</b> repasá con las respuestas a la vista.</li><li><b>Práctica:</b> multiple choice, verdadero o falso, completar, ¿quién soy?, encontrá el error, ordenar y unir. Si te trabás, usá la <b>pista</b> (el acierto vale la mitad).</li><li><b>Desarrollo:</b> escribí la respuesta como en el parcial y autoevaluate con los puntos clave.</li><li><b>Examen del módulo:</b> 12 preguntas sin pistas. Se aprueba con 6.</li></ol><p>Al final: <b>Contrarreloj</b> para datos duros, <b>Simulacros</b> de 30 preguntas y <b>Repasar errores</b>. El progreso se guarda en este navegador.</p></div>`));
  const g=el(`<div class="grid2"></div>`);
  M.forEach(m=>{const s2=stat(keysOf(m));const ex=store.get("aygr2-exam-"+m.id,null);
    const c=el(`<button class="card modcard"><span class="kicker">${m.n} · ${m.fecha}${m.aviso?' · revisar con diapositivas':''}</span><h3>${m.t}</h3><div class="bar sm"><i style="width:${s2.pct}%"></i></div><div class="row"><span>${s2.pct} % · ${s2.d}/${s2.t}</span><span>${ex!==null?`<span class="badge${ex>=6?"":" no"}">examen ${fmt(ex)}</span>`:"sin examen"}</span></div></button>`);c.onclick=()=>location.hash=m.id;g.appendChild(c)});
  view.appendChild(g);
  const r=el(`<button class="btn ghost" style="margin-top:12px">Borrar mi progreso</button>`);let armed=false;r.onclick=()=>{if(!armed){armed=true;r.textContent="Tocá de nuevo para confirmar";return}P={};save();M.forEach(m=>store.set("aygr2-exam-"+m.id,null));route()};view.appendChild(r)}

/* ---------- Módulo ---------- */
function renderMod(m){
  view.appendChild(el(`<div class="mod-head"><span class="kicker">Módulo ${m.n} · ${m.fecha}</span><h2>${m.t}</h2><div><span class="tag${m.aviso?' warn':''}">${m.fuente}</span></div><div class="modprog" id="modprog" data-id="${m.id}"><div class="bar"><i></i></div><b></b></div></div>`));
  const nPr=m.mcq.length+m.vf.length+m.fill.length+m.who.length+m.err.length+m.order.length+m.match.length;
  const parts=[["teo","1 · Teoría",m.teo.length],["qa","2 · Preguntas",m.qa.length],["flash","3 · Tarjetas",0],["juegos","4 · Práctica",nPr],["dev","5 · Desarrollo",m.dev.length],["exam","6 · Examen",12]];
  const st=el(`<div class="subtabs"></div>`),body=el(`<div></div>`);let cur=store.get("aygr2-sub-"+m.id,"teo");if(!parts.some(p=>p[0]===cur))cur="teo";
  parts.forEach(([k,l,c])=>{const b=el(`<button aria-pressed="${k===cur}">${l}${c?`<span class="c">${c}</span>`:""}</button>`);b.onclick=()=>{timers.forEach(clearInterval);timers=[];cur=k;store.set("aygr2-sub-"+m.id,k);st.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");draw();st.scrollIntoView({block:"start"})};st.appendChild(b)});
  view.appendChild(st);view.appendChild(body);
  function draw(){body.innerHTML="";
    if(cur==="teo"){body.appendChild(el(`<p class="steps-hint">Después de cada tema hay un control rápido. Respondelo antes de seguir.</p>`));
      m.teo.forEach((s,i)=>{const k=m.id+":t"+i;const c=el(`<section class="card${k in P?" read":""}"><h3>${s.h}</h3>${s.b}<button class="readbtn">${k in P?"✓ Leído":"Marcar como leído"}</button></section>`);
      c.querySelector(".readbtn").onclick=e=>{if(k in P){unrec(k);c.classList.remove("read");e.target.textContent="Marcar como leído"}else{rec(k,1);c.classList.add("read");e.target.textContent="✓ Leído"}};body.appendChild(c);
      const ks=(m.ctl[i]||[]).filter(kk=>itemByKey(m.id+":"+kk));if(ks.length){const d=el(`<details class="ctl"><summary>Control rápido · ${ks.length} pregunta${ks.length>1?"s":""}</summary><div class="inner"></div></details>`);
        d.addEventListener("toggle",()=>{const inner=d.querySelector(".inner");if(d.open&&!inner.children.length)ks.forEach(kk=>{const n=render(m.id+":"+kk,{hint:true});if(n)inner.appendChild(n)})},{once:false});body.appendChild(d)}})}
    if(cur==="qa")m.qa.forEach(([q,a])=>body.appendChild(el(`<details class="qa"><summary>${q}</summary><div class="ans">${a}</div></details>`)));
    if(cur==="flash")flash(body,[...m.qa,...m.mcq.map(x=>[x.q,x.o[x.a]+(x.e?". "+x.e:"")]),...m.fill.map(x=>[x.q,x.e]),...m.dev.map(x=>[x.q,x.modelo])]);
    if(cur==="juegos"){
      if(m.calc)calc(body);if(m.cipher)cipher(body);if(m.alicia)alicia(body,m);
      const sec=(t,n,sub)=>{if(n)body.appendChild(el(`<h3 class="sec-title">${t}<span>${n}</span></h3>`));if(n&&sub)body.appendChild(el(`<p class="steps-hint">${sub}</p>`))};
      const grp=(c,t,sub)=>{const f=KT[c];sec(t,m[f].length,sub);m[f].forEach((_,i)=>body.appendChild(render(m.id+":"+c+i,{hint:true})))};
      grp("m","Multiple choice");grp("v","Verdadero o falso");grp("f","Completar");grp("w","¿Quién soy?","Adiviná con la menor cantidad de pistas posible.");grp("e","Encontrá el error","Tocá la línea que está mal.");grp("o","Ordenar y armar paquetes");grp("u","Unir conceptos");}
    if(cur==="dev")m.dev.forEach((x,i)=>body.appendChild(dev(x,m.id+":d"+i)));
    if(cur==="exam")exam(body,m);}
  draw()}

function render(key,opts={}){const it=itemByKey(key);if(!it||!it.x)return null;const f={m:mcq,v:vf,f:fill,w:who,e:errq,o:order,u:match}[it.type];return f?f(it.x,key,opts):null}
function setDone(c,key,val){if(key)rec(key,val);c.classList.remove("done-ok","done-bad");c.classList.add(val>0?"done-ok":"done-bad")}
function initDone(c,key){if(key&&key in P)c.classList.add(P[key]>0?"done-ok":"done-bad");return c}
function verdict(ok,hint){return ok?(hint?"<b>Correcto, con pista.</b>":"<b>Correcto.</b>"):"<b>No.</b>"}

/* ---------- Ejercicios ---------- */
function mcq(x,key,o={}){const c=el(`<div class="quiz"><div class="q">${o.label||""}${x.q}</div><div class="opts"></div></div>`);const box=c.querySelector(".opts");
  function build(){box.innerHTML="";c.querySelectorAll(".expl,.retry,.hint").forEach(e=>e.remove());let used=false;
    const btns=shuffle(x.o.map((t,i)=>({t,i}))).map(({t,i})=>{const b=el(`<button class="opt">${t}</button>`);b.dataset.i=i;b.onclick=()=>{
      box.querySelectorAll("button").forEach(y=>y.disabled=true);const ok=i===x.a;b.classList.add(ok?"ok":"bad");
      if(!ok)box.querySelector(`[data-i="${x.a}"]`).classList.add("ok");if(h)h.disabled=true;
      c.appendChild(el(`<div class="expl">${verdict(ok,used)} ${ok?"":"La respuesta es: "+x.o[x.a]+". "}${x.e||""}</div>`));
      if(!o.cb){const r=el(`<button class="retry">Volver a intentar</button>`);r.onclick=build;c.appendChild(r)}
      setDone(c,key,ok?(used?.5:1):0);if(o.cb)o.cb(ok)};box.appendChild(b);return b});
    let h=null;if(o.hint&&x.o.length>2){h=el(`<button class="hint">Pista: descartar opciones</button>`);h.onclick=()=>{used=true;h.disabled=true;const wrong=shuffle(btns.filter(b=>+b.dataset.i!==x.a)).slice(0,x.o.length>=4?2:1);wrong.forEach(b=>{b.disabled=true;b.classList.add("gone")})};c.appendChild(h)}}
  build();return initDone(c,key)}
function vf(x,key,o={}){const [s,v,e]=x;const c=el(`<div class="quiz"><div class="q">${o.label||""}${s}</div><div class="vf-row"><button class="opt">Verdadero</button><button class="opt">Falso</button></div></div>`);
  const [bv,bf]=c.querySelectorAll(".opt");[[bv,true],[bf,false]].forEach(([b,val])=>b.onclick=()=>{bv.disabled=bf.disabled=true;const ok=val===v;b.classList.add(ok?"ok":"bad");if(!ok)(v?bv:bf).classList.add("ok");c.appendChild(el(`<div class="expl">${verdict(ok)} Es ${v?"verdadero":"falso"}. ${e||""}</div>`));setDone(c,key,ok?1:0);if(o.cb)o.cb(ok)});
  return initDone(c,key)}
function fill(x,key,o={}){const id="f"+Math.random().toString(36).slice(2,8);const c=el(`<div class="quiz"><label class="q" for="${id}" style="display:block">${o.label||""}${x.q}</label><form class="fill-row"><input id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tu respuesta"><button class="btn">Comprobar</button></form></div>`);
  const f=c.querySelector("form"),inp=c.querySelector("input");let used=false,h=null;
  if(o.hint){h=el(`<button class="hint">Pista: primera letra</button>`);h.onclick=()=>{used=true;h.disabled=true;const a=x.a[0];c.appendChild(el(`<div class="hinttxt">Empieza con “${a[0].toUpperCase()}” y tiene ${a.length} caracteres.</div>`))};c.appendChild(h)}
  f.onsubmit=ev=>{ev.preventDefault();if(!inp.value.trim()||inp.disabled)return;const ok=x.a.some(a=>norm(a)===norm(inp.value));inp.disabled=true;f.querySelector("button").disabled=true;if(h)h.disabled=true;
    c.appendChild(el(`<div class="expl">${verdict(ok,used)} ${x.e}</div>`));setDone(c,key,ok?(used?.5:1):0);if(o.cb)o.cb(ok)};
  return initDone(c,key)}
function who(x,key,o={}){const c=el(`<div class="quiz"><div class="q">${o.label||""}¿Quién soy?</div><ol class="clues"></ol><button class="hint">Otra pista</button><div class="opts" style="margin-top:10px"></div></div>`);
  const ol=c.querySelector(".clues"),h=c.querySelector(".hint"),box=c.querySelector(".opts");let n=0;
  const show=()=>{ol.appendChild(el(`<li>${x.p[n]}</li>`));n++;if(n>=x.p.length){h.disabled=true;h.textContent="No hay más pistas"}};show();h.onclick=show;
  shuffle(x.o.map((t,i)=>({t,i}))).forEach(({t,i})=>{const b=el(`<button class="opt">${t}</button>`);b.dataset.i=i;b.onclick=()=>{box.querySelectorAll("button").forEach(y=>y.disabled=true);h.disabled=true;const ok=i===x.a;b.classList.add(ok?"ok":"bad");if(!ok)box.querySelector(`[data-i="${x.a}"]`).classList.add("ok");
    const val=ok?(n<=Math.ceil(x.p.length/2)?1:.5):0;c.appendChild(el(`<div class="expl">${ok?`<b>¡Sí!</b> Con ${n} de ${x.p.length} pistas${val===1?".":" (vale la mitad)."}`:`<b>No.</b> Era ${x.o[x.a]}.`} ${x.e||""}</div>`));setDone(c,key,val);if(o.cb)o.cb(ok)};box.appendChild(b)});
  if(o.exam){while(n<x.p.length)show();h.remove()}
  return initDone(c,key)}
function errq(x,key,o={}){const c=el(`<div class="quiz"><div class="q">${o.label||""}${x.t}</div><div class="codeln"></div></div>`);const box=c.querySelector(".codeln");let used=false;
  const bs=x.l.map((t,i)=>{const b=el(`<button></button>`);b.textContent=t;b.onclick=()=>{bs.forEach(y=>y.disabled=true);if(h)h.disabled=true;const ok=i===x.a;b.classList.add(ok?"ok":"bad");if(!ok)bs[x.a].classList.add("ok");
    c.appendChild(el(`<div class="expl">${ok?(used?"<b>Lo encontraste, con pista.</b>":"<b>Lo encontraste.</b>"):"<b>No es esa.</b> La línea con error es la "+(x.a+1)+"."} ${x.e}</div>`));setDone(c,key,ok?(used?.5:1):0);if(o.cb)o.cb(ok)};box.appendChild(b);return b});
  let h=null;if(o.hint){h=el(`<button class="hint">Pista: descartar una línea</button>`);h.onclick=()=>{used=true;h.disabled=true;const okl=shuffle(bs.filter((_,i)=>i!==x.a))[0];okl.disabled=true;okl.style.opacity=".4";okl.title="Esta línea está bien"};c.appendChild(h)}
  return initDone(c,key)}
function order(x,key,o={}){const c=el(`<div class="quiz"><div class="q">${x.t}</div><ol class="order-list"></ol><div class="btns"><button class="btn">Comprobar</button><button class="btn ghost">Mezclar</button></div><div class="res"></div></div>`);
  const ol=c.querySelector("ol");let items=shuffle(x.items),used=false;if(items.join()===x.items.join())items=items.slice().reverse();
  function draw(){ol.innerHTML="";items.forEach((t,i)=>{const li=el(`<li><span class="pos">${i+1}</span><span class="txt">${t}</span><button class="mv" aria-label="Subir">↑</button><button class="mv" aria-label="Bajar">↓</button></li>`);
    const [u,d]=li.querySelectorAll(".mv");u.disabled=i===0;d.disabled=i===items.length-1;
    u.onclick=()=>{[items[i-1],items[i]]=[items[i],items[i-1]];draw()};d.onclick=()=>{[items[i+1],items[i]]=[items[i],items[i+1]];draw()};ol.appendChild(li)})}
  draw();const [chk,mix]=c.querySelectorAll(".btns .btn");const res=c.querySelector(".res");
  if(o.hint){const h=el(`<button class="btn ghost">Pista</button>`);h.onclick=()=>{used=true;const i=items.findIndex((t,j)=>t!==x.items[j]);if(i<0)return;const j=items.indexOf(x.items[i]);[items[i],items[j]]=[items[j],items[i]];draw();res.innerHTML=`<div class="hinttxt">Ubiqué el paso ${i+1}.</div>`};c.querySelector(".btns").appendChild(h)}
  chk.onclick=()=>{let n=0;ol.querySelectorAll("li").forEach((li,i)=>{const ok=items[i]===x.items[i];if(ok)n++;li.classList.add(ok?"ok":"bad")});const all=n===items.length;
    res.innerHTML=`<div class="expl">${all?(used?"<b>¡Bien, con pista!</b>":"<b>¡Perfecto!</b>"):`<b>${n} de ${items.length} en su lugar.</b> Orden correcto: ${x.items.map((t,i)=>`${i+1}) ${t}`).join(" · ")}`}</div>`;setDone(c,key,all?(used?.5:1):0)};
  mix.onclick=()=>{items=shuffle(x.items);res.innerHTML="";draw()};return initDone(c,key)}
function match(x,key,o={}){const c=el(`<div class="quiz"><div class="q">${x.t}</div><p class="note" style="margin:0 0 8px">Tocá un concepto de la izquierda y después su pareja a la derecha.</p><div class="match"><div class="col L"></div><div class="col R"></div></div><div class="res"></div></div>`);
  const L=c.querySelector(".L"),R=c.querySelector(".R");let sel=null,ok=0,err=0,used=false;
  const pair=(a,b)=>{a.classList.remove("sel");a.classList.add("done");b.classList.add("done");sel=null;ok++;if(ok===x.p.length){const val=err<=1?(used?.5:1):0;c.querySelector(".res").innerHTML=`<div class="expl"><b>¡Completo!</b> ${err?`Con ${err} intento${err>1?"s":""} errado${err>1?"s":""}.`:"Sin errores."}${used?" Usaste pista.":""}</div>`;setDone(c,key,val)}};
  shuffle(x.p.map((p,i)=>({t:p[0],i}))).forEach(q=>{const b=el(`<button class="chip">${q.t}</button>`);b.dataset.i=q.i;b.onclick=()=>{if(b.classList.contains("done"))return;L.querySelectorAll(".chip").forEach(y=>y.classList.remove("sel"));b.classList.add("sel");sel=b};L.appendChild(b)});
  shuffle(x.p.map((p,i)=>({t:p[1],i}))).forEach(q=>{const b=el(`<button class="chip">${q.t}</button>`);b.dataset.i=q.i;b.onclick=()=>{if(!sel||b.classList.contains("done"))return;
    if(sel.dataset.i===b.dataset.i)pair(sel,b);else{err++;b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong")}};R.appendChild(b)});
  if(o.hint){const h=el(`<button class="hint">Pista: unir un par</button>`);h.onclick=()=>{const a=[...L.querySelectorAll(".chip:not(.done)")][0];if(!a)return;used=true;const b=R.querySelector(`.chip[data-i="${a.dataset.i}"]`);pair(a,b)};c.appendChild(h)}
  return initDone(c,key)}
function dev(x,key){const c=el(`<div class="quiz"><div class="q">${x.q}</div><textarea placeholder="Escribí tu respuesta como en el parcial…" aria-label="Tu respuesta"></textarea><div class="btns"><button class="btn">Ver respuesta modelo y autoevaluarme</button></div><div class="res"></div></div>`);
  const ta=c.querySelector("textarea");ta.value=store.get("aygr2-dev-"+key,"");ta.oninput=()=>store.set("aygr2-dev-"+key,ta.value);
  c.querySelector(".btn").onclick=()=>{const res=c.querySelector(".res");if(res.children.length)return;
    res.appendChild(el(`<p class="note" style="margin:10px 0 4px">Marcá los puntos que incluiste en tu respuesta:</p>`));
    const ul=el(`<ul class="pts"></ul>`);const sc=el(`<div class="expl"></div>`);
    const upd=()=>{const n=[...ul.querySelectorAll("input")].filter(i=>i.checked).length;const v=n/x.pts.length;sc.innerHTML=`<b>${n} de ${x.pts.length} puntos clave</b> → ${fmt(v*10)} / 10`;setDone(c,key,v);if(v<.6)c.classList.replace("done-ok","done-bad")};
    x.pts.forEach(p=>{const li=el(`<li><label><input type="checkbox"><span>${p}</span></label></li>`);li.querySelector("input").onchange=upd;ul.appendChild(li)});
    res.appendChild(ul);res.appendChild(el(`<details class="qa" open><summary>Respuesta modelo</summary><div class="ans">${x.modelo}</div></details>`));res.appendChild(sc);upd()};
  return initDone(c,key)}
function flash(body,cards){let i=0,back=false,deck=shuffle(cards);
  const w=el(`<div><div class="fcard" tabindex="0" role="button"></div><div class="frow"><button class="btn ghost">← Anterior</button><span></span><button class="btn ghost">Siguiente →</button></div><div class="btns"><button class="btn ghost">Mezclar</button></div></div>`);
  const fc=w.querySelector(".fcard"),[prev,next,mix]=w.querySelectorAll("button"),sc=w.querySelector(".frow span");
  function draw(){const [q,a]=deck[i];fc.innerHTML=`<span class="side">${back?"RESPUESTA":"PREGUNTA · tocá para dar vuelta"}</span><div class="big">${back?a:q}</div>`;sc.textContent=`${i+1} / ${deck.length}`}
  fc.onclick=()=>{back=!back;draw()};fc.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();back=!back;draw()}};
  prev.onclick=()=>{i=(i-1+deck.length)%deck.length;back=false;draw()};next.onclick=()=>{i=(i+1)%deck.length;back=false;draw()};mix.onclick=()=>{deck=shuffle(cards);i=0;back=false;draw()};
  draw();body.appendChild(w)}

/* ---------- Herramientas ---------- */
function calc(body){const C={"G.711":64,"G.722":64,"G.726 (32k)":32,"G.729":8,"G.723.1 (6,3k)":6.3,"GSM":13,"iLBC (15,2k)":15.2,"Opus (24k)":24};
  const c=el(`<div class="card"><h3>Calculadora: ancho de banda de una llamada</h3><p class="note">(carga + encabezados) × 8 × paquetes por segundo, como el ejemplo de G.711 de la cátedra.</p>
  <div class="calc"><label for="cc">Códec<select id="cc">${Object.keys(C).map(k=>`<option>${k}</option>`).join("")}</select></label>
  <label for="cp">Paquetización (ms)<select id="cp"><option>10</option><option selected>20</option><option>30</option><option>40</option></select></label>
  <label for="ch">Encabezados (bytes)<select id="ch"><option value="62" selected>62 · Eth 22 + IP 20 + UDP/RTP 20</option><option value="40">40 · IP + UDP + RTP</option><option value="66">66 · con 802.1Q</option></select></label></div>
  <div class="out" id="co"></div></div>`);body.appendChild(c);
  const f=()=>{const kbps=C[c.querySelector("#cc").value],ms=+c.querySelector("#cp").value,h=+c.querySelector("#ch").value;const pps=1000/ms,pay=kbps*ms/8,tot=(pay+h)*8*pps;
    c.querySelector("#co").innerHTML=`Paquetes/s: ${pps.toFixed(1)} · Carga: ${pay.toFixed(1)} B · Paquete: ${(pay+h).toFixed(1)} B<br><b>${Math.round(tot).toLocaleString("es-AR")} bps (${(tot/1000).toFixed(1)} kbps) por sentido</b> · overhead ${(h/(pay+h)*100).toFixed(0)} %`};
  c.querySelectorAll("select").forEach(s=>s.onchange=f);f();
  body.appendChild(mcq({q:"Práctica: G.729 (8 kbps) a 20 ms con 62 bytes de encabezado. ¿Cuántos bps por sentido?",o:["8.000 bps","24.800 bps","32.800 bps","88.800 bps"],a:2,e:"Carga 20 B; (20+62)×8×50 = 32.800 bps."},null,{hint:true}));
  body.appendChild(mcq({q:"Práctica: G.711 a 30 ms con 62 bytes de encabezado. ¿Cuántos bps por sentido?",o:["64.000","80.533","88.800","96.000"],a:1,e:"Carga 240 B; (240+62)×8×33,3 ≈ 80.533 bps."},null,{hint:true}))}
function cipher(body){const A="ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
  const c=el(`<div class="card"><h3>Cifrador: César y Vigenère (27 letras, con Ñ)</h3>
  <div class="calc"><label for="ct">Texto<input id="ct" value="ESTO ES SECRETO"></label><label for="ck">Clave Vigenère<input id="ck" value="CLAVE"></label><label for="cd">Desplazamiento César<input id="cd" type="number" value="3" min="0" max="26"></label></div>
  <div class="out" id="cout"></div><p class="note">Con ESTO ES SECRETO y CLAVE da GDTK IU DEXVGEO, como en la diapositiva.</p></div>`);body.appendChild(c);
  const f=()=>{const t=c.querySelector("#ct").value.toUpperCase(),k=c.querySelector("#ck").value.toUpperCase().split("").filter(x=>A.includes(x)),d=+c.querySelector("#cd").value||0;
    const ces=[...t].map(ch=>A.includes(ch)?A[(A.indexOf(ch)+d)%27]:ch).join("");let j=0;
    const vig=k.length?[...t].map(ch=>{if(!A.includes(ch))return ch;const r=A[(A.indexOf(ch)+A.indexOf(k[j%k.length]))%27];j++;return r}).join(""):"(escribí una clave)";
    c.querySelector("#cout").innerHTML=`César (+${d}): <b>${ces}</b><br>Vigenère: <b>${vig}</b>`};
  c.querySelectorAll("input").forEach(i=>i.oninput=f);f()}
function alicia(body,m){const H=["Conf.","Integr.","Autent.","No rep."];const st=ALICIA.map(()=>[0,0,0,0]);
  const c=el(`<div class="card"><h3>Tabla interactiva: Alicia y Beto (TP OpenPGP)</h3><p class="note">Tocá cada casilla para marcar qué servicios se logran en cada escenario y comprobá.</p><div class="tbl"><table class="alicia"><tr><th>Escenario</th>${H.map(h=>`<th>${h}</th>`).join("")}</tr></table></div><div class="btns"><button class="btn">Comprobar</button></div><div class="res"></div></div>`);
  const tb=c.querySelector("table");ALICIA.forEach(([t],r)=>{const tr=el(`<tr><td>${t}</td>${H.map((_,k)=>`<td><button data-r="${r}" data-k="${k}">No</button></td>`).join("")}</tr>`);tb.appendChild(tr)});
  tb.querySelectorAll("button").forEach(b=>b.onclick=()=>{const r=+b.dataset.r,k=+b.dataset.k;st[r][k]^=1;b.textContent=st[r][k]?"Sí":"No";b.classList.toggle("y",!!st[r][k]);b.classList.remove("ok","bad")});
  c.querySelector(".btn").onclick=()=>{let n=0;tb.querySelectorAll("button").forEach(b=>{const r=+b.dataset.r,k=+b.dataset.k;const ok=st[r][k]===ALICIA[r][1][k];if(ok)n++;b.classList.remove("ok","bad");b.classList.add(ok?"ok":"bad")});
    c.querySelector(".res").innerHTML=`<div class="expl"><b>${n} de 32 casillas correctas.</b> Claves: 2 solo da confidencialidad a la propia Alicia; 4 es imposible (nadie tiene la privada ajena); 5 no sirve porque solo Beto podría verificar; 8 no da no repudio real porque la firma va sobre el texto cifrado.</div>`};
  body.appendChild(c)}

/* ---------- Examen de módulo ---------- */
function exam(body,m){const best=store.get("aygr2-exam-"+m.id,null);
  const intro=el(`<div class="card"><h3>Examen del módulo ${m.n}</h3><p>12 preguntas al azar del módulo, <b>sin pistas</b>: multiple choice, verdadero o falso, completar, ¿quién soy? y encontrá el error. Se aprueba con 6. Tenés un cronómetro para medir tu ritmo.</p>${best!==null?`<p>Tu mejor nota: <span class="badge${best>=6?"":" no"}">${fmt(best)} / 10</span></p>`:""}<button class="btn">Empezar examen</button></div>`);
  body.appendChild(intro);intro.querySelector(".btn").onclick=()=>{body.innerHTML="";
    const pool=[];["m","v","f","w","e"].forEach(c=>m[KT[c]].forEach((_,i)=>pool.push(m.id+":"+c+i)));
    const qs=shuffle(pool).slice(0,12);let ans=0,ok=0;const t0=Date.now();
    const top=el(`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="timer">00:00</span><span class="note" id="exs">0/12 respondidas</span></div>`);body.appendChild(top);
    timers.push(setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);top.querySelector(".timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1000));
    const fin=el(`<div></div>`);
    qs.forEach((k,i)=>{const n=render(k,{label:`${i+1}. `,exam:true,cb:r=>{ans++;if(r)ok++;top.querySelector("#exs").textContent=`${ans}/12 respondidas`;if(ans===12)finish()}});n.classList.remove("done-ok","done-bad");body.appendChild(n)});
    body.appendChild(fin);
    function finish(){timers.forEach(clearInterval);const nota=ok/12*10;const prev=store.get("aygr2-exam-"+m.id,null);store.set("aygr2-exam-"+m.id,prev===null?nota:Math.max(prev,nota));rec(m.id+":x0",nota>=6?1:0);
      const s=Math.floor((Date.now()-t0)/1000);fin.appendChild(el(`<div class="card ${nota>=6?"read":"miss"}"><h3>Nota: ${fmt(nota)} / 10 · ${nota>=6?"Aprobado":"Desaprobado"}</h3><p>${ok} de 12 correctas en ${Math.floor(s/60)} min ${s%60} s. ${nota>=6?"Pasá al siguiente módulo o repetí para subir la nota.":"Repasá la teoría y los errores de este módulo y volvé a intentarlo."}</p></div>`));
      const b=el(`<button class="btn">Hacer otro examen</button>`);b.onclick=()=>exam((body.innerHTML="",body),m);fin.appendChild(b);fin.scrollIntoView({behavior:"smooth"})}}}

/* ---------- Contrarreloj ---------- */
function renderCR(){const best=store.get("aygr2-cr-best",0);
  view.appendChild(el(`<div class="mod-head"><h2>Contrarreloj</h2><p class="sub">60 segundos para responder la mayor cantidad posible de preguntas de multiple choice y verdadero o falso de todos los módulos. Cada error resta 5 segundos. Récord: <b>${best}</b>.</p></div>`));
  const box=el(`<div></div>`);view.appendChild(box);const go=el(`<button class="btn">Empezar</button>`);box.appendChild(go);
  go.onclick=()=>{box.innerHTML="";const pool=[];M.forEach(m=>{m.mcq.forEach(x=>pool.push({t:"m",x,mod:m.n}));m.vf.forEach(x=>pool.push({t:"v",x,mod:m.n}))});let deck=shuffle(pool),i=0,pts=0,streak=0,maxs=0,left=60;
    const top=el(`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:92px;z-index:2"><span class="timer">60</span><span class="note">Puntos <b id="crp">0</b> · Racha <b id="crs">0</b></span></div>`);const area=el(`<div></div>`);box.appendChild(top);box.appendChild(area);
    const end=()=>{timers.forEach(clearInterval);area.innerHTML="";const nb=Math.max(best,pts);store.set("aygr2-cr-best",nb);area.appendChild(el(`<div class="card"><h3>Tiempo: ${pts} puntos</h3><p>Racha máxima: ${maxs}. ${pts>best?"¡Nuevo récord!":"Récord: "+best}</p></div>`));const b=el(`<button class="btn">Jugar de nuevo</button>`);b.onclick=route;area.appendChild(b)};
    timers.push(setInterval(()=>{left--;top.querySelector(".timer").textContent=Math.max(0,left);if(left<=0)end()},1000));
    const next=()=>{if(left<=0)return;area.innerHTML="";const p=deck[i++%deck.length];const q=p.t==="m"?p.x.q:p.x[0];const opts=p.t==="m"?shuffle(p.x.o.map((t,j)=>({t,ok:j===p.x.a}))):[{t:"Verdadero",ok:p.x[1]===true},{t:"Falso",ok:p.x[1]===false}];
      const c=el(`<div class="quiz"><span class="kicker">Módulo ${p.mod}</span><div class="q">${q}</div><div class="opts"></div></div>`);
      opts.forEach(o=>{const b=el(`<button class="opt">${o.t}</button>`);b.onclick=()=>{c.querySelectorAll(".opt").forEach(y=>y.disabled=true);b.classList.add(o.ok?"ok":"bad");if(o.ok){pts++;streak++;maxs=Math.max(maxs,streak)}else{streak=0;left-=5;[...c.querySelectorAll(".opt")].find((y,j)=>opts[j].ok).classList.add("ok")}
        top.querySelector("#crp").textContent=pts;top.querySelector("#crs").textContent=streak;setTimeout(next,o.ok?350:1100)};c.querySelector(".opts").appendChild(b)});area.appendChild(c)};next()}}

/* ---------- Guía, simulacro, repaso, faltantes ---------- */
function renderGuia(){view.appendChild(el(`<div class="mod-head"><h2>Guía de estudio respondida</h2><p class="sub">Las guías de lectura de las prácticas, las preguntas de las consignas y las que aparecen en las diapositivas, con respuesta modelo.</p></div>`));
  GUIA.forEach(g=>{view.appendChild(el(`<h3 class="sec-title">${g.t}<span>${g.q.length}</span></h3>`));g.q.forEach(([q,a],i)=>view.appendChild(el(`<details class="qa"><summary>${i+1}. ${q}</summary><div class="ans">${a}</div></details>`)))})}
function renderSim(){view.appendChild(el(`<div class="mod-head"><h2>Simulacro de parcial</h2><p class="sub">30 preguntas al azar de los módulos 01 a 07, sin pistas. Se aprueba con 6.</p></div>`));
  const pool=[];M.filter(m=>m.id!=="sdn").forEach(m=>["m","v","f","w","e"].forEach(c=>m[KT[c]].forEach((_,i)=>pool.push({k:m.id+":"+c+i,mod:m.t}))));
  const qs=shuffle(pool).slice(0,30);let ans=0,ok=0;
  const res=el(`<div class="sim-res"></div>`);const upd=()=>{res.innerHTML=`Respondidas ${ans}/30 · Correctas ${ok}`+(ans===30?` · <b>Nota: ${fmt(ok/3)} / 10 — ${ok>=18?"aprobado":"a seguir practicando"}</b>`:"")};
  qs.forEach((p,i)=>{const c=render(p.k,{label:`${i+1}. `,exam:true,cb:r=>{ans++;if(r)ok++;upd()}});c.classList.remove("done-ok","done-bad");c.prepend(el(`<span class="kicker">${p.mod}</span>`));view.appendChild(c)});
  upd();view.appendChild(res);const b=el(`<button class="btn" style="margin-top:12px">Nuevo simulacro</button>`);b.onclick=route;view.appendChild(b)}
function renderRepaso(){const wrong=Object.keys(P).filter(k=>P[k]===0&&itemByKey(k)&&!k.includes(":d"));const half=Object.keys(P).filter(k=>P[k]===.5);
  view.appendChild(el(`<div class="mod-head"><h2>Repasar errores</h2><p class="sub">Lo que respondiste mal. Al acertarlo, sale de la lista. Abajo, lo que acertaste solo con pista.</p></div>`));
  if(!wrong.length&&!half.length){view.appendChild(el(`<div class="card"><p>No tenés errores pendientes. Hacé la práctica de cada módulo o un simulacro.</p></div>`));return}
  const show=(ks,t)=>{if(!ks.length)return;view.appendChild(el(`<h3 class="sec-title">${t}<span>${ks.length}</span></h3>`));ks.forEach(k=>{const it=itemByKey(k);const c=render(k,{hint:false});if(c){c.prepend(el(`<span class="kicker">${it.m.n} · ${it.m.t}</span>`));view.appendChild(c)}})};
  show(wrong,"Respondidas mal");show(half,"Acertadas con pista")}
function renderFalta(){view.appendChild(el(`<div class="mod-head"><h2>Qué falta o no se pudo revisar</h2><p class="sub">Revisado en labredes.unlu.edu.ar/aygr2026 el 04/11/2026, cronograma de Luján.</p></div>`));
  FALTA.forEach(([h,b])=>view.appendChild(el(`<div class="card miss"><h3>${h}</h3><p>${b}</p></div>`)))}
route();

</script>
